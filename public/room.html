<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>锐智工厂 · 车间</title>
<style>
:root{
  --bg:#0b0e1a; --floor:#141a2e; --road:#1b2339; --roadline:#3a4568;
  --text:#e8eaf0; --dim:#9aa3bd; --amber:#ffb340; --green:#00e676; --red:#ff5252;
  --border:#2c3552;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;min-height:100dvh;min-height:100vh;overflow-x:hidden}
/* ===== RPG 室内场景（俯视工坊风 · 8bit · 延伸房间+摄像机跟随） ===== */
/* 可视窗（固定大小），内部 rs-stage 横向延伸，画面随人物移动 */
.room-scene{position:relative;height:400px;margin:0 18px 12px;border-radius:2px;overflow:hidden;
  border:10px solid #2a3352;box-shadow:inset 0 0 0 2px #0a0d18, 0 4px 0 rgba(0,0,0,.35);background:#141a30}
/* 横屏：俯视场景高度撑满右栏 */
@media (orientation:landscape) and (max-width:960px) and (max-height:600px){
  .room-scene{height:calc(100vh - 40px);max-height:420px}
}
.rs-stage{position:absolute;top:0;left:0;height:100%;will-change:transform}
/* 地板：8bit 木板像素格（铺满整条延伸房间） */
.rs-floor{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,#1c2340 0 16px,#19203a 16px 32px),
  repeating-linear-gradient(0deg,#1b223d 0 16px,#182039 16px 32px)}
.rs-floor::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, rgba(255,179,64,.05), transparent 55%)}
/* 外轮廓墙：上下左右四面 */
.rs-wall{position:absolute;background:
  repeating-linear-gradient(90deg,#3a4568 0 12px,#313c5c 12px 24px);z-index:3}
.rs-wall.t{top:0;left:0;right:0;height:12px}
.rs-wall.b{bottom:0;left:0;right:0;height:12px;background:
  repeating-linear-gradient(90deg,#313c5c 0 12px,#3a4568 12px 24px)}
.rs-wall.l{left:0;top:0;bottom:0;width:16px}
.rs-wall.r{right:0;top:0;bottom:0;width:16px}
/* 内墙（房间隔断，带门洞）：竖墙分上/下两段，中间留门洞 */
.rs-part{position:absolute;width:16px;z-index:5}
.rs-inwall{position:absolute;left:0;right:0;background:
  repeating-linear-gradient(180deg,#3a4568 0 12px,#313c5c 12px 24px);
  border-left:2px solid #0a0d18;border-right:2px solid #0a0d18;box-shadow:3px 0 0 rgba(0,0,0,.3)}
/* 门（顶部墙开口，房间入口） */
.rs-door{position:absolute;top:-2px;left:40px;width:56px;height:16px;background:#2a3852;border:2px solid #0a0d18;z-index:6}
.rs-door::after{content:"🚪";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px}
/* 楼层标牌 */
.rs-label{position:absolute;top:16px;left:8px;font-size:11px;color:var(--amber);background:rgba(11,14,26,.85);border:1px solid var(--amber);padding:2px 9px;border-radius:2px;z-index:8;letter-spacing:1px}
/* 工坊家具（装饰，沿房间散布，不可交互但点一下小人走过去） */
.rs-furn{position:absolute;z-index:2;background:#151b33;border:2px solid #0a0d18;box-shadow:3px 3px 0 rgba(0,0,0,.35);cursor:pointer}
.rs-furn:hover{border-color:var(--amber);transform:translateY(-1px)}
.rs-furn:hover::after{filter:brightness(1.2)}
.rs-furnace{left:22px;bottom:52px;width:64px;height:56px;border-radius:2px;background:linear-gradient(180deg,#2a1a14,#1a100c);box-shadow:3px 3px 0 rgba(0,0,0,.4),0 0 18px rgba(255,110,30,.35)}
.rs-furnace::before{content:"🔥";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:20px;animation:furnFire 1.4s ease-in-out infinite}
.rs-furnace::after{content:"熔炉";position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;color:#e8b88a;letter-spacing:2px}
.rs-bench{left:160px;bottom:52px;width:150px;height:44px;border-radius:2px;background:
  repeating-linear-gradient(90deg,#3a2f1e 0 10px,#33291a 10px 20px);box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.rs-bench::before{content:"🛠️🔧";position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:15px;letter-spacing:6px}
.rs-bench::after{content:"工作台";position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9px;color:#cbb98a;letter-spacing:3px}
.rs-shelf{left:330px;bottom:52px;width:54px;height:62px;border-radius:2px;background:linear-gradient(180deg,#241c14,#1a140e)}
.rs-shelf::before{content:"📦";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:16px}
.rs-shelf::after{content:"货架";position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;color:#cbb98a;letter-spacing:2px}
.rs-crate{width:26px;height:24px;border-radius:2px;background:#3a2f1e}
.rs-crate.c1{left:110px;bottom:52px}
.rs-crate.c2{left:280px;bottom:52px}
.rs-crate::after{content:"🪵";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.9}
@keyframes furnFire{0%,100%{filter:drop-shadow(0 0 3px rgba(255,150,60,.8));transform:translateX(-50%) scale(1)}50%{filter:drop-shadow(0 0 10px rgba(255,180,80,1));transform:translateX(-50%) scale(1.15)}}
/* 任务设备：去外框，图标悬浮（与横版 sx-task 一致）——无方框/边框/阴影，用光晕区分状态 */
.rs-task,.rs-exit{position:absolute;width:46px;height:40px;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;
  filter:drop-shadow(0 0 6px rgba(0,188,212,.45));transition:transform .15s}
.rs-task::before,.rs-exit::before{content:none}
.rs-task:hover,.rs-exit:hover{transform:translateY(-2px);filter:drop-shadow(0 0 10px rgba(255,179,64,.9))}
.rs-task .rt-icon,.rs-exit .rt-icon{font-size:20px;line-height:1;filter:drop-shadow(0 0 3px rgba(0,0,0,.7))}
/* 任务名：默认隐藏，小人走近才浮现（与横版一致） */
.rs-task .rt-name,.rs-exit .rt-name{position:absolute;top:-22px;left:50%;transform:translateX(-50%);z-index:10;
  font-size:11px;color:var(--amber);background:rgba(13,16,34,.96);border:1px solid var(--amber);padding:2px 9px;border-radius:8px;
  white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;text-shadow:none;letter-spacing:.5px;
  opacity:0;pointer-events:none;transition:opacity .15s}
.rs-task.near .rt-name{opacity:1}
.rs-task.done .rt-name{color:var(--green);border-color:var(--green);opacity:1}
.rs-task.done{filter:drop-shadow(0 0 8px rgba(0,230,118,.7))}
.rs-task.done::after{content:"✓";position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#04140b;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(0,230,118,.5)}
.rs-task.next{animation:stNext 1.6s ease-in-out infinite}
.rs-task.next::before{content:none}
.rs-task.next .rt-icon{animation:stPulse 1.6s ease-in-out infinite}
.rs-task.next .rt-name{color:var(--amber);font-weight:bold}
/* 锁定：前置任务未完成 → 灰色 + 点击无效 */
.rs-task.locked,.sx-task.locked{opacity:.35;filter:grayscale(1);cursor:not-allowed;pointer-events:none}
.rs-task.locked:hover,.sx-task.locked:hover{transform:none}
/* 出口楼梯（房间末端） */
.rs-stairs{position:absolute;width:44px;height:44px;z-index:5;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:2px;cursor:pointer;background:#1a2140;border:2px solid #5a6a9a;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.rs-stairs.locked{opacity:.4;cursor:not-allowed}
.rs-stairs.open{border-color:var(--amber);box-shadow:0 0 12px rgba(255,179,64,.6),4px 4px 0 rgba(0,0,0,.45);animation:stNext 1.6s ease-in-out infinite}
.rs-stairs.open::after{content:"上楼";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--amber);white-space:nowrap}
/* 厂长 NPC（站在门口） */
/* 出厂区出口（俯视左下角，样式同任务设备 rs-task，点击返回厂区） */
.rs-exit{left:40px;bottom:26px;z-index:8}
.rs-exit:hover{transform:translateY(-2px);filter:drop-shadow(0 0 12px rgba(255,179,64,.9))}
/* 当前任务：名称常显 + 浮动箭头引导（指向该点任务的设备） */
.rs-task.next .rt-name, .sx-task.next .rt-name{opacity:1}
.rs-task.next .rt-arrow, .sx-task.next .rt-arrow{
  position:absolute;top:-36px;left:50%;transform:translateX(-50%);
  color:var(--amber);font-size:18px;line-height:1;font-weight:bold;z-index:12;pointer-events:none;
  animation:rtArrowBob .9s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,179,64,.85));
}
@keyframes rtArrowBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
/* 出厂区门：EXIT 绿标 + 呼吸光，更醒目 */
.sx-door-exit .exit-badge, .rs-exit .exit-badge{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:#19c37d;color:#04140b;font-size:9px;font-weight:bold;letter-spacing:1px;
  padding:2px 7px;border-radius:3px;white-space:nowrap;z-index:14;pointer-events:none;
  animation:exitSign 1.5s ease-in-out infinite;box-shadow:0 0 10px rgba(25,195,125,.75);
}
@keyframes exitSign{0%,100%{opacity:1}50%{opacity:.45}}
.sx-door-exit .rt-icon, .rs-exit .rt-icon{animation:exitSign 1.8s ease-in-out infinite}
.rs-npc{position:absolute;left:120px;top:34px;font-size:24px;z-index:6;filter:drop-shadow(0 0 6px rgba(255,179,64,.4));animation:npcBob 2.2s ease-in-out infinite}
/* 俯视玩家小人：从头顶往下看——只看到 头顶头发/肩部/两侧手臂/脚，没有脸和眼睛 */
/* 4 方向：dir-down(朝下·默认露双手) / dir-up(朝上·手藏身后) / dir-side(朝侧·露一侧手,左右用flip镜像) */
.rs-player{position:absolute;z-index:9;width:34px;height:34px;pointer-events:none;margin-left:-7px;margin-top:-7px}
.rs-player canvas{display:block;width:34px;height:34px;image-rendering:pixelated}
/* 任务/小游戏区（场景下方） */
.rs-foot{margin:0 18px 12px}
@keyframes stNext{0%,100%{box-shadow:0 0 8px rgba(255,179,64,.35)}50%{box-shadow:0 0 20px rgba(255,179,64,.75)}}
@keyframes stArrow{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
@keyframes stPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
/* ===== 横版过关场景（side-scroll · 室内房间剖面 · 8bit） ===== */
/* 三层结构：天花板 / 跑动区 / 地面 / 底部操作区(HUD) —— 跑动区始终在画面中间 */
.sx-scene{position:relative;height:520px;margin:0 18px 12px;border-radius:2px;overflow:hidden;
  border:10px solid #2c2a48;box-shadow:inset 0 0 0 2px #141222,0 4px 0 rgba(0,0,0,.4);background:#0a0e22;touch-action:none}
.sx-stage{position:absolute;top:0;left:0;height:100%;will-change:transform}
/* 室内墙背景：亮暖灰 + 砖纹 + 墙裙 */
.sx-bg{position:absolute;inset:0;background:
  linear-gradient(180deg,#3d4a72 0%,#38446a 55%,#333f63 100%)}
.sx-bg::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 22px,transparent 22px 44px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 22px,transparent 22px 44px)}
.sx-bg::after{content:"";position:absolute;left:0;right:0;height:96px;bottom:112px;
  background:linear-gradient(180deg,#2c3558 0%,#262e4e 100%);
  border-top:3px solid #4a5a86;border-bottom:3px solid #1d2440}
/* 顶部留白/天空带：让房间墙不再顶到画面上沿（压缩房间比例） */
.sx-sky{position:absolute;left:0;right:0;top:0;height:40px;z-index:2;
  background:linear-gradient(180deg,#0a0e22 0%,#0d132c 55%,#121830 100%);
  border-bottom:3px solid #1d2440}
.sx-sky::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 22px,transparent 22px 44px)}
/* 天花板：横梁 + 灯带（置于天空带下方） */
.sx-ceil{position:absolute;left:0;right:0;top:40px;height:26px;z-index:3;
  background:linear-gradient(180deg,#2c2a48,#211f3a);border-bottom:3px solid #141222;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.06)}
.sx-ceil::after{content:"";position:absolute;left:0;right:0;top:12px;height:4px;
  background:repeating-linear-gradient(90deg,#ffd9a0 0 26px,#ffb340 26px 28px,#ffd9a0 28px 54px);
  opacity:.9;filter:drop-shadow(0 0 4px rgba(255,179,64,.6))}
/* 墙上装饰：挂画/仪表盘/窗户/时钟/横管 */
.sx-deco{position:absolute;border:3px solid #141222;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.sx-deco.pic{width:34px;height:26px;background:repeating-linear-gradient(135deg,#4a7fb0 0 8px,#3a6a9a 8px 16px)}
.sx-deco.gauge{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#7fd0ff 0 26%,#2a3a60 30% 60%,#1a2440 62%);box-shadow:0 0 8px rgba(127,208,255,.4)}
.sx-deco.win{width:36px;height:32px;background:linear-gradient(180deg,#7fd0ff,#4a9ad0);border-width:4px;border-color:#4a5a86;box-shadow:inset 0 0 0 2px #141222,0 0 10px rgba(127,208,255,.35)}
.sx-deco.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#2c3558}
.sx-deco.win::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#2c3558}
.sx-deco.clock{width:24px;height:24px;border-radius:50%;background:#e8e2d0;border:3px solid #141222}
.sx-deco.clock::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:7px;background:#333;transform-origin:bottom;transform:rotate(-35deg)}
.sx-deco.pipe{height:8px;background:linear-gradient(180deg,#5a6a9a,#3a4a78);border-left:none;border-right:none}
/* 地面下方：底部操作区（HUD 条），深色不透明，不挡跑动区 */
.sx-hud{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:11;
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(180deg,#1a2140,#10162a);border-top:3px solid #4a5a86;box-shadow:0 -3px 0 rgba(0,0,0,.35)}
.sx-hint{font-size:11px;color:#e2e9fb;line-height:1.4;text-shadow:0 1px 0 #000;max-width:56%}
.sx-hint b{color:var(--amber)}
.sx-btns{display:none;gap:8px;flex:none}
.sx-btn{width:50px;height:46px;font-size:20px;border-radius:3px;background:rgba(13,16,34,.95);border:2px solid #5a6a9a;color:var(--amber);cursor:pointer;user-select:none;touch-action:none;font-family:inherit;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.sx-btn:active{background:#2a3852;transform:translateY(2px);box-shadow:none}
@media (hover:none),(pointer:coarse){
  .sx-btns{display:flex}
}
/* 地板：厚实木地板（在 HUD 条上方） */
.sx-ground{position:absolute;left:0;right:0;bottom:52px;height:58px;background:
  repeating-linear-gradient(90deg,#6a5a3a 0 26px,#5a4c30 26px 52px);
  border-top:4px solid #8a7a52;box-shadow:0 -2px 0 rgba(255,255,255,.12),inset 0 6px 0 rgba(255,255,255,.07)}
.sx-ground::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 13px,transparent 13px 26px)}
/* 地面静态装饰：木箱/木桶（放在设备间隙，不与设备重叠） */
.sx-prop{position:absolute;z-index:4}
.sx-prop.crate{width:34px;height:30px;background:#6a5a3a;border:2px solid #141222;box-shadow:2px 2px 0 rgba(0,0,0,.4);z-index:6}
.sx-prop.crate::after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.4);border-top:none;border-left:none}
.sx-prop.barrel{width:26px;height:40px;border-radius:3px;background:linear-gradient(180deg,#5a4c30,#4a3e28);border:2px solid #141222;box-shadow:2px 2px 0 rgba(0,0,0,.4);z-index:6}
.sx-prop.barrel::before{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:rgba(0,0,0,.4)}
/* 平台：像素金属平台（带支撑腿） */
.sx-platform{position:absolute;height:14px;background:
  repeating-linear-gradient(90deg,#6a7aae 0 10px,#5a6a9a 10px 20px);border:2px solid #141222;border-radius:1px;box-shadow:3px 3px 0 rgba(0,0,0,.4);z-index:5}
.sx-platform::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.22)}
.sx-platform::after{content:"";position:absolute;left:12px;top:14px;width:4px;height:50px;background:#2a2f4e;box-shadow:40px 0 0 #2a2f4e,80px 0 0 #2a2f4e}
/* 任务设备：像素机柜/终端（放大） */
/* 任务设备：去外框，图标悬浮（无方框/边框/阴影），用光晕区分状态 */
.sx-task,.sx-door-exit{position:absolute;width:46px;height:40px;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  filter:drop-shadow(0 0 6px rgba(0,188,212,.45));transition:transform .15s;background:none;border:none}
.sx-task::before,.sx-door-exit::before{content:none}
.sx-task .rt-icon,.sx-door-exit .rt-icon{font-size:19px;line-height:1;filter:drop-shadow(0 0 3px rgba(0,0,0,.7))}
/* 任务名：藏在设备上方，小人走近才浮现（不占设备内部空间） */
.sx-task .rt-name,.sx-door-exit .rt-name{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--amber);background:rgba(13,16,34,.96);border:1px solid var(--amber);padding:2px 9px;border-radius:8px;
  white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:12;text-shadow:none}
.sx-task.near .rt-name{opacity:1}
.sx-door-exit .rt-name{opacity:1}

.sx-task.done{filter:drop-shadow(0 0 8px rgba(0,230,118,.7))}
.sx-task.done::before{content:none}
.sx-task.done .rt-name{color:var(--green);border-color:var(--green);opacity:1}
.sx-task.done::after{content:"✓";position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#04140b;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(0,230,118,.5)}
.sx-task.next{animation:stNext 1.6s ease-in-out infinite}
.sx-task.next::before{content:none}
.sx-task.next .rt-name{color:var(--amber);font-weight:bold}

.sx-task.near{transform:scale(1.12);z-index:8;filter:drop-shadow(0 0 12px rgba(255,179,64,.9))}
/* 走近提示已由 rt-name tooltip 承担 */
/* 玩家：精细 8bit 像素小人（安全帽+工装+手臂，会走路） */
.sx-player{position:absolute;z-index:9;width:26px;height:40px}
.sx-player .pl{position:absolute;image-rendering:pixelated}
.sx-player .hair{left:4px;top:0;width:18px;height:8px;background:#3a2a20;box-shadow:inset 0 -2px 0 #241a12}
.sx-player .hair::after{content:"";position:absolute;left:4px;top:6px;width:10px;height:4px;background:#3a2a20;border-radius:50% 50% 0 0}
.sx-player .face{left:6px;top:7px;width:14px;height:12px;background:#f0c89a}
.sx-player .eye{left:9px;top:11px;width:3px;height:3px;background:#2a2130;box-shadow:5px 0 0 #2a2130}

.sx-player .belt{left:3px;top:24px;width:20px;height:3px;background:#1d2f6e}
.sx-player .arm.l{left:-2px;top:20px;width:6px;height:10px;background:#3d6df2;box-shadow:inset -2px 0 0 #2748b0}
.sx-player .arm.r{right:-2px;top:20px;width:6px;height:10px;background:#2f57cf;box-shadow:inset 2px 0 0 #1d3a9a}
.sx-player .hand.l{left:0;top:28px;width:3px;height:4px;background:#f0c89a}
.sx-player .hand.r{right:0;top:28px;width:3px;height:4px;background:#f0c89a}
.sx-player .leg.l{left:4px;top:32px;width:8px;height:7px;background:#2a3852}
.sx-player .leg.r{left:14px;top:32px;width:8px;height:7px;background:#22304a}
.sx-player .boot.l{left:3px;top:37px;width:9px;height:3px;background:#1d2440}
.sx-player .boot.r{left:14px;top:37px;width:9px;height:3px;background:#1d2440}
.sx-player.flip{transform:scaleX(-1)}
.sx-player::after{content:"";position:absolute;left:2px;right:2px;top:38px;height:3px;background:rgba(0,0,0,.45);filter:blur(1px)}
/* 走路动画 */
.sx-player.walk .leg.l{animation:wl .32s steps(2,end) infinite}
.sx-player.walk .leg.r{animation:wr .32s steps(2,end) infinite}
.sx-player.walk .arm.l{animation:al .32s steps(2,end) infinite}
.sx-player.walk .arm.r{animation:ar .32s steps(2,end) infinite}
@keyframes wl{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes wr{0%,100%{transform:translateY(2px)}50%{transform:translateY(0)}}
@keyframes al{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes ar{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
/* 楼梯 */
.sx-stairs{position:absolute;z-index:7;width:44px;height:64px;cursor:pointer;background:#5a3a2a;border:4px solid #3a2418;border-radius:2px;box-shadow:4px 4px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.sx-stairs::before{content:"";position:absolute;left:4px;right:4px;top:4px;bottom:4px;border:2px solid #8a6a4a;border-radius:1px;background:repeating-linear-gradient(0deg,#7a5a3a 0 6px,#6a4a30 6px 12px)}
.sx-stairs::after{content:"🚪";position:absolute;font-size:20px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.sx-stairs.locked{opacity:.4;cursor:not-allowed}
.sx-stairs.locked::after{content:"🔒"}
.sx-stairs.open{border-color:var(--amber);box-shadow:0 0 14px rgba(255,179,64,.65),4px 4px 0 rgba(0,0,0,.45);animation:stNext 1.6s ease-in-out infinite}
.sx-stairs.open::before{box-shadow:0 0 10px rgba(255,179,64,.5)}
.sx-stairs.open::after{content:"🚪"}

.sx-door-tip{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--amber);white-space:nowrap;text-shadow:0 1px 0 #000}

.sx-door-exit{z-index:20}

.sx-rotate{position:absolute;top:36px;left:50%;transform:translateX(-50%);z-index:13;font-size:11px;color:var(--amber);background:rgba(13,16,34,.94);border:1px solid var(--amber);padding:4px 12px;border-radius:3px;display:none;white-space:nowrap;pointer-events:none}

.room-panel{width:min(600px,96vw);max-height:92dvh;max-height:92vh;overflow:auto;background:#10162a;border:2px solid var(--border);border-radius:10px;box-shadow:0 0 40px rgba(0,0,0,.6)}

function taskIconOf(t){
  const title=String(t.title||t.name||t.label||'');
  const lower=title.toLowerCase();
  const emojiInTitle=title.match(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u);
  if(emojiInTitle) return emojiInTitle[0];
  for(const k in TASK_ICON_KEY){
    if(lower.indexOf(k.toLowerCase())>=0) return TASK_ICON_KEY[k];
  }
  return TASK_ICON[t.type]||'📌';

function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

function isTaskDone(tid){ return !!(me.check && me.check[''+tid]); }

function levelProgress(lv){
  let done=0,total=0;
  (lv.tasks||[]).forEach(t=>{ if(t.auto)return; total++; if(isTaskDone(t.id))done++; });
  return {done,total,pct:total?Math.round(done/total*100):0,completed:total>0&&done>=total};
}

function accessOf(lv,idx){
  if(idx===0) return 'open';
  const prev=content.levels[idx-1];
  return levelProgress(prev).completed ? 'open' : 'locked';
}

function rsDraw(dir, frame){
  const p=document.getElementById('rsPlayer');
  if(!p) return;
  let cv=p.querySelector('canvas');
  if(!cv){ cv=document.createElement('canvas'); cv.width=20; cv.height=20; p.appendChild(cv); }
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,20,20);
  let rows;
  if(dir==='E'||dir==='W'){
    // 左右朝向：以 S(朝下) 精灵为底，画布旋转 90°（面朝左/右）
    rows = RS_SPRITES['S_'+(frame||0)] || RS_SPRITES.S_0;
    ctx.save();
    ctx.translate(10,10);
    ctx.rotate(dir==='E' ? Math.PI/2 : -Math.PI/2);
    ctx.translate(-10,-10);
  } else {
    const key=dir+'_'+(frame||0);
    rows = RS_SPRITES[key]||RS_SPRITES[dir+'_0']||RS_SPRITES.S_0;
  }
  for(let y=0;y<20;y++){
    const row=rows[y];
    for(let x=0;x<20;x++){
      const ch=row[x];
      if(ch!=='.'){ ctx.fillStyle=RS_COLORS[ch]||'#fff'; ctx.fillRect(x,y,1,1); }
    }
  }
  if(dir==='E'||dir==='W') ctx.restore();
}

function rsSetDir(dx,dy){
  // 四方向：上下由 dy 决定，左右由 dx 决定（人物面朝移动方向）
  if(dx===0&&dy===0) return;
  if(Math.abs(dy)>=Math.abs(dx)){
    rsDir = dy<0 ? 'N' : 'S';
  } else {
    rsDir = dx>0 ? 'E' : 'W';
  }
  rsDraw(rsDir, rsFrame);
}

function rsStart(){
  const scene=document.getElementById('rsScene'); if(!scene) return;
  const stage=document.getElementById('rsStage'); if(!stage) return;
  const player=document.getElementById('rsPlayer'); if(!player) return;
  rsSceneEl=scene; rsStageEl=stage;
  const rw=scene.clientWidth, rh=scene.clientHeight;
  const stageW=stage.clientWidth, stageH=stage.clientHeight;
  const rt=window._rtRoom||{};
  // 俯视障碍物：家具 + 内墙段（门洞不阻挡），人物需绕过
  const rsObs=[];
  scene.querySelectorAll('.rs-furn').forEach(el=>{
    const r=el.getBoundingClientRect(), sr=scene.getBoundingClientRect();
    rsObs.push({x:(r.left-sr.left)+rsCamX, y:(r.top-sr.top)+rsCamY, w:r.width, h:r.height});
  });
  scene.querySelectorAll('.rs-part').forEach(part=>{
    const pr=part.getBoundingClientRect(), sr=scene.getBoundingClientRect();
    const px0=(pr.left-sr.left)+rsCamX, py0=(pr.top-sr.top)+rsCamY;
    part.querySelectorAll('.rs-inwall').forEach(w=>{
      const wr=w.getBoundingClientRect();
      rsObs.push({x:px0, y:(wr.top-sr.top)+rsCamY, w:pr.width, h:wr.height});
    });
  });
  // ===== 障碍网格（A* 寻路用）：家具+内墙覆盖格标记不可通行，门洞区自然可通行 =====
  const CELL=16;
  const gCols=Math.max(1,Math.ceil(stageW/CELL)), gRows=Math.max(1,Math.ceil(stageH/CELL));
  const blocked=[]; for(let r=0;r<gRows;r++){ blocked.push(new Array(gCols).fill(false)); }
  rsObs.forEach(o=>{
    for(let yy=o.y; yy<o.y+o.h; yy+=CELL) for(let xx=o.x; xx<o.x+o.w; xx+=CELL){
      const gc=Math.floor(xx/CELL), gr=Math.floor(yy/CELL);
      if(gc>=0&&gc<gCols&&gr>=0&&gr<gRows) blocked[gr][gc]=true;
    }
  });
  // 外墙阻挡：四面外墙（最外一圈网格）不可通行，小人走不出房间
  for(let _c=0;_c<gCols;_c++){ blocked[0][_c]=true; blocked[gRows-1][_c]=true; }
  for(let _r=0;_r<gRows;_r++){ blocked[_r][0]=true; blocked[_r][gCols-1]=true; }
  // A* 寻路（4 方向）：返回像素路径点列表；不可达返回 null
  function findPath(sx,sy,ex,ey){
    let sc=Math.max(0,Math.min(gCols-1,Math.floor(sx/CELL)));
    let sr=Math.max(0,Math.min(gRows-1,Math.floor(sy/CELL)));
    let ec=Math.max(0,Math.min(gCols-1,Math.floor(ex/CELL)));
    let er=Math.max(0,Math.min(gRows-1,Math.floor(ey/CELL)));
    if(blocked[sr][sc]||blocked[er][ec]) return null;
    if(sc===ec&&sr===er) return [{x:sc*CELL+CELL/2, y:sr*CELL+CELL/2}];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const open=[{c:sc,r:sr,g:0,h:Math.abs(ec-sc)+Math.abs(er-sr),f:0,p:null}];
    const gs={}; gs[sc+','+sr]=0;
    while(open.length){
      open.sort((a,b)=>a.f-b.f);
      const cur=open.shift();
      if(cur.c===ec&&cur.r===er){
        const path=[]; let n=cur;
        while(n){ path.unshift({x:n.c*CELL+CELL/2, y:n.r*CELL+CELL/2}); n=n.p; }
        return path;
      }
      for(const [dc,dr] of dirs){
        const nc=cur.c+dc, nr=cur.r+dr;
        if(nc<0||nc>=gCols||nr<0||nr>=gRows) continue;
        if(blocked[nr][nc]) continue;
        const nk=nc+','+nr, ng=cur.g+1;
        if(gs[nk]===undefined||ng<gs[nk]){
          gs[nk]=ng;
          const h=Math.abs(ec-nc)+Math.abs(er-nr);
          open.push({c:nc,r:nr,g:ng,h:h,f:ng+h,p:cur});
        }
      }
    }
    return null;
  }
  // 小人初始位置：门口（房间左下角）
  let px=60, py=stageH-120, tx=null, ty=null, speed=2.6;
  try{ const _pp=JSON.parse(sessionStorage.getItem('roomPlayerPos')||'null');
    if(_pp&&_pp.view==='rs'&&String(_pp.roomId)===String(currentRoomId)&&(_pp.floor||0)===(window._roomFlr||0)&&_pp.x>0&&_pp.y>0){ px=_pp.x; py=_pp.y; } }catch(e){}
  let navPath=null;   // 寻路路径点（像素）
  rsCamX=0; rsCamY=0;
  rsDraw('S',0);
  player.style.left=px+'px'; player.style.top=py+'px';
  // 点哪走哪：点击场景（非设备/楼梯/家具）→ A* 寻路走过去（有墙自动绕）
  scene.addEventListener('pointerdown', function(e){
    const t=e.target;
    if(t.closest&&(t.closest('.rs-task')||t.closest('.rs-stairs')||t.closest('.rs-furn')||t.closest('.rs-door')||t.closest('.rs-exit')||t.closest('.rs-npc')||t.closest('.rs-label'))) return;
    const rect=scene.getBoundingClientRect();
    tx=Math.max(6, Math.min((e.clientX-rect.left)+rsCamX, stageW-40));
    ty=Math.max(6, Math.min((e.clientY-rect.top)+rsCamY, stageH-30));
    rsGo=null;
    navPath=findPath(px,py, tx,ty) || [{x:px,y:py}];   // 可达则寻路，不可达原地不动
  }, true);
  // —— 俯视图键盘移动 + 空格进入任务/门/梯子 ——
  const rsKeys={up:false,down:false,left:false,right:false};
  function rsTryEnter(){
    const near=function(el){
      if(!el) return false;
      const r=el.getBoundingClientRect(), sr=scene.getBoundingClientRect();
      const cx=(r.left-sr.left)+rsCamX, cy=(r.top-sr.top)+rsCamY;
      return Math.abs(cx-(px+6))<64 && Math.abs(cy-(py+6))<64;
    };
    for(const el of scene.querySelectorAll('.rs-task')){
      if(near(el)){
        const lvId=el.getAttribute('data-lv'), taskId=el.getAttribute('data-task');
        if(lvId&&taskId){ enterLevel(lvId, taskId); return; }
      }
    }
    const door=scene.querySelector('.rs-exit');
    if(near(door)){ goBack(); return; }
    const st=scene.querySelector('.rs-stairs.open');
    if(near(st)){ nextRoomFloor(); return; }
  }
  // 任务模态打开时暂停房间键盘（避免吞掉任务输入框里的空格/方向键）
  function _roomKbdOn(){
    const _m=document.getElementById('modalOverlay');
    return !(_m && _m.classList.contains('show'));
  }
  function rsKd(e){
    if(!_roomKbdOn()) return;   // 任务模态打开时不响应
    if(e.key==='ArrowUp'||e.key==='w'){ rsKeys.up=true; e.preventDefault(); }
    else if(e.key==='ArrowDown'||e.key==='s'){ rsKeys.down=true; e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='a'){ rsKeys.left=true; e.preventDefault(); }
    else if(e.key==='ArrowRight'||e.key==='d'){ rsKeys.right=true; e.preventDefault(); }
    else if(e.key===' '){ e.preventDefault(); rsTryEnter(); }
  }
  function rsKu(e){
    if(e.key==='ArrowUp'||e.key==='w') rsKeys.up=false;
    else if(e.key==='ArrowDown'||e.key==='s') rsKeys.down=false;
    else if(e.key==='ArrowLeft'||e.key==='a') rsKeys.left=false;
    else if(e.key==='ArrowRight'||e.key==='d') rsKeys.right=false;
  }
  window.addEventListener('keydown', rsKd);
  window.addEventListener('keyup', rsKu);
  window.__rsKeys={rsKd:rsKd, rsKu:rsKu};
  function setDir(dx, dy){
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return;
    rsSetDir(dx, dy);
  }
  function rsCollide(x,y){
    // 外墙阻挡：四面外墙不可穿越（左/右墙宽16，上/下墙高12）——键盘移动同样生效
    if(x < 16 || x > stageW - 16 || y < 12 || y > stageH - 12) return true;
    for(const o of rsObs){
      const cx=Math.max(o.x, Math.min(x, o.x+o.w));
      const cy=Math.max(o.y, Math.min(y, o.y+o.h));
      const d=Math.hypot(x-cx, y-cy);
      if(d<12) return true;
    }
    return false;
  }
  // 沿路径走一步；返回是否到达终点
  function stepAlong(){
    if(!navPath||!navPath.length) return true;
    const pt=navPath[0];
    const dx=pt.x-px, dy=pt.y-py, dist=Math.hypot(dx,dy);
    if(dist<=speed){
      px=pt.x; py=pt.y; navPath.shift();
      return navPath.length===0;
    }
    px+=dx/dist*speed; py+=dy/dist*speed;
    return false;
  }
  function frame(){
    let moving=false, ldx=0, ldy=0;
    // 键盘移动优先（四方向 + 碰撞）
    let kdx=0, kdy=0;
    if(rsKeys.left) kdx-=1; if(rsKeys.right) kdx+=1;
    if(rsKeys.up) kdy-=1; if(rsKeys.down) kdy+=1;
    const keyboard = !!(kdx||kdy);
    if(keyboard){
      navPath=null; tx=null; ty=null; rsGo=null;
      const len=Math.hypot(kdx,kdy)||1;
      const nx=px+kdx/len*speed, ny=py+kdy/len*speed;
      if(!rsCollide(nx,py)) px=nx;
      if(!rsCollide(px,ny)) py=ny;
      moving=true;
      setDir(kdx,kdy);
    } else {
      // 点设备/门/楼梯：先寻路走过去，到跟前自动触发；门/楼梯不可达则取消不原地跳转
      if(rsGo && !navPath){
        navPath=findPath(px,py, rsGo.x, rsGo.y);
        if(!navPath && rsGo.kind){ rsGo=null; try{ showToast('门口被挡，过不去'); }catch(e){} }
      }
      const arrived=stepAlong();
      if(arrived && rsGo){
        const _g=rsGo; rsGo=null; navPath=null; tx=null; ty=null;
        if(_g.kind==='exit'){ goBack(); }
        else if(_g.kind==='stairs'){ nextRoomFloor(); }
        else { enterLevel(_g.lvId, _g.taskId); }
      }
      if(arrived){ tx=null; ty=null; navPath=null; }
      moving = !!(navPath && navPath.length);
      if(moving){ ldx=navPath[0].x-px; ldy=navPath[0].y-py; setDir(ldx, ldy); }
    }
    player.classList.toggle('walk', moving);
    if(moving){ rsFrame=(rsFrame+1)%2; rsDraw(rsDir, rsFrame); }
    player.style.left=px+'px'; player.style.top=py+'px';
    // 走近任务设备 → 显示任务名
    scene.querySelectorAll('.rs-task').forEach(el=>{
      const r=el.getBoundingClientRect(), sr=scene.getBoundingClientRect();
      const cx=(r.left-sr.left)+rsCamX, cy=(r.top-sr.top)+rsCamY;
      const near=Math.abs(cx-(px+6))<64 && Math.abs(cy-(py+6))<64;
      el.classList.toggle('near',near);
    });
    // 摄像机跟随：stage 平移使小人居中（x/y 双向）
    rsCamX=px-rw/2+12; rsCamX=Math.max(0, Math.min(rsCamX, stageW-rw));
    rsCamY=py-rh/2+12; rsCamY=Math.max(0, Math.min(rsCamY, stageH-rh));
    stage.style.transform='translate('+(-rsCamX)+'px,'+(-rsCamY)+'px)';
    rsLoop=requestAnimationFrame(frame);
  }
  rsLoop=requestAnimationFrame(frame);
}

function rsStop(){
  if(rsLoop){ cancelAnimationFrame(rsLoop); rsLoop=null; }
  rsGo=null; tx=null; ty=null;
  try{ if(window.__rsKeys){ window.removeEventListener('keydown', window.__rsKeys.rsKd); window.removeEventListener('keyup', window.__rsKeys.rsKu); window.__rsKeys=null; } }catch(e){}
}

  const scene=document.getElementById('sxScene'); if(!scene) return;
  const stage=document.getElementById('sxStage'); if(!stage) return;
  const player=document.getElementById('sxPlayer'); if(!player) return;
  // 动态坐标：HUD 52px + 地面 58px，跑动区居中
  // 地址栏占位/未布局完成时 clientHeight 可能为 0 → 延迟到有真实高度再定位
  let H=scene.clientHeight;
  if(!H || H<180){ setTimeout(()=>{ try{ sxStop(); sxStart(); }catch(e){} }, 120); return; }
  const groundH=58, groundTop=H-52-groundH;
  const platTop=Math.max(112, groundTop-100);
  const g=0.46, speed=4.6, ph=38;
  const gap=250, baseX=220;
  // 动态跳跃：最大跳跃高度 = min(上平台所需高度的2.2倍, 地面到场景顶可用高度的78%)
  // 保证跳最高时人物不超出场景顶部被裁切，同时足够跳上高处横杠
  const needJump = Math.max(30, groundTop - platTop);
  const maxJump = Math.min(needJump * 2.0, Math.max(50, (groundTop - ph) * 0.60));
  const jumpV = -Math.sqrt(2 * g * maxJump);
  let x=150, y=groundTop-ph, vy=0, onGround=true, moveTarget=null;
  try{ const _pp=JSON.parse(sessionStorage.getItem('roomPlayerPos')||'null');
    if(_pp&&_pp.view==='sx'&&String(_pp.roomId)===String(currentRoomId)&&(_pp.floor||0)===(window._roomFlr||0)&&_pp.x>0){ x=_pp.x; } }catch(e){}
  const keys={left:false,right:false,jump:false};
  // 摆放任务设备 + 平台 + 楼梯
  const plats=[];
  const obstacles=[];   // 地面障碍物：{x,y,w,h}，人物需跳跃越过
  const taskEls=[].slice.call(scene.querySelectorAll('.sx-task'));
  taskEls.forEach((el,i)=>{
    const onPlat=el.getAttribute('data-plat')==='1';
    const tx=baseX+i*gap;
    const tTop=onPlat?(platTop-42):(groundTop-42);
    el.style.left=tx+'px'; el.style.top=tTop+'px';
    el.dataset.platY=onPlat?platTop:0;
    if(onPlat){
      const pe=scene.querySelector('.sx-platform[data-idx="'+i+'"]');
      if(pe){ pe.style.left=(tx-16)+'px'; pe.style.top=platTop+'px'; pe.style.width='100px';
        plats.push({x:tx-16, y:platTop, w:100}); }
    }
  });
  // 地面障碍物：放到地面上，人物需跳跃越过（水平碰撞 + 高于箱子才可通过）
  const props=scene.querySelectorAll('.sx-prop');
  for(let pi=0;pi<props.length;pi++){
    const px=Math.round(90+pi*210);
    const isBarrel=props[pi].classList.contains('barrel');
    const w=isBarrel?26:34, h=isBarrel?40:30;
    props[pi].style.left=px+'px';
    props[pi].style.top=(groundTop-h)+'px';
    obstacles.push({x:px, y:groundTop-h, w:w, h:h});
  }
  // 楼梯：放长廊末端；顶层（hasNext=false）不设计楼梯
  const stairsEl=document.getElementById('sxStairs');
  if(stairsEl){
    const sx=window._sxRoom||{};
    const sxPos=(baseX+taskEls.length*gap+70);
    if(!sx.hasNext){
      // 顶层：放一架「出厂梯子」，离开房间返回厂区（替换隐藏逻辑）
      stairsEl.className='sx-stairs open exit';
      stairsEl.style.left=sxPos+'px';
      stairsEl.style.top=(groundTop-48)+'px';
      stairsEl.onclick=function(){ goBack(); };
      const tip=document.createElement('div'); tip.className='sx-door-tip'; tip.textContent='🪜 出厂 · 返回厂区';
      stairsEl.appendChild(tip);
    } else {
      const sCls=sx.flrDone?'open':'locked';
      stairsEl.className='sx-stairs '+sCls;
      stairsEl.style.left=sxPos+'px';
      stairsEl.style.top=(groundTop-48)+'px';
      if(sx.flrDone){
        stairsEl.onclick=function(){ nextRoomFloor(); };
        const tip=document.createElement('div'); tip.className='sx-door-tip'; tip.textContent='出门 · 下一层';
        stairsEl.appendChild(tip);
      }
    }
  }
  // 出厂区门：场景左端、距边界留白(文字不截断)、距出生点远(不被小人遮住)
  const doorEl=document.getElementById('sxDoorExit');
  if(doorEl){ doorEl.style.left='60px'; doorEl.style.top=(groundTop-48)+'px'; }
  const rw=scene.clientWidth, stageW=stage.clientWidth;
  // 点哪儿走哪儿：点击场景（非设备/楼梯/按钮）→ 小人走到该水平位置
  scene.addEventListener('pointerdown', function(e){
    const t=e.target;
    if(t.closest&&(t.closest('.sx-task')||t.closest('.sx-stairs')||t.closest('.sx-btn'))) return;
    const rect=stage.getBoundingClientRect();
    moveTarget=Math.max(6, Math.min(e.clientX-rect.left, stageW-30));
    sxGo=null;
  }, true);
  function frame(){
    // 点击任务设备：自动走过去，到跟前进入任务
    if(sxGo){
      moveTarget=sxGo.x;
      const dx=Math.abs((x+12)-sxGo.x);
      if(dx<14){
        // 设备在平台上且玩家还在下面 → 自动跳上去
        if(sxGo.platY && onGround && y > sxGo.platY-46){ vy=jumpV; onGround=false; }
        const dy=Math.abs((y+17)-sxGo.y);
        if(dy<34){ const _g=sxGo; sxGo=null; moveTarget=null;
          if(_g.kind==='exit'){ goBack(); }
          else { enterLevel(_g.lvId, _g.taskId); }
        }
      }
    }
    // 键盘方向优先，按方向键清除点击目标
    const oldX=x;
    if(keys.left){ x-=speed; moveTarget=null; sxGo=null; }
    if(keys.right){ x+=speed; moveTarget=null; sxGo=null; }
    // 点击移动：朝目标走，到达后停
    if(!keys.left&&!keys.right&&moveTarget!==null){
      const d=moveTarget-x;
      if(Math.abs(d)<=speed){ x=moveTarget; moveTarget=null; }
      else { x+=Math.sign(d)*speed; }
    }
    // 障碍物碰撞：脚在地面上且没跳过高 → 阻挡水平移动（跳起越过）
    const feetY=y+ph, feetOnGround=feetY>=groundTop-8;
    for(const ob of obstacles){
      // 水平重叠
      if(x+5<ob.x+ob.w && x+19>ob.x){
        // 人物脚低于障碍物顶（没跳过）→ 挡住
        if(feetY > ob.y+6){
          // 正在走向目标(门/任务设备)：自动跳越地面障碍物
          if(sxGo && onGround){ vy=jumpV; onGround=false; continue; }
          // 回退到障碍物边缘
          if(x+5 < ob.x+ob.w && x+19 > ob.x){
            const fromLeft = oldX <= ob.x;
            x = fromLeft ? (ob.x-19) : (ob.x+ob.w-5);
            if(moveTarget!==null&&Math.abs(moveTarget-x)<6) moveTarget=null;
          }
        }
      }
    }
    // 跳跃：可按住蓄力（在平台上也能再次跳——简化体验）
    if(keys.jump&&onGround){ vy=jumpV; onGround=false; }
    vy+=g; y+=vy;
    // 地面
    if(y+ph>=groundTop){ y=groundTop-ph; vy=0; onGround=true; }
    // 平台：宽松落点（玩家身体中段接触即可站上）
    for(const p of plats){
      if(vy>=0 && x+5<p.x+p.w && x+19>p.x && y+ph>=p.y-8 && y+ph<=p.y+20){ y=p.y-ph; vy=0; onGround=true; }
    }
    if(x<4) x=4; if(x>stageW-30) x=stageW-30;
    player.style.left=x+'px'; player.style.top=y+'px';
    if(keys.left){ player.classList.add('flip'); player.classList.add('walk'); }
    else if(keys.right){ player.classList.remove('flip'); player.classList.add('walk'); }
    else if(moveTarget!==null||sxGo){ player.classList.add('walk'); }
    else { player.classList.remove('walk'); }
    let cam=x-rw/2+13; cam=Math.max(0,Math.min(cam,stageW-rw));
    stage.style.transform='translateX('+(-cam)+'px)';
    taskEls.forEach(el=>{
      const tx=parseFloat(el.style.left)+25, ty=parseFloat(el.style.top)+21;
      const dx=Math.abs(tx-(x+12)), dy=Math.abs(ty-(y+17));
      const near=dx<64&&dy<74;
      el.classList.toggle('near',near);
    });
    sxGame=requestAnimationFrame(frame);
  }
  function tryEnterNearTaskOrExit(){
    for(const el of taskEls){
      const tx=parseFloat(el.style.left)+25, ty=parseFloat(el.style.top)+21;
      const dx=Math.abs(tx-(x+12)), dy=Math.abs(ty-(y+17));
      if(dx<64&&dy<74){
        if(el.classList.contains('locked')){ if(typeof showToast==='function'){ try{ showToast('先完成前置任务再解锁'); }catch(e){} } return; }
        const lvId=el.getAttribute('data-lv'), taskId=el.getAttribute('data-task');
        if(lvId&&taskId) enterLevel(lvId, taskId);
        return;
      }
    }
    const doorEl=document.getElementById('sxDoorExit');
    if(doorEl){
      const ddx=parseFloat(doorEl.style.left)||0;
      if(Math.abs(ddx+23-(x+12))<70){ goBack(); return; }
    }
    const stEl=document.getElementById('sxStairs');
    if(stEl && stEl.style.display!=='none'){
      const sxp=parseFloat(stEl.style.left);
      if(!isNaN(sxp) && Math.abs(sxp+23-(x+12))<70){ if(stEl.onclick) stEl.onclick(); else nextRoomFloor(); return; }
    }
    // 不在可交互物旁：不跳跃（↑/↓ 仅用于进入/出门）
  }
  function kd(e){
    if(!_roomKbdOn()) return;   // 任务模态打开时不响应
    if(e.key==='ArrowLeft'||e.key==='a'){ keys.left=true; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='d'){ keys.right=true; e.preventDefault(); }
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); tryEnterNearTaskOrExit(); return; }
    if(e.key===' '||e.key==='w'){ keys.jump=true; e.preventDefault(); }
  }
  function ku(e){
    if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
    if(e.key==='ArrowUp'||e.key===' '||e.key==='w') keys.jump=false;
  }
  scene.querySelectorAll('.sx-btn').forEach(b=>{
    const k=b.getAttribute('data-k');
    const dn=ev=>{ ev.preventDefault(); keys[k]=true; };
    const up=ev=>{ ev.preventDefault(); keys[k]=false; };
    b.addEventListener('pointerdown',dn);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('pointercancel',up);
  });
  sxKeys={kd,ku};
  window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
  // 手机竖屏提示横屏
  if(window.innerHeight>window.innerWidth && matchMedia('(hover:none),(pointer:coarse)').matches){
    const r=scene.querySelector('.sx-rotate'); if(r){ r.classList.add('show'); setTimeout(()=>r.classList.remove('show'),4500); }
  }
  sxGame=requestAnimationFrame(frame);

  // 地址栏占位变化（横屏旋转/浏览器地址栏出现收起）→ 重排场景坐标，避免人物被挤出可视区
  if(!window.__sxReflowBound){
    window.__sxReflowBound=true;
    let t=null;
    const reflow=()=>{
      if(t) clearTimeout(t);
      t=setTimeout(()=>{
        try{ if(document.getElementById('sxScene')){ renderRoom(currentRoomId); } }catch(e){}
      },160);
    };
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', reflow);
    if(window.visualViewport) window.visualViewport.addEventListener('resize', reflow);
  }
}

let vxGame=null, vxKeys=null, vxGo=null;
function vxStart(){
  const scene=document.getElementById('vxScene');
  const stage=document.getElementById('vxStage');
  const player=document.getElementById('vxPlayer');
  if(!scene||!stage||!player) return;
  let H=scene.clientHeight;
  if(!H||H<180){ setTimeout(()=>{ try{ vxStop(); vxStart(); }catch(e){} }, 120); return; }
  const groundH=58, groundTop=stage.clientHeight-groundH;
  const ph=38, g=0.46, speed=4.6;
  const jumpV=-Math.sqrt(2*g*360);   // 跳高约 360px，能爬上平台
  let x=Math.round(scene.clientWidth/2-16), y=groundTop-ph, vy=0, onGround=true;
  const keys={left:false,right:false,jump:false};
  const taskEls=[].slice.call(scene.querySelectorAll('.vx-stage .sx-task'));
  const plats=[]; scene.querySelectorAll('.vx-plat').forEach(p=>{
    plats.push({x:parseFloat(p.style.left)||0, y:parseFloat(p.style.top)||0, w:parseFloat(p.style.width)||170});
  });
  const doorEl=document.getElementById('vxDoorExit');
  if(doorEl){ doorEl.style.left='40px'; doorEl.style.top=(groundTop-48)+'px'; }   // 门在底部左侧，出生点在中心，互不遮挡
  const stageH=stage.clientHeight, rw=scene.clientWidth;
  let camY=0;
  // 人物位置恢复
  try{ const pp=JSON.parse(sessionStorage.getItem('roomPlayerPos')||'null');
    if(pp&&pp.view==='vx'&&String(pp.roomId)===String(currentRoomId)&&pp.x>0&&pp.y>0){ x=pp.x; y=pp.y; } }catch(e){}
  function frame(){
    if(keys.left) x-=speed;
    if(keys.right) x+=speed;
    if(keys.left||keys.right){ vxGo=null; }   // 手动移动取消门导航
    // 点门：自动走到门口，落地后触发返回
    if(vxGo && !keys.left && !keys.right){
      const vx_dx=vxGo.x-(x+12);
      if(Math.abs(vx_dx)>6){ x+=Math.sign(vx_dx)*speed; }
      const vx_dy=Math.abs((vxGo.y||0)-(y+17));
      if(Math.abs(vx_dx)<=10 && vx_dy<45 && onGround){ vxGo=null; goBack(); }
    }
    if(keys.jump&&onGround){ vy=jumpV; onGround=false; }
    vy+=g; y+=vy;
    if(y+ph>=groundTop){ y=groundTop-ph; vy=0; onGround=true; }
    for(const p of plats){
      if(vy>=0 && x+5<p.x+p.w && x+19>p.x && y+ph>=p.y-6 && y+ph<=p.y+22){ y=p.y-ph; vy=0; onGround=true; }
    }
    x=Math.max(6, Math.min(x, stage.clientWidth-30));
    player.style.left=x+'px'; player.style.top=y+'px';
    player.classList.toggle('walk', keys.left||keys.right);
    // 摄像机：纵向跟随
    const target=Math.max(0, Math.min(y-H*0.55, stageH-H));
    camY+=(target-camY)*0.12;
    stage.style.transform='translateY('+(-camY)+'px)';
    taskEls.forEach(el=>{
      const tx=parseFloat(el.style.left)+23, ty=parseFloat(el.style.top)+20;
      const dx=Math.abs(tx-(x+12)), dy=Math.abs(ty-(y+17));
      el.classList.toggle('near', dx<64&&dy<74);
    });
    vxGame=requestAnimationFrame(frame);
  }
  vxGame=requestAnimationFrame(frame);
  function vxTryEnter(){
    for(const el of taskEls){
      const tx=parseFloat(el.style.left)+23, ty=parseFloat(el.style.top)+20;
      const dx=Math.abs(tx-(x+12)), dy=Math.abs(ty-(y+17));
      if(dx<64&&dy<74){
        if(el.classList.contains('locked')){ if(typeof showToast==='function'){ try{ showToast('先完成前置任务再解锁'); }catch(e){} } return; }
        const lvId=el.getAttribute('data-lv'), taskId=el.getAttribute('data-task');
        if(lvId&&taskId) enterLevel(lvId, taskId);
        return;
      }
    }
    if(doorEl){
      const ddx=parseFloat(doorEl.style.left)||0, ddy=parseFloat(doorEl.style.top)||0;
      if(Math.abs(ddx+23-(x+12))<70 && Math.abs(ddy+23-(y+17))<70){ goBack(); return; }
    }
  }
  function kd(e){
    if(!_roomKbdOn()) return;   // 任务模态打开时不响应
    if(e.key==='ArrowLeft'||e.key==='a'){ keys.left=true; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='d'){ keys.right=true; e.preventDefault(); }
    if(e.key===' '){ keys.jump=true; e.preventDefault(); }
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); vxTryEnter(); }
  }
  function ku(e){
    if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
    if(e.key===' ') keys.jump=false;
  }
  window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
  vxKeys={kd,ku};
  scene.querySelectorAll('.sx-btn').forEach(b=>{
    const k=b.getAttribute('data-k');
    const dn=ev=>{ ev.preventDefault(); keys[k]=true; };
    const up=ev=>{ ev.preventDefault(); keys[k]=false; };
    b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up);
    b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
  });
}
function vxStop(){
  if(vxGame){ cancelAnimationFrame(vxGame); vxGame=null; }
  try{ if(vxKeys){ window.removeEventListener('keydown', vxKeys.kd); window.removeEventListener('keyup', vxKeys.ku); vxKeys=null; } }catch(e){}
}
function vxGoTask(lvId, taskId, el){
  if(el.getAttribute('data-locked')==='1'){ if(typeof showToast==='function'){ try{ showToast('先完成前置任务再解锁'); }catch(e){} } return; }
  try{ sessionStorage.setItem('roomPlayerPos', JSON.stringify({roomId:currentRoomId, floor:window._roomFlr||0, x:parseFloat(el.style.left)+20, y:parseFloat(el.style.top)+20, view:'vx'})); }catch(e){}
  enterLevel(lvId, taskId);
}
function sxStop(){
  if(sxGame){ cancelAnimationFrame(sxGame); sxGame=null; }
  if(sxKeys){ window.removeEventListener('keydown',sxKeys.kd); window.removeEventListener('keyup',sxKeys.ku); sxKeys=null; }
}

function musAudio(){ if(!musCtx){musCtx=new(window.AudioContext||window.webkitAudioContext)();} if(musCtx.state==='suspended')musCtx.resume(); return musCtx; }

function musPlay(k){
  if(!window.MUSIC_SONGS||!window.MUSIC_SONGS[k])return;
  try{
    const c=musAudio();
    if(musSrc){try{musSrc.stop();}catch(e){} musSrc=null;}
    const data=zzfxM.apply(null,window.MUSIC_SONGS[k]);
    const buf=c.createBuffer(data.length,data[0].length,zzfxR);
    for(let i=0;i<data.length;i++)buf.getChannelData(i).set(data[i]);
    if(!musGain){musGain=c.createGain();musGain.gain.value=.5;musGain.connect(c.destination);}
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.connect(musGain);src.start();musSrc=src;
  }catch(e){}
}

}

let currentRoomId=null;
function renderRoom(id){
  if(currentRoomId!==id){ currentRoomId=id; try{ window._roomFlr=0; }catch(e){} }
  const lv=content.levels.find(l=>l.id==id); if(!lv) return;
  const color=AREA_COLOR[lv.factoryArea]||lv.color;
  const [r,g,b]=hex2rgb(color);
  const rc=color, rcg=`rgba(${r},${g},${b},.5)`, rcg2=`rgba(${r},${g},${b},.13)`;
  const prog=levelProgress(lv); const st=areaStars(lv);
  const idx=content.levels.indexOf(lv);
  const locked=idx>0&&!levelProgress(content.levels[idx-1]).completed;
  const layer=ISA_LAYERS.find(L=>L.areas.includes(lv.factoryArea));
  const tasks=(lv.tasks||[]).filter(t=>!t.auto);
  const totalXP=tasks.reduce((s,t)=>s+(t.xp||0),0);
  const earnedXP=tasks.filter(t=>isTaskDone(t.id)).reduce((s,t)=>s+(t.xp||0),0);
  let cur=null; tasks.forEach(t=>{ if(cur===null&&!isTaskDone(t.id)) cur=t; });
  // RPG 室内场景：任务=房间里的设备，按楼层摆放，楼梯上楼
  // 楼层切分：普通任务分到各层，隐藏挑战放最后一层
  const regs=tasks.filter(t=>!String(t.id).includes('hidden'));
  const hiddens=tasks.filter(t=>String(t.id).includes('hidden'));
  const nFlr = Math.min(3, Math.max(2, Math.ceil(regs.length/7)));
  const perFlr = Math.ceil(regs.length/nFlr);
  const flrTasks=[];
  for(let fi=0;fi<nFlr;fi++) flrTasks.push(regs.slice(fi*perFlr, (fi+1)*perFlr));
  if(hiddens.length) flrTasks[flrTasks.length-1] = flrTasks[flrTasks.length-1].concat(hiddens);
  window._roomFlr = Math.min(window._roomFlr||0, flrTasks.length-1);
  const fi = window._roomFlr;
  const ft = flrTasks[fi]||[];
  const flrDone = ft.length>0 && ft.every(t=>isTaskDone(t.id));
  const hasNext = fi < flrTasks.length-1;
  // 俯视建筑：外轮廓墙 + 内部隔成 2-3 间小房间（内墙带门洞），任务设备分布各房间
  const WT=12, WB=12, WV=16, DH=96;
  const nRoom = Math.max(2, Math.min(3, Math.ceil(ft.length/2)));   // 2~3 间房
  // PC 大屏：俯视场景撑满视口、房间尺寸随之适配，避免右侧/下方留白
  const isPCLarge = !!(window.matchMedia && window.matchMedia('(min-width:1100px)').matches);
  const _availW = Math.max(760, (document.body.clientWidth||window.innerWidth) - 46);
  // PC：俯视 scene 高度适中（上限680px、下限460px，不撑满视口，保证 head+场景+footer 无页面滚动条）
  const _sceneH = isPCLarge ? Math.max(430, Math.min(660, window.innerHeight - 330)) : 0;
  let ROOM_W, ROOM_H;
  if (isPCLarge) {
    ROOM_W = Math.max(300, Math.round((_availW - WV*(nRoom+1)) / nRoom));
    ROOM_H = Math.max(430, Math.round(_sceneH - WT - WB - 20));
  } else { ROOM_W = 330; ROOM_H = 430; }
  window._rsSceneH = _sceneH || 0;   // 俯视 scene 高度（PC 含边框，JS 精确覆盖 CSS）
  const perRoom = Math.max(2, Math.ceil(ft.length / nRoom));          // 动态每间任务数，避免任务数超过容量导致越界
  const rooms=[];
  for(let ri=0;ri<nRoom;ri++) rooms.push({x:WV + ri*(ROOM_W+WV), w:ROOM_W});
  const stageW = WV + nRoom*ROOM_W + (nRoom-1)*WV + WV;
  const stageH = WT + ROOM_H + WB;
  const roomTasks=[];
  for(let ri=0;ri<nRoom;ri++) roomTasks.push(ft.slice(ri*perRoom, (ri+1)*perRoom));
  // 任务设备：每间房间放若干，左右错开、居中偏下
  const ftHTML = ft.map((t,i)=>{
    const done=isTaskDone(t.id), next=(!done&&t===cur);
    const cls=done?'done':(next?'next':'locked');
    const locked=!done&&!next;
    const ri=Math.min(Math.floor(i/perRoom), nRoom-1), j=i-ri*perRoom;
    const cnt=(roomTasks[ri]||[]).length;
    // 1个居中；2个左右分；3个三档错开
    const cx=rooms[ri].x+ROOM_W/2 + (cnt>2 ? (j-1)*56 : cnt>1 ? (j===0?-48:48) : 0);
    const cy=WT+ROOM_H*0.62;
    return `<div class="rs-task ${locked?'locked':cls}" style="left:${cx-29}px;top:${cy-25}px" data-lv="${lv.id}" data-task="${t.id}" onclick="roomGoTask('${lv.id}','${t.id}',this)" title="${t.title||t.name||t.label||''}" ${locked?'data-locked="1"':''}>
      <span class="rt-icon">${taskIconOf(t)}</span><span class="rt-name">${(t.title||t.name||t.label||'').slice(0,6)}</span>${next?'<span class="rt-arrow">▼</span>':''}
    </div>`;
  }).join('');
  // 内墙（带门洞）：相邻房间之间的隔墙分上/下两段，门洞错开上下，增强探索
  let partHTML='';
  for(let ri=1;ri<nRoom;ri++){
    const wx=rooms[ri].x-WV;
    const doorTop = (ri%2===1) ? WT+36 : WT+ROOM_H-DH-36;   // 交替：上→下→上
    const upH=doorTop-WT, downTop=doorTop+DH, downH=WT+ROOM_H-downTop;
    partHTML+=`<div class="rs-part" data-ri="${ri}" style="left:${wx}px;top:${WT}px;height:${ROOM_H}px">
      ${upH>6?`<div class="rs-inwall up" style="height:${upH}px"></div>`:''}
      ${downH>6?`<div class="rs-inwall down" style="top:${downTop-WT}px;height:${downH}px"></div>`:''}
    </div>`;
  }
  // 每间房间的家具（熔炉/工作台/货架/木箱 轮流），放在房间上侧作装饰+障碍
  const furnKinds=[['rs-furnace','熔炉'],['rs-bench','工作台'],['rs-shelf','货架'],['rs-crate c1','木箱']];
  let furnHTML='';
  rooms.forEach((rm,ri)=>{
    const fk=furnKinds[ri%furnKinds.length];
    furnHTML+=`<div class="rs-furn ${fk[0]}" data-name="${fk[1]}" style="left:${rm.x+20}px;top:${WT+16}px" onclick="roomGoPoint(event)"></div>`;
  });
  // 楼梯：放最后一间房间右侧
  const stairsCls = (flrDone&&hasNext)?'open':'locked';
  const lastRoom=rooms[nRoom-1];
  const stairsHTML = hasNext ? `<div class="rs-stairs ${stairsCls}" style="left:${lastRoom.x+ROOM_W-70}px;top:${WT+ROOM_H-80}px" ${flrDone&&hasNext?'onclick="rsGoStairs()"':''}>🪜</div>` : '';
  window._rtRoom={stageW:stageW, stageH:stageH, rooms:rooms, nRoom:nRoom};
  const doneCnt=ft.filter(t=>isTaskDone(t.id)).length;
  const viewType = ROOM_VIEW[lv.factoryArea]||'top';
  let sceneHTML;
  if(viewType==='side'){
    // 横版过关：室内房间剖面，任务设备分散在长廊各处，小人左右移动
    // 坐标在 sxStart 里根据场景实际高度动态计算（groundTop/平台/设备）
    const gap=250, baseX=140;
    const stageW=Math.max(900, ft.length*gap+380);
    let platHTML='', taskElsHTML='';
    ft.forEach((t,i)=>{
      const done=isTaskDone(t.id), next=(!done&&t===cur);
      const cls=done?'done':(next?'next':'locked');
      const onPlat=(i%2===1);
      taskElsHTML+=`<div class="sx-task ${cls}" data-plat="${onPlat?1:0}" data-idx="${i}" data-lv="${lv.id}" data-task="${t.id}" onclick="sxGoTask('${lv.id}','${t.id}',this)" title="${(t.title||t.name||t.label||'').replace(/"/g,'&quot;')}" ${cls==='locked'?'data-locked="1"':''}>
        <span class="rt-icon">${taskIconOf(t)}</span><span class="rt-name">${(t.title||t.name||t.label||'').slice(0,6)}</span>${next?'<span class="rt-arrow">▼</span>':''}
      </div>`;
      if(onPlat) platHTML+=`<div class="sx-platform" data-idx="${i}"></div>`;
    });
    // 室内墙面装饰：窗户 + 时钟 + 挂画 + 仪表盘 + 横管（挂在墙裙上方）
    const decoKinds=['win','clock','pic','gauge','pipe','win','clock','pic'];
    let decoHTML='';
    for(let k=0;k<decoKinds.length;k++){
      const dx=Math.round(70+k*250);
      const kind=decoKinds[k];
      const dy = kind==='pipe' ? 186 : (82+((k*37)%80));
      decoHTML+=`<div class="sx-deco ${kind}" style="left:${dx}px;top:${dy}px"></div>`;
    }
    // 地面障碍物：木箱/木桶（放在设备之间空隙，需跳跃越过）
    let propHTML='';
    const obCnt=Math.min(4, Math.max(2, Math.round(ft.length/2)));
    for(let k=0;k<obCnt;k++){
      const px=Math.round(330+k*250);
      const kind=(k%2===0)?'crate':'barrel';
      propHTML+=`<div class="sx-prop ${kind}" style="left:${px}px"></div>`;
    }
    window._sxRoom={flrDone:flrDone, hasNext:hasNext};
    sceneHTML=`<div class="sx-scene" id="sxScene">
      <div class="sx-bg"></div>
      <div class="sx-sky"></div>
      <div class="sx-ceil"></div>
      ${decoHTML}
      <div class="sx-stage" id="sxStage" style="width:${stageW}px">
        <div class="sx-ground"></div>${propHTML}${platHTML}${taskElsHTML}
        <div class="sx-stairs" id="sxStairs"></div>
        <div class="sx-door-exit" id="sxDoorExit" onclick="sxGoExit()" title="出厂区"><span class="rt-icon">🚪</span><span class="exit-badge">EXIT · 出厂区</span></div>
        <div class="sx-player" id="sxPlayer">
          <span class="pl hair"></span>
          <span class="pl face"></span><span class="pl eye"></span>
          <span class="pl body"></span><span class="pl belt"></span>
          <span class="pl arm l"></span><span class="pl hand l"></span>
          <span class="pl arm r"></span><span class="pl hand r"></span>
          <span class="pl leg l"></span><span class="pl boot l"></span>
          <span class="pl leg r"></span><span class="pl boot r"></span>
        </div>
      </div>
      <div class="sx-hud"><div class="sx-hint">点击地面小人走过去 · <b>←→</b> 移动 · <b>↑</b> 跳跃</div><div class="sx-btns">
        <button class="sx-btn" data-k="left">◀</button><button class="sx-btn" data-k="jump">▲</button><button class="sx-btn" data-k="right">▶</button></div></div>
      <div class="sx-rotate">📱 建议横屏游玩</div>
    </div>`;
  } else if(viewType==='vert'){
    // 纵版：竖直滚轴房间（往上跳爬塔），任务在不同高度的平台上；支持键盘+触摸
    const vxW = Math.max(560, Math.min(780, window.innerWidth*0.5));
    const vxH = 2600;
    const platGap = 260;
    const baseX = Math.round(vxW/2 - 60);
    let vPlats='', vTasks='';
    ft.forEach((t,i)=>{
      const done=isTaskDone(t.id), next=(!done&&t===cur);
      const cls=done?'done':(next?'next':'locked');
      const platTop = vxH - 90 - (i+1)*platGap;   // 平台从下往上递增高度
      vTasks+=`<div class="sx-task ${cls}" style="left:${baseX}px;top:${platTop-46}px" data-lv="${lv.id}" data-task="${t.id}" onclick="vxGoTask('${lv.id}','${t.id}',this)" title="${(t.title||t.name||t.label||'').replace(/"/g,'&quot;')}" ${cls==='locked'?'data-locked="1"':''}>
        <span class="rt-icon">${taskIconOf(t)}</span><span class="rt-name">${(t.title||t.name||t.label||'').slice(0,6)}</span>${next?'<span class="rt-arrow">▲</span>':''}
      </div>`;
      vPlats+=`<div class="vx-plat" style="left:${baseX-24}px;top:${platTop}px;width:170px"></div>`;
    });
    sceneHTML=`<div class="vx-scene" id="vxScene" style="height:${Math.max(480, Math.min(680, window.innerHeight*0.62))}px">
      <div class="sx-bg"></div><div class="sx-sky"></div><div class="sx-ceil"></div>
      <div class="vx-stage" id="vxStage" style="height:${vxH}px;width:${vxW}px">
        <div class="sx-ground"></div>
        ${vPlats}
        ${vTasks}
        <div class="sx-door-exit" id="vxDoorExit" onclick="vxGoExit()" title="出厂区"><span class="rt-icon">🚪</span><span class="exit-badge">EXIT · 出厂区</span></div>
        <div class="sx-player" id="vxPlayer">
          <span class="pl hair"></span><span class="pl face"></span><span class="pl eye"></span>
          <span class="pl body"></span><span class="pl belt"></span>
          <span class="pl arm l"></span><span class="pl hand l"></span>
          <span class="pl arm r"></span><span class="pl hand r"></span>
          <span class="pl leg l"></span><span class="pl boot l"></span>
          <span class="pl leg r"></span><span class="pl boot r"></span>
        </div>
      </div>
      <div class="sx-hud"><div class="sx-hint">←→ 移动 · <b>空格/▲</b> 跳 · 站图标旁 <b>↑</b> 进任务</div><div class="sx-btns">
        <button class="sx-btn" data-k="left">◀</button><button class="sx-btn" data-k="jump">▲</button><button class="sx-btn" data-k="right">▶</button></div></div>
    </div>`;
  } else {
    // 俯视工坊风：墙+地板+家具+任务设备
    sceneHTML = `<div class="room-scene" id="rsScene" style="${window._rsSceneH?'height:'+window._rsSceneH+'px':''}">
      <div class="rs-stage" id="rsStage" style="width:${window._rtRoom.stageW}px;height:${window._rtRoom.stageH}px">
        <div class="rs-floor" id="rsFloor"></div>
        <div class="rs-wall t"></div><div class="rs-wall b"></div>
        <div class="rs-wall l"></div><div class="rs-wall r"></div>
        ${partHTML}
        ${furnHTML}
        <div class="rs-label">${fi+1}F · ${flrDone?'✅ 本层完成':doneCnt+'/'+ft.length}</div>
        ${ftHTML}
        ${stairsHTML}
        <div class="rs-npc">👷</div>
        <div class="rs-exit" onclick="rsGoExit()" title="出厂区"><span class="rt-icon">🚪</span><span class="exit-badge">EXIT · 出厂区</span></div>
                <div class="rs-player" id="rsPlayer"><canvas width="20" height="20"></canvas></div>
      </div>
    </div>`;
  }
  const rfHint = flrDone&&hasNext ? '本层任务完成，点击🪜楼梯上楼 →' : (cur?'点发光的设备开始任务':'本层已完成');
  const games=GAME_TAGS[lv.factoryArea]||[];
  const narr=(lv.narrative&&typeof lv.narrative==='object'&&lv.narrative.intro)?lv.narrative.intro:(typeof lv.narrative==='string'?lv.narrative:'');
  const room=$('room');
  room.style.setProperty('--rc',rc); room.style.setProperty('--rcg',rcg); room.style.setProperty('--rcg2',rcg2);
  if(musOn&&layer){ const song=LAYER_SONG[layer.level]; if(song) try{ musPlay(song); }catch(e){} }
  room.innerHTML=`<div class="room-panel ${prog.completed?'done':''}">
    <div class="room-head">
      <div class="room-logo">${logoHTML(lv.factoryArea,color)}</div>
      <div class="room-title"><div class="rt-name">${lv.areaName} ${prog.completed?'<span class="room-cleared">🎉 全通关</span>':''}</div><div class="rt-sub">${lv.name} · ${layer?layer.level+' '+layer.name:'厂区'}</div></div>
    </div>
    <div class="room-progress"><div class="rp-bar"><div class="rp-fill" style="width:${prog.pct}%"></div></div><div class="rp-txt">已完成 ${prog.done}/${prog.total}（${prog.pct}%） · ⚡ ${earnedXP}/${totalXP} XP · 🏆 ${starStr(Math.max(st.self||0,st.teacher||0))}</div></div>
    <div class="room-narr"><div class="rt-who">👷 厂长</div>${narr||'加油，把这一层的任务打通！'}</div>
    ${sceneHTML}
    <div class="rs-foot">
      <div class="rt-sec">🎮 关联小游戏</div>
      <div class="games">${games.length?games.map(g=>`<span class="game-chip">${g}</span>`).join(''):'<span class="game-chip">-</span>'}</div>
    </div>
    <!-- 出口统一走场景里的 🚪 门：不再放 返回厂区/已通关 按钮，减少操作点 -->
  </div>`;
  room.classList.add('show');
  if(viewType==='side'){ sxStop(); setTimeout(()=>sxStart(),60); }
  if(viewType==='top'){ rsStop(); setTimeout(()=>rsStart(),60); }
  if(viewType==='vert'){ vxStop(); setTimeout(()=>vxStart(),60); }
}

function nextRoomFloor(){ if(typeof window._roomFlr==='number') window._roomFlr++; renderRoom(currentRoomId); }
function goPage(url, title){
  const t=document.getElementById('transit');
  if(t){ const e=document.getElementById('trText'); if(e) e.innerHTML='正在'+(title?'进入 <b>'+title+'</b>':'切换')+'…'; t.classList.add('show'); }
  setTimeout(()=>{ location.href=url; }, 500);
}
function goBack(){
  try{ sessionStorage.removeItem('mapRoom'); sessionStorage.removeItem('roomPlayerPos'); }catch(e){}
  const t=document.getElementById('transit');
  if(t){ const e=document.getElementById('trText'); if(e) e.innerHTML='正在返回 <b>厂区地图</b>…'; t.classList.add('show'); }
  setTimeout(()=>{ location.href='map_proto.html'; }, 500);
}
function enterLevel(id, taskId){
  // 已通关关卡（无当前任务）：不跳转空白/旧页，留在房间提示——重刷走房间里的发光设备
  if(!taskId){
    if(typeof showToast==='function'){ try{ showToast('本层已全部通关 🎉 点发光设备可重刷任务拿满分'); }catch(e){} }
    return;
  }
  // 房间作任务底板：优先在房间内直接打开任务模态（不跳转 student.html）
  if(typeof window.__openRoomTask==='function'){ try{ window.__openRoomTask(id, taskId); }catch(e){} return; }
  try{ if(id) sessionStorage.setItem('mapRoom', id); }catch(e){}
  const q=new URLSearchParams();
  if(taskId) q.set('task', taskId);
  else if(id) q.set('level', id);
  const qs=q.toString()?'?'+q.toString():'';
  let title='任务';
  if(id){ const lv=content&&content.levels&&content.levels.find(l=>l.id==id); if(lv) title=lv.areaName; }
  goPage('student.html'+qs, title);
}
function hideTransit(){ const t=document.getElementById('transit'); if(t){ setTimeout(()=>{ t.classList.remove('show'); }, 150); } }
function doLogout(){
  try{ sessionStorage.removeItem('token'); sessionStorage.removeItem('role'); sessionStorage.removeItem('name');
    sessionStorage.removeItem('mapFlow'); sessionStorage.removeItem('mapRoom'); sessionStorage.removeItem('lastCompleted'); }catch(e){}
  try{ if(musOn&&musSrc){ musSrc.stop(); musSrc=null; } }catch(e){}
  const t=document.getElementById('transit');
  if(t){ const e=document.getElementById('trText'); if(e) e.innerHTML='正在退出…'; t.classList.add('show'); }
  setTimeout(()=>{ location.href='index.html'; }, 400);
}
function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#121830;border:2px solid var(--amber);color:var(--text);padding:10px 16px;font-size:13px;z-index:80;border-radius:4px;font-family:inherit;animation:toastIn .25s ease';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
async function init(){
  const t=sessionStorage.getItem('token');
  if(!t){ location.href='map_proto.html'; return; }
  try{
    const mr=await fetch(API+'/api/student/me',{headers:{Authorization:'Bearer '+t}});
    if(mr.status===401){ try{ sessionStorage.removeItem('token'); }catch(e){} location.href='map_proto.html'; return; }
    const j=await mr.json();
    if(!j.ok){ location.href='map_proto.html'; return; }
    token=t; me=j.data;
    const cr=await fetch(API+'/api/game/content').then(r=>r.json());
    content=cr.data||cr;
    if(!content||!content.levels){ location.href='map_proto.html'; return; }
    const p=new URLSearchParams(location.search);
    const rid=p.get('room');
    const lv=content.levels.find(l=>String(l.id)===String(rid));
    if(!lv){ location.href='map_proto.html'; return; }
    renderRoom(lv.id);
    try{ musStart(); }catch(e){}
    // —— 任务宿主：暴露房间数据，等 room-task-host.js 就绪后挂载（房间内打开任务）——
    try{
      window.__roomData = { content, me, token, API, refresh: ()=>renderRoom(currentRoomId) };
      let _n=0;
      while(!window.__roomTaskHost && _n<60){ await new Promise(r=>setTimeout(r,50)); _n++; }
      if(window.__roomTaskHost){ window.__roomTaskHost.setup(window.__roomData); }
      else console.warn('任务宿主未就绪，任务将回退跳转 student.html');
    }catch(e){ console.error('任务宿主 setup fail:', e); }
    hideTransit();
  }catch(e){ console.error('room init fail:', e); location.href='map_proto.html'; }
}
init();

</script>
<script src="/data/music.js"></script>
<script type="module" src="/js/room-task-host.js"></script>
