<style>

    width: 100%; padding: 10px 12px; background: #000; border: 1px solid #2a2a3a;
    color: #00e676; font-family: inherit; font-size: 19px; outline: none;
  }
  .field input:focus { border-color: #ffb000; }

  .btn {
    width: 100%; padding: 10px; background: #2a2a3a; border: none;
    color: #c8c8d0; font-family: inherit; font-size: 19px; cursor: pointer;
    transition: all .2s; margin-bottom: 8px;
  }
  .btn:hover { background: #3a3a4a; }
  .btn.primary { background: #ffb000; color: #000; font-weight: bold; }
  .btn.primary:hover { background: #ffc030; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-link {
    background: none; border: 1px solid #2a2a3a; width: 100%; padding: 10px;
    color: #606070; font-family: inherit; font-size: 17px; cursor: pointer;
    transition: all .2s;

  .sep { text-align: center; color: #2a2a3a; font-size: 19px; margin: 12px 0; }

  .mp-head .t { color: #00bcd4; font-size: 14px; font-weight: bold; }
  .mp-head .close { cursor: pointer; color: #606070; font-size: 15px; padding: 0 4px; }
  .mp-head .close:hover { color: #ff5555; }

  .mp-now .cur { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mp-note { padding: 8px 13px; font-size: 11px; color: #505060; text-align: center; border-top: 1px solid #2a2a3a; }
  @media (max-width: 480px) {

zzfxV=.3; zzfxR=44100;
zzfxG=(q=1,k=.05,c=220,e=0,t=0,u=.1,r=0,F=1,v=0,z=0,w=0,A=0,l=0,B=0,x=0,G=0,d=0,y=1,m=0,C=0)=>{let b=2*Math.PI,H=v*=500*b/zzfxR**2,I=(0<x?1:-1)*b/4,D=c*=(1+2*k*Math.random()-k)*b/zzfxR,Z=[],g=0,E=0,a=0,n=1,J=0,K=0,f=0,p,h;e=99+zzfxR*e;m*=zzfxR;t*=zzfxR;u*=zzfxR;d*=zzfxR;z*=500*b/zzfxR**3;x*=b/zzfxR;w*=b/zzfxR;A*=zzfxR;l=zzfxR*l|0;for(h=e+m+t+u+d|0;a<h;Z[a++]=f)++K%(100*G|0)||(f=r?1<r?2<r?3<r?Math.sin((g%b)**3):Math.max(Math.min(Math.tan(g),1),-1):1-(2*g/b%2+2)%2:1-4*Math.abs(Math.round(g/b)-g/b):Math.sin(g),f=(l?1-C+C*Math.sin(2*Math.PI*a/l):1)*(0<f?1:-1)*Math.abs(f)**F*q*zzfxV*(a<e?a/e:a<e+m?1-(a-e)/m*(1-y):a<e+m+t?y:a<h-d?(h-a-d)/u*y:0),f=d?f/2+(d>a?0:(a<h-d?1:(h-a)/d)*Z[a-d|0]/2):f),p=(c+=v+=z)*Math.sin(E*x-I),g+=p-p*B*(1-1E9*(Math.sin(a)+1)%2),E+=p-p*B*(1-1E9*(Math.sin(a)**2+1)%2),n&&++n>A&&(c+=w,D+=w,n=0),!l||++J%l||(c=D,v=H,n=n||1);return Z}
zzfxM=(n,f,t,e=125)=>{let l,o,z,r,g,h,x,a,u,c,d,i,m,p,G,M=0,R=[],b=[],j=[],k=0,q=0,s=1,v={},w=zzfxR/e*60>>2;for(;s;k++)R=[s=a=d=m=0],t.map((e,d)=>{for(x=f[e][k]||[0,0,0],s|=!!f[e][k],G=m+(f[e][0].length-2-!a)*w,p=d==t.length-1,o=2,r=m;o<x.length+p;a=++o){for(g=x[o],u=o==x.length+p-1&&p||c!=(x[0]||0)|g|0,z=0;z<w&&a;z++>w-99&&u?i+=(i<1)/99:0)h=(1-i)*R[M++]/2||0,b[r]=(b[r]||0)-h*q+h,j[r]=(j[r++]||0)+h*q+h;g&&(i=g%1,q=x[1]||0,(g|=0)&&(R=v[[c=x[M=0]||0,g]]=v[[c,g]]||(l=[...n[c]],l[2]*=2**((g-12)/12),g>0?zzfxG(...l):[])))}m=G});return[b,j]}
</script>

window.IndexPlayer = (function(){
  const TRACK_KEY='bgm_track', MUTE_KEY='bgm_muted';
  let ctx=null, src=null, gain=null, cur=null;
  let muted=false;
  let flat=[];   // [{key,name,emoji}]
  try{ muted = localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}

  function audio(){
    if(!ctx){ ctx=new(window.AudioContext||window.webkitAudioContext)(); }
    if(ctx.state==='suspended'){ try{ctx.resume();}catch(e){} }
    return ctx;
  }
  function play(key, persist){
    if(!window.MUSIC_SONGS || !window.MUSIC_SONGS[key]) return;
    const c=audio(); stop(false);
    try{
      const song=window.MUSIC_SONGS[key];
      const data=zzfxM.apply(null,song);
      const buf=c.createBuffer(data.length,data[0].length,zzfxR);
      for(let i=0;i<data.length;i++) buf.getChannelData(i).set(data[i]);
      if(!gain){ gain=c.createGain(); gain.gain.value=0.7; gain.connect(c.destination); }
      const s=c.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(gain); s.start();
      src=s; cur=key;
      if(persist){ try{ localStorage.setItem(TRACK_KEY, key); }catch(e){} }
      updateUI();
    }catch(e){}
  }
  function stop(resetUI){ if(src){ try{src.stop();}catch(e){} src=null; } cur=null; if(resetUI!==false) updateUI(); }
  function playing(k){ return cur===k && !!src; }
  function findIdx(k){ for(let i=0;i<flat.length;i++) if(flat[i].key===k) return i; return -1; }
  function prev(){ if(!flat.length) return; const i=Math.max(0,findIdx(cur)); play(flat[(i-1+flat.length)%flat.length].key, true); }
  function next(){ if(!flat.length) return; const i=Math.max(0,findIdx(cur)); play(flat[(i+1)%flat.length].key, true); }
  function toggleMute(){
    muted=!muted;
    try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch(e){}
    if(muted){ stop(false); updateUI(); }
    else{ const saved=localStorage.getItem(TRACK_KEY)||'login'; play(saved, false); }
  }
  function getName(k){ const f=flat.find(x=>x.key===k); return f?f.name:k; }
  function markPlaying(){
    document.querySelectorAll('.mp-song.playing').forEach(x=>x.classList.remove('playing'));
    if(cur){ const el=document.getElementById('aud-'+cur); if(el) el.classList.add('playing'); }
  }
  function updateUI(){
    const icon=document.getElementById('musicIcon');
    const lbl=document.getElementById('musicLbl');
    const now=document.getElementById('mpNowName');
    const mb=document.getElementById('mpMuteBtn');
    if(icon) icon.textContent = muted ? '🔕' : '🎵';
    if(lbl) lbl.textContent = cur ? getName(cur) : (muted ? '已静音' : '登录页');
    if(now) now.textContent = (muted ? '🔕 已静音 · ' : '🎵 ') + (cur ? getName(cur) : '未播放');
    if(mb) mb.textContent = muted ? '🔇' : '🔊';
    markPlaying();
  }
  function togglePop(){
    const pop=document.getElementById('musicPop');
    const open=pop.classList.toggle('open');
    if(open) markPlaying();
    return open;
  }
  function closePop(){ document.getElementById('musicPop').classList.remove('open'); }
  function setList(groups){ flat=[]; groups.forEach(g=>g.items.forEach(it=>flat.push({key:it[0],name:it[2],emoji:it[1]}))); }
  function onFirst(){
    audio();
    if(!muted && !src){ const saved=localStorage.getItem(TRACK_KEY)||'login'; play(saved, false); }
    document.removeEventListener('pointerdown', onFirst);
    document.removeEventListener('keydown', onFirst);
  }
  document.addEventListener('pointerdown', onFirst);
  document.addEventListener('keydown', onFirst);
  document.addEventListener('pointerdown', function(ev){
    const ctl=document.getElementById('musicCtl');
    if(ctl && !ctl.contains(ev.target)) closePop();
  });
  return { play, stop, playing, prev, next, toggleMute, isMuted:()=>muted, current:()=>cur,
           getName, markPlaying, updateUI, togglePop, closePop, setList };
})();

(function(){
  IndexPlayer.setList(AUD_GROUPS);
  const box=document.getElementById('mpGroups');
  AUD_GROUPS.forEach(g=>{
    const h=document.createElement('div'); h.className='mp-grp'; h.textContent=g.t; box.appendChild(h);
    g.items.forEach(([key,e,n,t])=>{
      const r=document.createElement('div'); r.className='mp-song'; r.id='aud-'+key;
      r.innerHTML='<span class="e">'+e+'</span><span class="n">'+n+'</span><span class="t">'+t+'</span>';
      r.onclick=()=>{
        const P=window.IndexPlayer;
        if(P.playing(key)){ P.stop(); P.updateUI(); }
        else P.play(key, true);
      };
      box.appendChild(r);
    });
  });
  document.getElementById('musicBtn').addEventListener('click', function(ev){ ev.stopPropagation(); IndexPlayer.togglePop(); });
  document.getElementById('mpClose').addEventListener('click', function(){ IndexPlayer.closePop(); });
  document.getElementById('mpPrev').addEventListener('click', function(ev){ ev.stopPropagation(); IndexPlayer.prev(); });
  document.getElementById('mpNext').addEventListener('click', function(ev){ ev.stopPropagation(); IndexPlayer.next(); });
  document.getElementById('mpMuteBtn').addEventListener('click', function(ev){ ev.stopPropagation(); IndexPlayer.toggleMute(); });
  IndexPlayer.updateUI();
})();
</script>
<script>
const API = window.location.origin;

// 学生登录密码开关（临时暂停，先测翻牌）
const PASSWORD_ENABLED = true;

function $(id) { return document.getElementById(id); }

async function loginStudent() {
  const name = $('nameInput').value.trim();
  if (!name) { showError('请输入姓名'); return; }
  setLoading(true);
  try {
    const res = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password: PASSWORD_ENABLED ? $('studentPw').value : '' })
    });
    const data = await res.json();
    if (!data.ok) { showError(data.error); setLoading(false); return; }
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('role', 'student');
    sessionStorage.setItem('name', name);
    window.location.href = 'student.html';
  } catch (e) {
    showError('网络错误，请检查服务是否启动');
    setLoading(false);
  }
}

async function loginTeacher() {
  const name = $('nameInput').value.trim();
  const pw = $('pwInput').value;
  if (!name) { showError('请输入姓名'); return; }
  setLoading(true);
  try {
    const res = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password: pw })
    });
    const data = await res.json();
    if (!data.ok) { showError(data.error); setLoading(false); return; }
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('role', 'teacher');
    sessionStorage.setItem('name', 'teacher');
    window.location.href = 'teacher.html';
  } catch (e) {
    showError('网络错误，请检查服务是否启动');
    setLoading(false);
  }
}

function showTeacherLogin() {
  $('pwField').style.display = 'block';
  $('studentPwField').style.display = 'none';
  $('studentBtn').textContent = '教师登录';
  $('studentBtn').onclick = loginTeacher;
  $('teacherBtn').textContent = '← 返回学生登录';
  $('teacherBtn').onclick = () => location.reload();
}

function showError(msg) {
  $('errorMsg').textContent = msg;
}

function setLoading(v) {
  $('studentBtn').disabled = v;
  $('studentBtn').textContent = v ? '登录中…' : ($('pwField').style.display === 'block' ? '教师登录' : '进入实训');
}

$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') loginStudent(); });
$('studentPw').addEventListener('keydown', e => { if (e.key === 'Enter') loginStudent(); });
$('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') loginTeacher(); });

const savedName = sessionStorage.getItem('name');
if (savedName) $('nameInput').value = savedName;
</script>
</body>
</html>
