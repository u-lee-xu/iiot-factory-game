<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锐智工厂 · 工业互联网实训</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #0b0e1a; color: #e8eaf0;
    min-height: 100vh;
  }
  .card {
    background: #121830; border: 1px solid #2c3552; padding: 40px;
    width: 380px; max-width: 90vw;
  }
  .logo { color: #00bcd4; font-size: 32px; text-align: center; margin-bottom: 8px; }
  h1 { text-align: center; font-size: 19px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #9aa3bd; font-size: 19px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 19px; color: #606070; margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 10px 12px; background: #0a0e1c; border: 1px solid #2c3552;
    color: #00e676; font-family: inherit; font-size: 19px; outline: none;
  }
  .field input:focus { border-color: #ffb000; }
  .field input::placeholder { color: #3a3a48; }
  .btn {
    width: 100%; padding: 10px; background: #2a2a3a; border: none;
    color: #c8c8d0; font-family: inherit; font-size: 19px; cursor: pointer;
    transition: all .2s; margin-bottom: 8px;
  }
  .btn:hover { background: #3a3a4a; }
  .btn.primary { background: #ffb340; color: #1a1206; font-weight: bold; }
  .btn.primary:hover { background: #ffc850; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-link {
    background: none; border: 1px solid #2a2a3a; width: 100%; padding: 10px;
    color: #606070; font-family: inherit; font-size: 17px; cursor: pointer;
    transition: all .2s;
  }
  .btn-link:hover { border-color: #00bcd4; color: #00bcd4; }
  .error { color: #ff5555; font-size: 19px; margin-top: 8px; min-height: 18px; }
  .sep { text-align: center; color: #2a2a3a; font-size: 19px; margin: 12px 0; }

  /* 强制修改密码模态框 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #181820; border: 1px solid #2a2a3a; border-radius: 8px; padding: 24px; width: 100%; max-width: 420px; }
  .modal-box h2 { color: #ffb000; font-size: 20px; margin-bottom: 8px; font-weight: normal; }
  .modal-box .hint { color: #606070; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .pw-field { margin-bottom: 14px; }
  .pw-field label { display: block; color: #c8c8d0; font-size: 15px; margin-bottom: 6px; }
  .pw-field input { width: 100%; padding: 10px 12px; background: #000; border: 1px solid #2a2a3a; color: #00e676; font-family: inherit; font-size: 17px; outline: none; }
  .pw-field input:focus { border-color: #ffb000; }
  .pw-strength { height: 4px; background: #1e1e2a; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .pw-strength .bar { height: 100%; width: 0%; transition: width .3s, background .3s; }
  .pw-strength .bar.weak { background: #ff5555; }
  .pw-strength .bar.medium { background: #ffb000; }
  .pw-strength .bar.strong { background: #00e676; }
  .pw-hint { font-size: 12px; color: #3a3a48; margin-top: 4px; }
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; margin-bottom: 0; }

  /* ── 右上角音乐切换控制 ── */
  #musicCtl { position: fixed; top: 12px; right: 12px; z-index: 99; font-family: 'Courier New', monospace; }
  #musicBtn {
    display: flex; align-items: center; gap: 6px;
    background: #181820; border: 1px solid #2a2a3a; color: #c8c8d0;
    padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 16px;
    opacity: .8; user-select: none; max-width: 56vw;
  }
  #musicBtn:hover { opacity: 1; border-color: #00bcd4; }
  #musicBtn .lbl { font-size: 12px; color: #8b91a6; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #musicPop {
    position: absolute; top: 46px; right: 0; width: 340px; max-width: 92vw;
    background: #181820; border: 1px solid #2a2a3a; border-radius: 8px;
    display: none; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,.55);
  }
  #musicPop.open { display: block; }
  .mp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 13px; border-bottom: 1px solid #2a2a3a; }
  .mp-head .t { color: #00bcd4; font-size: 14px; font-weight: bold; }
  .mp-head .close { cursor: pointer; color: #606070; font-size: 15px; padding: 0 4px; }
  .mp-head .close:hover { color: #ff5555; }
  .mp-now { padding: 8px 13px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #2a2a3a; font-size: 13px; color: #ffd27d; }
  .mp-now .cur { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-nav { display: flex; gap: 5px; flex-shrink: 0; }
  .mp-nav button { background: #22222e; border: 1px solid #2a2a3a; color: #c8c8d0; cursor: pointer; border-radius: 4px; padding: 2px 8px; font-size: 13px; }
  .mp-nav button:hover { border-color: #00bcd4; color: #00bcd4; }
  #mpGroups { max-height: 46vh; overflow-y: auto; padding: 4px 8px 10px; }
  .mp-grp { color: #00bcd4; font-size: 12px; margin: 10px 0 3px; font-weight: bold; }
  .mp-song { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #c8c8d0; }
  .mp-song:hover { background: #22222e; }
  .mp-song.playing { background: #1e1a10; color: #ffd27d; }
  .mp-song .e { width: 20px; text-align: center; }
  .mp-song .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-song .t { font-size: 11px; color: #505060; }
  .mp-note { padding: 8px 13px; font-size: 11px; color: #505060; text-align: center; border-top: 1px solid #2a2a3a; }
  /* ── 桌面双栏布局：左品牌面板 + 右登录表单（高分屏不空荡、字更大） ── */
  .page{display:flex;align-items:center;justify-content:center;gap:64px;width:100%;min-height:100vh;padding:28px;position:relative;z-index:1}
  .brand{display:none}
  .card{position:relative;z-index:1}
  #musicCtl{position:relative;z-index:2}
  /* 背景：暗色像素网格 + 光晕，避免大面积纯黑留白 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 50% at 16%,80%,rgba(0,188,212,.12),transparent),
      radial-gradient(40% 30% at 85%,20%,rgba(255,176,0,.1),transparent),
      repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,transparent 1px 24px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0,transparent 1px 24px);
  }
</style>
</head>
<body>
<div id="musicCtl">
  <div id="musicBtn">
    <span class="ico">🎵</span>
    <span class="lbl" id="musicLbl">—</span>
  </div>
  <div id="musicPop">
    <div class="mp-head"><span class="t">背景音乐</span><span class="close" id="mpClose">✕</span></div>
    <div class="mp-now"><span class="ico">🎧</span><span class="cur" id="mpCur">未播放</span><div class="mp-nav"><button id="mpPrev">⏮</button><button id="mpMuteBtn">🔇</button><button id="mpNext">⏭</button></div></div>
    <div id="mpGroups"></div>
    <div class="mp-note">音乐来自开源素材库，仅供教学娱乐</div>
  </div>
</div>

<div class="page">
  <div class="card" id="loginCard">
    <div class="logo">⚙</div>
    <h1>锐智工厂</h1>
    <div class="subtitle">工业互联网实训 · 闯关游戏</div>

    <div class="field">
      <label for="nameInput">姓名</label>
      <input id="nameInput" type="text" placeholder="输入你的姓名" autocomplete="off">
    </div>

    <div class="field" id="studentPwField">
      <label for="studentPw">密码</label>
      <input id="studentPw" type="password" placeholder="初始密码 123456" autocomplete="current-password">
    </div>

    <div class="field" id="pwField" style="display:none">
      <label for="pwInput">教师密码</label>
      <input id="pwInput" type="password" placeholder="教师密码" autocomplete="current-password">
    </div>

    <button class="btn primary" id="studentBtn" onclick="loginStudent()">进入实训</button>
    <div class="error" id="errorMsg"></div>

    <div class="sep">或</div>

    <button class="btn-link" id="teacherBtn" onclick="showTeacherLogin()">教师登录</button>
  </div>
</div>

<!-- 强制修改密码模态框 -->
<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <h2>🔐 首次登录须修改密码</h2>
    <p class="hint">
      <span id="modalRole"></span> <span id="modalName"></span> 首次登录/使用默认密码，为了账号安全，请设置新密码。
      <br>密码至少 8 位，建议包含大小写字母、数字。
    </p>
    <div class="pw-field">
      <label for="newPw">新密码</label>
      <input id="newPw" type="password" placeholder="输入新密码" autocomplete="new-password">
      <div class="pw-strength"><div class="bar" id="strengthBar"></div></div>
      <div class="pw-hint" id="strengthHint">密码至少 8 位，建议包含大小写、数字</div>
    </div>
    <div class="pw-field">
      <label for="confirmPw">确认新密码</label>
      <input id="confirmPw" type="password" placeholder="再次输入新密码" autocomplete="new-password">
    </div>
    <div class="error" id="pwError"></div>
    <div class="modal-actions">
      <button class="btn" onclick="submitPasswordChange()" id="pwSubmit">确定修改</button>
    </div>
  </div>
</div>

<script>
// ===== 音乐播放器（复用原有逻辑）=====
const AUD_GROUPS = [
  { t: "🌙 环境·氛围", items: [["ambient1","🌌","星际漫游","3:20"],["ambient2","🌊","深海回响","2:45"],["ambient3","🌲","森林呼吸","4:10"]]},
  { t: "⚡ 电子·合成", items: [["synth1","⚡","霓虹脉动","2:55"],["synth2","🔮","赛博朋克","3:30"],["synth3","💫","数据流","2:40"]]},
  { t: "🎮 节奏·游戏", items: [["game1","🎮","像素冒险","2:15"],["game2","🕹️","复古街机","2:30"],["game3","🏁","极速追逐","2:05"]]}
];
const TRACK_KEY = 'iiot_track';
let cur = null, src = null, muted = false;
let flat = [];
const audio = () => { if(!src){ src = new Audio(); src.preload='auto'; src.volume=0.35; } return src; };
function play(key, userGesture){
  const meta = flat.find(f=>f.key===key); if(!meta) return;
  const a = audio(); a.src = '/audio/'+key+'.mp3'; a.loop=true;
  a.play().catch(()=>{ if(userGesture) alert('无法播放，请检查音频文件'); });
  cur = key; updateUI();
}
function stop(){ if(src){ src.pause(); src.currentTime=0; } cur=null; updateUI(); }
function playing(key){ return cur===key; }
function prev(){ if(!cur) return; const i=flat.findIndex(f=>f.key===cur); if(i>0) play(flat[i-1].key); }
function next(){ if(!cur) return; const i=flat.findIndex(f=>f.key===cur); if(i<flat.length-1) play(flat[i+1].key); }
function toggleMute(){ muted=!muted; if(src) src.muted=muted; updateUI(); }
function updateUI(){
  const lbl=document.getElementById('musicLbl');
  const curEl=document.getElementById('mpCur');
  const muteBtn=document.getElementById('mpMuteBtn');
  if(cur){ const m=flat.find(f=>f.key===cur); lbl.textContent=m?m.name:'—'; curEl.textContent=m?m.emoji+' '+m.name:'未播放'; }
  else { lbl.textContent='—'; curEl.textContent='未播放'; }
  muteBtn.textContent=muted?'🔈':'🔇';
  document.querySelectorAll('.mp-song').forEach(el=>el.classList.toggle('playing', el.id==='aud-'+cur));
}
function markPlaying(){ updateUI(); }
function getName(key){ const m=flat.find(f=>f.key===key); return m?m.name:key; }
function togglePop(){ const open=document.getElementById('musicPop').classList.toggle('open'); if(open) markPlaying(); return open; }
function closePop(){ document.getElementById('musicPop').classList.remove('open'); }
function setList(groups){ flat=[]; groups.forEach(g=>g.items.forEach(it=>flat.push({key:it[0],name:it[2],emoji:it[1]}))); }
function onFirst(){
  audio();
  if(!muted && !cur){ const saved=localStorage.getItem(TRACK_KEY)||'ambient1'; play(saved, false); }
  document.removeEventListener('pointerdown', onFirst);
  document.removeEventListener('keydown', onFirst);
}
document.addEventListener('pointerdown', onFirst);
document.addEventListener('keydown', onFirst);
document.addEventListener('pointerdown', function(ev){
  const ctl=document.getElementById('musicCtl');
  if(ctl && !ctl.contains(ev.target)) closePop();
});
window.IndexPlayer = { play, stop, playing, prev, next, toggleMute, isMuted:()=>muted, current:()=>cur,
           getName, markPlaying, updateUI, togglePop, closePop, setList };
</script>
<script>
(function(){
  window.IndexPlayer.setList(AUD_GROUPS);
  const box=document.getElementById('mpGroups');
  AUD_GROUPS.forEach(g=>{
    const h=document.createElement('div'); h.className='mp-grp'; h.textContent=g.t; box.appendChild(h);
    g.items.forEach(([key,e,n,t])=>{
      const r=document.createElement('div'); r.className='mp-song'; r.id='aud-'+key;
      r.innerHTML='<span class="e">'+e+'</span><span class="n">'+n+'</span><span class="t">'+t+'</span>';
      r.onclick=()=>{
        const P=window.IndexPlayer;
        if(P.playing(key)){ P.stop(); P.updateUI(); }
        else P.play(key, true);
      };
      box.appendChild(r);
    });
  });
  document.getElementById('musicBtn').addEventListener('click', function(ev){ ev.stopPropagation(); window.IndexPlayer.togglePop(); });
  document.getElementById('mpClose').addEventListener('click', function(){ window.IndexPlayer.closePop(); });
  document.getElementById('mpPrev').addEventListener('click', function(ev){ ev.stopPropagation(); window.IndexPlayer.prev(); });
  document.getElementById('mpNext').addEventListener('click', function(ev){ ev.stopPropagation(); window.IndexPlayer.next(); });
  document.getElementById('mpMuteBtn').addEventListener('click', function(ev){ ev.stopPropagation(); window.IndexPlayer.toggleMute(); });
  window.IndexPlayer.updateUI();
})();
</script>
<script>
const API = window.location.origin;

function $(id) { return document.getElementById(id); }

// 密码强度检查
function checkPasswordStrength(pw) {
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]/.test(pw)) score++;
  return score;
}

function updateStrengthUI(pw) {
  const bar = $('strengthBar');
  const hint = $('strengthHint');
  const score = checkPasswordStrength(pw);
  if (!pw) {
    bar.style.width = '0%';
    bar.className = 'bar';
    hint.textContent = '密码至少 8 位，建议包含大小写、数字';
    return;
  }
  if (score <= 2) {
    bar.style.width = '33%';
    bar.className = 'bar weak';
    hint.textContent = '强度：弱 - 建议增加大小写、数字、特殊字符';
  } else if (score <= 4) {
    bar.style.width = '66%';
    bar.className = 'bar medium';
    hint.textContent = '强度：中 - 可再加强';
  } else {
    bar.style.width = '100%';
    bar.className = 'bar strong';
    hint.textContent = '强度：强 ✓';
  }
}

// ===== 登录即弹服务端成就（教师发放 + 登录签到）：登录成功那一刻弹，逐个串行，弹完再继续流转 =====
async function loginThenShowAch(next) {
  try {
    const seen = JSON.parse(localStorage.getItem('ach_seen_v1') || '{}');
    let fresh = [];
    const res = await fetch(API + '/api/student/me', { headers: { Authorization: 'Bearer ' + sessionStorage.getItem('token') } });
    const j = await res.json();
    const data = (j && j.data) || {};
    const teacherAwards = data.teacherAwards || {};
    const newlyLogin = data.newlyAwardedLogin || [];
    Object.keys(teacherAwards).forEach(id => { if (!seen[id]) fresh.push(id); });
    (newlyLogin || []).forEach(id => { if (!seen[id]) fresh.push(id); });
    // 快照（含教师发放），避免 student.html(app.js) 重复弹
    const snap = Object.assign({}, data.achievements || {}, teacherAwards);
    localStorage.setItem('ach_seen_v1', JSON.stringify(snap));
    if (!fresh.length) { next(); return; }
    const meta = window.ACHIEVEMENTS || [];
    let i = 0;
    const run = () => {
      if (i >= fresh.length) { next(); return; }
      const a = meta.find(x => x.id === fresh[i]); i++;
      showAchModal(a, run);
    };
    run();
  } catch (e) { next(); }
}
function showAchModal(ach, done) {
  if (!ach) { done(); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:10001;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:#12121a;border:2px solid #ffd27d;border-radius:14px;padding:34px 48px;max-width:430px;width:90%;text-align:center;box-shadow:0 0 80px rgba(255,176,0,.28);position:relative;color:#eee';
  box.innerHTML = '<div style="font-size:64px;line-height:1">' + ach.emoji + '</div>' +
    '<div style="font-size:13px;color:#ffd27d;margin:14px 0 6px;letter-spacing:2px;font-weight:bold">🎁 老师发放的成就</div>' +
    '<div style="font-size:24px;font-weight:bold">' + ach.name + '</div>' +
    '<div style="font-size:13px;color:#999;margin-top:8px;line-height:1.6">' + ach.desc + '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  setTimeout(() => { ov.style.opacity = '0'; ov.style.transition = 'opacity .3s'; setTimeout(() => { ov.remove(); done(); }, 300); }, 2600);
}

async function loginStudent() {
  const name = $('nameInput').value.trim();
  if (!name) { showError('请输入姓名'); return; }
  setLoading(true);
  try {
    const res = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password: $('studentPw').value })
    });
    const data = await res.json();
    if (!data.ok) { showError(data.error); setLoading(false); return; }
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('role', 'student');
    sessionStorage.setItem('name', name);
    // 登录即弹服务端成就（教师发放/登录签到），串行弹完再改密或进厂区
    loginThenShowAch(() => {
      if (data.mustChangePassword) {
        showPasswordModal(name, 'student', data.token);
      } else {
        window.location.href = 'map_proto.html';
      }
    });
  } catch (e) {
    showError('网络错误，请检查服务是否启动');
    setLoading(false);
  }
}

async function loginTeacher() {
  const name = $('nameInput').value.trim();
  const pw = $('pwInput').value;
  if (!name) { showError('请输入姓名'); return; }
  setLoading(true);
  try {
    const res = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password: pw })
    });
    const data = await res.json();
    if (!data.ok) { showError(data.error); setLoading(false); return; }
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('role', 'teacher');
    sessionStorage.setItem('name', 'teacher');
    if (data.mustChangePassword) {
      showPasswordModal('teacher', 'teacher', data.token);
    } else {
      window.location.href = 'teacher.html';
    }
  } catch (e) {
    showError('网络错误，请检查服务是否启动');
    setLoading(false);
  }
}

// 强制修改密码模态框
function showPasswordModal(name, role, token) {
  sessionStorage.setItem('token', token);
  sessionStorage.setItem('role', role);
  sessionStorage.setItem('name', name);
  $('modalName').textContent = name;
  $('modalRole').textContent = role === 'teacher' ? '教师' : '学生';
  $('newPw').value = '';
  $('confirmPw').value = '';
  $('strengthBar').style.width = '0%';
  $('strengthBar').className = 'bar';
  $('strengthHint').textContent = '密码至少 8 位，建议包含大小写、数字';
  $('pwError').textContent = '';
  $('pwModal').classList.add('show');
}

async function submitPasswordChange() {
  const newPw = $('newPw').value;
  const confirmPw = $('confirmPw').value;
  const role = sessionStorage.getItem('role');

  if (newPw !== confirmPw) {
    $('pwError').textContent = '两次输入不一致';
    return;
  }
  if (newPw.length < 8) {
    $('pwError').textContent = '密码至少 8 位';
    return;
  }

  const score = checkPasswordStrength(newPw);
  if (score <= 2) {
    if (!confirm('密码强度较弱，确定要使用吗？')) return;
  }

  $('pwSubmit').disabled = true;
  $('pwSubmit').textContent = '修改中...';

  try {
    const res = await fetch(API + '/api/password', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + sessionStorage.getItem('token')
      },
      body: JSON.stringify({ newPassword: newPw })
    });
    const data = await res.json();
    if (!data.ok) {
      $('pwError').textContent = data.error;
      $('pwSubmit').disabled = false;
      $('pwSubmit').textContent = '确定修改';
      return;
    }
    $('pwModal').classList.remove('show');
    if (role === 'teacher') {
      window.location.href = 'teacher.html';
    } else {
      window.location.href = 'map_proto.html';
    }
  } catch (e) {
    $('pwError').textContent = '网络错误';
    $('pwSubmit').disabled = false;
    $('pwSubmit').textContent = '确定修改';
  }
}

function showTeacherLogin() {
  $('pwField').style.display = 'block';
  $('studentPwField').style.display = 'none';
  $('studentBtn').textContent = '教师登录';
  $('studentBtn').onclick = loginTeacher;
  $('teacherBtn').textContent = '← 返回学生登录';
  $('teacherBtn').onclick = () => location.reload();
}

function showError(msg) {
  $('errorMsg').textContent = msg;
}

function setLoading(v) {
  $('studentBtn').disabled = v;
  $('studentBtn').textContent = v ? '登录中…' : ($('pwField').style.display === 'block' ? '教师登录' : '进入实训');
}

$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') loginStudent(); });
$('studentPw').addEventListener('keydown', e => { if (e.key === 'Enter') loginStudent(); });
$('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') loginTeacher(); });
$('newPw').addEventListener('input', e => updateStrengthUI(e.target.value));
$('confirmPw').addEventListener('keydown', e => { if (e.key === 'Enter') submitPasswordChange(); });

const savedName = sessionStorage.getItem('name');
if (savedName) $('nameInput').value = savedName;
</script>
