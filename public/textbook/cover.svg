<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- 装饰线条 -->
  <g stroke="url(#textGrad)" stroke-width="1" opacity="0.15">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- 几何装饰 -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.3"/>
  <rect x="1000" y="500" width="150" height="150" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3" transform="rotate(45 1075 575)"/>
  <!-- 标题 -->
  <text x="600" y="280" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" text-anchor="middle">工业互联网基础</text>
  <text x="600" y="360" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">教材·教师用书·配套资源库</text>
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">面向高职高专《工业互联网基础》课程</text>
  <text x="600" y="520" font-family="system-ui, sans-serif" font-size="18" fill="#0d9488" text-anchor="middle">8 章教材 · 8 章教师用书 · 20 个微课视频 · 思维导图 & 知识图谱</text>
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">仅供教学使用 | 版权归原作者所有</text>
</svg>
