<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>数据驱动流程动画模板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0e1a}
body{font-family:'Courier New','Noto Sans Mono CJK SC',monospace}svg{display:block;width:100%;height:100%}
.blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.pad{transition:stroke .18s ease,filter .18s ease}.active .pad{filter:drop-shadow(0 0 15px var(--sc))}
.pathline{fill:none;stroke-linecap:square}.msg{font-size:22px;font-weight:700}.label-tag{font-size:20px;font-weight:700;letter-spacing:3px}
</style>
</head>
<body><svg id="scene" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs><pattern id="pixel" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#19203a"/><rect width="12" height="12" fill="#1c2340"/><rect x="12" y="12" width="12" height="12" fill="#1c2340"/></pattern>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="pktGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="roomGlow" cx="0.5" cy="0.5" r="0.8"><stop offset="0%" stop-color="#1a2340" stop-opacity=".7"/><stop offset="100%" stop-color="#0d1120" stop-opacity="0"/></radialGradient></defs>
<!-- ===== 终端窗（固定） ===== -->
<rect x="40" y="22" width="1200" height="118" rx="6" fill="#050508" stroke="#1a1a24" stroke-width="1"/>
<circle cx="62" cy="40" r="6" fill="#ff5555"/><circle cx="82" cy="40" r="6" fill="#ffb000"/><circle cx="102" cy="40" r="6" fill="#00e676"/>
<text id="termTitle" x="120" y="46" font-size="18" fill="#9aa3bd" letter-spacing="2">锐智工厂</text>
<rect x="120" y="50" width="1020" height="1" fill="#1a1a24"/>
<text id="term-line" x="56" y="104" font-size="22"><tspan fill="#00e676">student@factory:~$ </tspan><tspan fill="#cdd8ea" id="term-typing"></tspan></text>
<rect id="term-cur" x="0" y="0" width="10" height="18" fill="#00e676" class="blink" visibility="hidden"/>
<!-- ===== 车间地图（固定外壳） ===== -->
<rect x="40" y="158" width="1200" height="478" fill="url(#pixel)"/><rect x="40" y="158" width="1200" height="478" fill="url(#roomGlow)"/>
<rect x="40" y="158" width="1200" height="478" fill="none" stroke="#2a3352" stroke-width="10"/><rect x="48" y="166" width="1184" height="462" fill="none" stroke="#0a0d18" stroke-width="2"/>
<rect x="56" y="171" width="320" height="36" rx="4" fill="rgba(11,14,26,.92)" stroke="#ffb340" stroke-width="1.5"/><text id="mapLabel" class="label-tag" x="216" y="195" text-anchor="middle" fill="#ffb340">【 车间地图 · 概念 】</text>
<!-- ===== 数据区：连线/工位/包/消息/进度/成就（JS 生成/驱动） ===== -->
<g id="edgesLayer"></g>
<g id="nodesLayer"></g>
<g id="msgWrap"><rect id="msgBox" x="0" y="0" width="0" height="0" rx="4" fill="#0e2333" stroke="#00bcd4" stroke-width="1.5" opacity="0"/><text id="msgTxt" class="msg" x="0" y="0" text-anchor="middle" fill="#8be9fd" opacity="0"></text></g>
<g id="pktLayer" filter="url(#pktGlow)"></g>
<g id="prog"><rect x="60" y="660" width="1160" height="22" rx="3" fill="#0d1120" stroke="#2c3552" stroke-width="1"/><rect id="progFill" x="62" y="662" width="0" height="18" rx="2" fill="#ffb340" opacity="0.9"/><text id="progTxt" x="640" y="653" font-size="15" text-anchor="middle" fill="#cdd8ea" font-weight="700">0 / N</text></g>
<g id="ach" opacity="0"><rect x="390" y="232" width="500" height="90" rx="8" fill="#0e2a20" stroke="#00e676" stroke-width="3" filter="url(#glow)"/><text id="achT" x="640" y="272" font-size="30" font-weight="700" text-anchor="middle" fill="#00e676">✅ 完成</text><text id="achS" x="640" y="302" font-size="16" text-anchor="middle" fill="#9aa3bd">成就副题</text></g>
</svg>
<script>
/* ============================================================
   数据驱动流程动画模板 —— 只改 CFG，不用动代码
   stations: 工位（x/y=中心, w/h=宽高, color=霓虹色）
   edges:    连线（from/to 站id, type:'solid'|'dashed'）；几何由两端中心自动生成
   steps:    每步一条消息，可多个 move（按 lo~hi 时间比例执行）
             move.kind: 'path'顺序走 | 'fanout'扇形并行 | 'none'静态
             move.edges: 用到的连线id数组
   hl: 高亮的工位id数组
   total: 总时长ms（默认18000）
   线型语义：solid=主数据流, dashed=反馈/回传/应答
   模式：线性=边串成链；一对多=fanout；多对一=多边汇聚(fanout反用)；双向=两steps各走一边；
         环形=边围成环；分层=工位竖排；成对映射=两列+虚线映射边；时间线=工位横排+包穿越
   ============================================================ */
const CFG = {
  title: '锐智工厂 · 工业大数据 4V',
  mapLabel: '【 车间地图 · 数据四特征 】',
  achTitle: '✅ 4V：量大·快·杂·价值稀',
  achSub: '所以才要靠边缘过滤、平台存算、AI 挖价值',
  stations: [
    {id:'V1', x:230, y:250, emoji:'📈', name:'Volume', sub:'海量·数据量大', color:'#00bcd4'},
    {id:'V2', x:230, y:410, emoji:'⚡', name:'Velocity', sub:'高速·产生快', color:'#00e676'},
    {id:'V3', x:230, y:570, emoji:'🧩', name:'Variety', sub:'多样·类型多', color:'#ffb340'},
    {id:'V4', x:520, y:570, emoji:'💎', name:'Value', sub:'价值·低密度', color:'#ff5555'},
    {id:'H', x:950, y:400, emoji:'🗄️', name:'工业大数据', sub:'4V 四特征', color:'#e040fb'},
  ],
  edges: [
    {id:'e1', from:'V1', to:'H', type:'solid'}, {id:'e2', from:'V2', to:'H', type:'solid'},
    {id:'e3', from:'V3', to:'H', type:'solid'}, {id:'e4', from:'V4', to:'H', type:'solid'},
  ],
  steps: [
    {name:'① Volume 海量', color:'#00bcd4', desc:'① V=Volume：一天产生海量数据（GB/TB级）', hl:['V1'], moves:[{kind:'path', edges:['e1']}], start:1500, end:4500},
    {name:'② Velocity 高速', color:'#00e676', desc:'② V=Velocity：数据产生快，毫秒/秒级持续来', hl:['V2'], moves:[{kind:'path', edges:['e2']}], start:4500, end:7500},
    {name:'③ Variety 多样', color:'#ffb340', desc:'③ V=Variety：温度/振动/图像/订单，五花八门', hl:['V3'], moves:[{kind:'path', edges:['e3']}], start:7500, end:10500},
    {name:'④ Value 低价值密度', color:'#ff5555', desc:'④ V=Value：单个价值低，海量里才挖得出宝', hl:['V4'], moves:[{kind:'path', edges:['e4']}], start:10500, end:13500},
    {name:'⑤ 汇成 4V', color:'#e040fb', desc:'⑤ 四特征汇成工业大数据，靠平台/AI 挖价值', hl:['H'], moves:[{kind:'none'}], start:13500, end:16200},
  ],
  total: 18000, finale: 1800, msgY: 235, achY: 232,
};

/* ===== 引擎（勿改） ===== */
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||$('scene')).appendChild(e);return e;}
const stationById={}; CFG.stations.forEach(st=>stationById[st.id]=st);
const edgeById={}; CFG.edges.forEach(ed=>edgeById[ed.id]=ed);
// 生成连线（自动由两端中心连，dashed 用虚线；存长度供包移动）
function boxEdgePoint(st,tx,ty){ // 从 st 中心朝 (tx,ty) 的射线与 st 边框的交点
  const cx=st.x,cy=st.y,hw=(st.w||150)/2,hh=(st.h||130)/2,dx=tx-cx,dy=ty-cy;
  let t=Infinity;
  if(dx>0)t=Math.min(t,hw/dx); if(dx<0)t=Math.min(t,-hw/dx);
  if(dy>0)t=Math.min(t,hh/dy); if(dy<0)t=Math.min(t,-hh/dy);
  return [cx+dx*t,cy+dy*t];
}
function buildEdge(ed){
  const a=stationById[ed.from], b=stationById[ed.to];
  const off=ed.offset||0;
  let pa,pb;
  if(off===0){ pa=boxEdgePoint(a,b.x,b.y); pb=boxEdgePoint(b,a.x,a.y); }
  else{ // 平行偏移（用于双向往返：去/回两条平行线）
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    const ax=a.x+nx*off, ay=a.y+ny*off, bx=b.x+nx*off, by=b.y+ny*off;
    pa=boxEdgePoint(a,ax,ay); pb=boxEdgePoint(b,bx,by);
  }
  const d=`M ${pa[0].toFixed(1)} ${pa[1].toFixed(1)} L ${pb[0].toFixed(1)} ${pb[1].toFixed(1)}`;
  const p=el('path',{id:'E'+ed.id,d,class:'pathline',
    stroke:'#4a5570','stroke-width':4,'stroke-dasharray':ed.type==='dashed'?'8 8':'0 0',
    'stroke-linecap':'square'},$('edgesLayer'));
  ed._len=p.getTotalLength(); ed._path=p; ed._a=a; ed._b=b;
  const dx=pb[0]-pa[0], dy=pb[1]-pa[1], len=Math.hypot(dx,dy)||1;
  el('polygon',{points:`${pb[0]+dx/len*16},${pb[1]+dy/len*16-8} ${pb[0]+dx/len*16},${pb[1]+dy/len*16+8} ${pb[0]+dx/len*26},${pb[1]+dy/len*26}`,fill:'#4a5570'},$('edgesLayer'));
}
CFG.edges.forEach(buildEdge);
// 生成工位
CFG.stations.forEach(st=>{
  const g=el('g',{id:'N'+st.id,class:'s'},$('nodesLayer'));
  const w=st.w||150,h=st.h||130;
  el('rect',{class:'pad',x:st.x-w/2,y:st.y-h/2,width:w,height:h,rx:4,fill:'#121830',stroke:'#2c3552','stroke-width':2},g);
  const efs=st.emojiSize||38; // emoji 字号（默认38，适配框高 h=130）
  el('text',{x:st.x,y:st.y-24,'font-size':efs,'text-anchor':'middle'},g).textContent=st.emoji;
  el('text',{x:st.x,y:st.y+14,'font-size':(st.name||'').length>6?17:19,'font-weight':700,'text-anchor':'middle',fill:'#ffb340'},g).textContent=st.name;
  if(st.sub)el('text',{x:st.x,y:st.y+34,'font-size':12,'text-anchor':'middle',fill:'#7c8ca6'},g).textContent=st.sub;
});
// 生成数据包（fanout 需要多个，先放一个池）
const PKTS=[el('rect',{width:16,height:16,fill:'#fff9c4',stroke:'#ffb340','stroke-width':2},$('pktLayer'))];
for(let i=1;i<6;i++){const r=el('rect',{width:16,height:16,fill:'#fff9c4',stroke:'#ffb340','stroke-width':2,opacity:0},$('pktLayer'));PKTS.push(r);}
$('termTitle').textContent=CFG.title; $('mapLabel').textContent=CFG.mapLabel;
$('achT').textContent=CFG.achTitle; $('achS').textContent=CFG.achSub;
const MSGY=CFG.msgY||250, ACHY=CFG.achY||232;
{const r=$('ach').querySelector('rect');r.setAttribute('y',ACHY);r.setAttribute('height','90');$('achT').setAttribute('y',ACHY+40);$('achS').setAttribute('y',ACHY+70);}
$('progTxt').textContent='0 / '+CFG.steps.length;
const TOTAL=CFG.total||18000;
// 时间分配：开头留 1.5s 标题，末步后留 finale 给成就/总结（停留 1-2s）
const FINALE=(CFG.finale&&CFG.finale>=1000&&CFG.finale<=2000)?CFG.finale:1800;
if(!CFG.steps.some(s=>s.start!==undefined)){
  const n=CFG.steps.length, seg=(TOTAL-FINALE-1500)/n; let acc=1500;
  CFG.steps.forEach(s=>{s.start=acc;s.end=acc+seg;acc+=seg;});
}
const LAST_END=CFG.steps[CFG.steps.length-1].end;
const t0=performance.now();let typed='',typedTarget='',typedProgress=0,lastCur=-2;
function ptOnEdge(ed,f){const p=ed._path.getPointAtLength(ed._len*f);return [p.x,p.y];}
function draw(now){
  const t=now-t0;let cur=-1;
  CFG.steps.forEach((s,i)=>{if(t>=s.start&&t<s.end)cur=i;});
  const isFinal=t>=LAST_END;
  const step=isFinal?-1:cur;
  // 高亮
  CFG.stations.forEach(st=>{
    const on=isFinal||(step>=0&&(CFG.steps[step].hl||[]).includes(st.id));
    const node=$('N'+st.id);
    node.setAttribute('class','s'+(on?' active':''));
    node.querySelector('.pad').style.setProperty('--sc',st.color);
    node.querySelector('.pad').setAttribute('stroke',on?st.color:'#2c3552');
  });
  // 连线高亮：只在包流动的边亮（初始全灰，建立通信的常绿由 CFG.extra 控制）
  CFG.edges.forEach(ed=>{
    const on=isFinal||(step>=0&&(CFG.steps[step].moves||[]).some(m=>(m.edges||[]).includes(ed.id)));
    ed._path.setAttribute('stroke',on? stationById[ed.to].color : '#4a5570');
  });
  // 数据包
  PKTS.forEach(p=>p.setAttribute('opacity','0'));
  if(step>=0){
    const s=CFG.steps[step],color=s.color;let pk=0;
    (s.moves||[{kind:'none'}]).forEach(m=>{
      const lo=m.lo||0, hi=(m.hi===undefined?1:m.hi);
      const f0=Math.min(1,Math.max(0,(t-s.start-(s.end-s.start)*lo)/((s.end-s.start)*(hi-lo))));
      const f=Math.min(1,f0);
      if(m.kind==='path'&&f>=0){ // 顺序走多条边
        const tot=m.edges.reduce((a,e)=>a+edgeById[e]._len,0);let acc=0,target=tot*f,pkt=PKTS[pk++];
        for(const eid of m.edges){const ed=edgeById[eid];
          if(target<=acc+ed._len){const pp=ed._path.getPointAtLength(Math.max(0,target-acc));pkt.setAttribute('x',pp.x-8);pkt.setAttribute('y',pp.y-8);pkt.setAttribute('stroke',color);pkt.setAttribute('opacity','1');break;}
          acc+=ed._len;}
      }else if(m.kind==='fanout'&&f>=0){ // 并行扇形
        m.edges.forEach(eid=>{const ed=edgeById[eid],pp=ed._path.getPointAtLength(ed._len*f);const pkt=PKTS[pk++];pkt.setAttribute('x',pp.x-8);pkt.setAttribute('y',pp.y-8);pkt.setAttribute('stroke',color);pkt.setAttribute('opacity','1');});
      }
    });
    $('msgBox').setAttribute('x',640-135);$('msgBox').setAttribute('y',MSGY);$('msgBox').setAttribute('width','270');$('msgBox').setAttribute('height','40');$('msgBox').setAttribute('stroke',color);$('msgBox').setAttribute('opacity','1');
    $('msgTxt').setAttribute('x',640);$('msgTxt').setAttribute('y',MSGY+27);$('msgTxt').textContent=s.name;$('msgTxt').setAttribute('fill',color);$('msgTxt').setAttribute('opacity','1');
  }else{$('msgBox').setAttribute('opacity','0');$('msgTxt').setAttribute('opacity','0');}
  // 终端打字
  if(cur!==lastCur){
    if(step>=0)typedTarget=CFG.steps[cur].desc; else if(isFinal)typedTarget='★ '+CFG.achSub; else typedTarget='';
    typed='';typedProgress=0;lastCur=cur;
  }
  const dt=Math.min(0.05,(now-(window.__last||now))/1000);window.__last=now;typedProgress+=30*dt;
  $('term-typing').textContent=typedTarget.slice(0,Math.floor(typedProgress));
  const tl=$('term-line'),w=tl.getSubStringLength(0,tl.textContent.length),tc=$('term-cur');
  tc.setAttribute('x',56+w);tc.setAttribute('y',86);tc.setAttribute('visibility','visible');
  // 进度 + 成就
  const n=isFinal?CFG.steps.length:(step+1);
  $('progFill').setAttribute('width',(n/CFG.steps.length)*1156);
  $('progTxt').textContent=n+' / '+CFG.steps.length;
  if(isFinal)$('ach').setAttribute('opacity',Math.min(1,(t-(LAST_END+300))/400));  // 成就停留 FINALE ms
  if(CFG.extra)CFG.extra(step,isFinal,t);  // 自定义元素钩子（缓存表/额外文字/穿层等）
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
