<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锐智工厂 · 工业互联网实训</title>
<style>
:root {
  --bg: #0a0a10; --panel: #12121a; --border: #1e1e2a;
  --text: #c8c8d0; --dim: #8e8ea0; --amber: #ffb000;
  --green: #00e676; --cyan: #00bcd4; --red: #ff5555;
  --purple: #9c27b0; --orange: #ff9800; --pink: #e040fb;
  --blue: #2196f3; --star: #ffb000;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Courier New', 'Noto Sans Mono CJK SC', monospace;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  font-size: 17px;
}

/* ===== Header ===== */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px;
}
.h-left { display: flex; align-items: center; gap: 10px; }
.h-left .logo { color: var(--cyan); font-size: 19px; }
.h-left .title { font-size: 16px; }
.h-left .rank-badge {
  background: var(--amber); color: #000; padding: 1px 8px;
  font-size: 16px; font-weight: bold; border-radius: 2px;
}
.h-right { display: flex; align-items: center; gap: 12px; font-size: 16px; }
.director-avatar {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  background: #1a1a24; border: 1px solid var(--border); border-radius: 4px;
  transition: transform .2s, box-shadow .2s;
}
.director-avatar.director-mood-proud { transform: scale(1.1); box-shadow: 0 0 12px #0f0; }
.director-avatar.director-mood-stern { transform: scale(1.05); box-shadow: 0 0 12px #f40; animation: stern-shake 0.5s ease; }
.director-avatar.director-mood-awkward { filter: grayscale(0.3) sepia(0.2); opacity: 0.9; }
.director-avatar.director-mood-thinking { animation: thinking-bounce 1.5s infinite; }
.xp-wrap { width: 160px; height: 12px; background: #1a1a24; border: 1px solid var(--border); position: relative; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--green)); transition: width .5s; }
.xp-label { position: absolute; top: 0; left: 0; right: 0; text-align: center; line-height: 12px; font-size: 11px; color: #000; font-weight: bold; }
.btn-logout { background: none; border: 1px solid var(--border); color: var(--dim); padding: 3px 8px; font-family: inherit; font-size: 16px; cursor: pointer; }
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ===== Factory View ===== */
.factory-wrap {
  padding: 20px 20px 12px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.factory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  min-width: 600px;
}
.area {
  position: relative; padding: 14px 10px 10px;
  background: #0e0e16; border: 1px solid var(--border);
  cursor: pointer; transition: all .3s; text-align: center;
  overflow: hidden;
}
.area::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--dim); transition: background .5s;
}
.area .icon { font-size: 28px; display: block; margin-bottom: 2px; transition: transform .3s; }
.area .a-name { font-size: 16px; color: var(--dim); transition: color .3s; }
.area .a-stars { font-size: 11px; height: 14px; letter-spacing: 1px; margin-top: 2px; }
.area .lock-icon { position: absolute; top: 8px; right: 8px; font-size: 16px; opacity: .4; }

.area.locked { opacity: .5; }
.area.locked .icon { filter: grayscale(1); }
.area.locked::before { background: var(--dim); }

.area.active { border-color: var(--border); }
.area.active::before { background: var(--color, var(--cyan)); }
.area.active .icon { animation: areaPulse 2s ease-in-out infinite; }
.area.active .a-name { color: var(--color, var(--cyan)); }
.area.active:hover { border-color: var(--color, var(--cyan)); transform: translateY(-2px); }
.area.active:hover .icon { transform: scale(1.1); }

.area.completed { border-color: rgba(0,230,118,.3); }
.area.completed::before { background: var(--green); }
.area.completed .icon { filter: none; }
.area.completed .a-name { color: var(--green); }
.area.completed .lock-icon { display: none; }

.area.current { border-color: var(--amber); box-shadow: 0 0 15px rgba(255,176,0,.1); }

/* connecting pipes between areas */
.factory-rows { display: flex; flex-direction: column; gap: 6px; }
.factory-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pipe-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: 16px; margin: -4px 0; }
.pipe-cell { position: relative; }
.pipe-cell .h-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--border); }
.pipe-cell .h-line.done { background: var(--green); }
.pipe-cell .v-line { position: absolute; top: -10px; left: 50%; width: 2px; height: 26px; background: var(--border); transform: translateX(-50%); }
.pipe-cell .v-line.done { background: var(--green); }
.pipe-cell .arrow { position: absolute; top: 50%; right: -4px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid var(--border); transform: translateY(-50%); }
.pipe-cell .arrow.done { border-left-color: var(--green); }

@keyframes areaPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ===== Mission Panel ===== */
.mission-wrap {
  padding: 16px 20px;
}
.mission-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
}
.mission-title { font-size: 16px; color: var(--amber); }
.mission-title .lv-tag { color: var(--dim); font-size: 16px; }
.mission-story {
  font-size: 16px; color: var(--dim); line-height: 1.6;
  padding: 10px 14px; background: #0e0e16; border-left: 3px solid var(--color, var(--cyan));
  margin-bottom: 14px;
}
.task-progress { font-size: 16px; color: var(--dim); }
.task-list { list-style: none; }
.task-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  font-size: 16px; transition: background .2s;
  cursor: pointer;
}
.task-item:hover { background: #14141e; }
.task-item.done { color: var(--dim); }
.task-item.done .task-title { text-decoration: line-through; }
.task-item .cb {
  width: 16px; height: 16px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 16px; transition: all .2s; border-radius: 2px;
}
.task-item.done .cb { border-color: var(--green); background: var(--green); color: #000; }
.task-item .task-title { flex: 1; min-width: 60%; word-break: break-word; line-height: 1.4; }
.task-item .task-xp { font-size: 16px; color: var(--amber); white-space: nowrap; }
/* ===== Knowledge Tags ===== */
.task-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  width: 100%;
  margin-top: 4px;
}
.task-tag {
  font-size: 11px;
  padding: 1px 6px;
  background: #1a1a24;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--dim);
  white-space: nowrap;
  transition: all .2s;
}
.task-tag:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(0,188,212,.1);
}
.task-tag.category-通讯协议 { border-color: var(--cyan); color: var(--cyan); }
.task-tag.category-工业协议 { border-color: var(--blue); color: var(--blue); }
.task-tag.category-架构设计 { border-color: var(--purple); color: var(--purple); }
.task-tag.category-数据建模 { border-color: var(--pink); color: var(--pink); }
.task-tag.category-数据存储 { border-color: var(--orange); color: var(--orange); }
.task-tag.category-低代码开发 { border-color: var(--green); color: var(--green); }
.task-tag.category-部署运维 { border-color: var(--amber); color: var(--amber); }
.task-tag.category-设备管理 { border-color: var(--red); color: var(--red); }
.task-tag.category-工业安全 { border-color: var(--red); color: var(--red); }
.task-tag.category-运维排障 { border-color: var(--purple); color: var(--purple); }

.task-item.auto { cursor: default; opacity: .6; }
.task-item.hidden { border-left: 2px solid var(--purple); }
.task-item.hidden .task-title { color: var(--purple); }

/* ===== Task Interactive Modal ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border);
  width: 600px; max-width: 94vw; max-height: 85vh;
  display: flex; flex-direction: column;
}
.modal-head {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-head h3 { font-size: 15px; }
.modal-close { background: none; border: none; color: var(--dim); font-size: 19px; cursor: pointer; font-family: inherit; }
.modal-close:hover { color: var(--red); }
.modal-body { padding: 16px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 10px 16px; border-top: 1px solid var(--border); text-align: right; display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 6px 16px; border: 1px solid var(--border); background: #1a1a24; color: var(--text); font-family: inherit; font-size: 16px; cursor: pointer; transition: all .2s; }
.btn:hover { background: #2a2a3a; }
.btn-primary { background: var(--amber); color: #000; border-color: var(--amber); font-weight: bold; }
.btn-primary:hover { background: #ffc030; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-success { background: var(--green); color: #000; border-color: var(--green); font-weight: bold; }
.btn-success:disabled { opacity: .4; cursor: not-allowed; }

/* ===== Interaction: Terminal ===== */
.term-window {
  background: #0a0a10; border: 1px solid #1a1a24; padding: 12px;
  font-size: 16px; line-height: 1.6; min-height: 120px;
  font-family: 'Courier New', monospace;
}
.term-line { white-space: pre-wrap; word-break: break-all; }
.term-prompt { color: var(--green); }
.term-cmd { color: var(--text); }
.term-out { color: var(--dim); }
.term-cursor { display: inline-block; width: 6px; height: 14px; background: var(--green); animation: blink 1s step-end infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }
.term-input-line { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.term-input-line .prompt { color: var(--green); font-size: 16px; }
.term-input-line input {
  flex: 1; background: #0a0a10; border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 16px; padding: 4px 6px; outline: none;
}
.term-input-line input:focus { border-color: var(--amber); }

/* ===== Interaction: Quiz ===== */
.quiz-options { display: flex; flex-direction: column; gap: 6px; }
.quiz-opt {
  padding: 8px 12px; border: 1px solid var(--border); cursor: pointer;
  font-size: 15px; transition: all .2s; word-break: break-word; line-height: 1.5;
}
.quiz-opt:hover { border-color: var(--cyan); }
.quiz-opt.selected { border-color: var(--amber); background: rgba(255,176,0,.1); }
.quiz-opt.correct { border-color: var(--green); background: rgba(0,230,118,.1); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(255,85,85,.1); }

/* ===== Interaction: Fill Blank ===== */
.fill-blank { font-size: 15px; line-height: 2; }
.fill-blank .highlight { color: var(--amber); }
.fill-blank select, .fill-blank input {
  background: #0a0a10; border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 16px; padding: 4px 8px; margin: 0 4px; outline: none;
}
.fill-blank select:focus, .fill-blank input:focus { border-color: var(--amber); }

/* ===== Interaction: Sort ===== */
.sort-area {
  display: flex; flex-direction: column; gap: 4px; min-height: 120px;
  padding: 8px; border: 1px dashed var(--border);
}
.sort-item {
  padding: 6px 10px; border: 1px solid var(--border); background: #0e0e16;
  cursor: grab; font-size: 16px; transition: all .2s;
  user-select: none;
}
.sort-item:hover { border-color: var(--cyan); }
.sort-item.dragging { opacity: .5; }
.sort-item.drag-over { border-top: 2px solid var(--amber); }

/* ===== Interaction: Progress Bar ===== */
.progress-steps { display: flex; gap: 8px; margin: 16px 0; }
.prog-step {
  flex: 1; text-align: center; padding: 10px 4px;
  border: 1px solid var(--border); font-size: 16px;
  transition: all .5s; position: relative;
}
.prog-step.done { border-color: var(--green); background: rgba(0,230,118,.05); color: var(--green); }
.prog-step.active { border-color: var(--amber); background: rgba(255,176,0,.05); }
.prog-step .step-num { display: block; font-size: 16px; margin-bottom: 4px; }
.prog-bar-bg { height: 4px; background: #1a1a24; margin: 12px 0; overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--green); width: 0; transition: width .3s; }
/* ===== Interaction: Install Wizard ===== */
.wizard-steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.wiz-dot { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #1a1a24; border: 2px solid var(--border); font-size: 16px; color: var(--dim); transition: all .3s; }
.wiz-dot.done { background: var(--green); border-color: var(--green); color: #000; }
.wiz-dot.active { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 8px rgba(255,176,0,.3); }
.wiz-dot.active::after { content: ''; position: absolute; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--amber); animation: wiz-pulse 1.2s infinite; }
@keyframes wiz-pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
.wizard-narrative { background: rgba(255,176,0,.06); border-left: 3px solid var(--amber); padding: 10px 14px; margin-bottom: 12px; font-size: 15px; line-height: 1.6; color: var(--text); border-radius: 0 6px 6px 0; }
.wiz-narr-icon { font-size: 16px; }
.wiz-narr-label { color: var(--amber); font-weight: bold; margin-right: 4px; }
.wizard-question { font-size: 16px; color: var(--text); margin-bottom: 6px; font-weight: 600; }


/* ===== Interaction: Scenario Match ===== */
.match-area { display: flex; gap: 20px; align-items: flex-start; }
.match-col { flex: 1 1 0; min-width: 0; }
.match-col h4 { font-size: 16px; color: var(--dim); margin-bottom: 6px; }
.match-item {
  padding: 6px 10px; border: 1px solid var(--border); margin-bottom: 4px;
  font-size: 16px; cursor: pointer; transition: all .2s; text-align: center;
  word-break: break-word; line-height: 1.4;
}
.match-item:hover { border-color: var(--cyan); }
.match-item.selected { border-color: var(--amber); }
.match-item.matched { border-color: var(--green); opacity: .6; cursor: default; }
.match-item.wrong { border-color: var(--red); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)} }
@media (max-width: 560px) {
  .match-area { gap: 8px; }
  .match-item { font-size: 13px; padding: 5px 6px; }
  .match-col h4 { font-size: 14px; }
}

/* ===== Interaction: Code Review ===== */
.code-block {
  background: #0a0a10; border: 1px solid #1a1a24; padding: 12px;
  font-size: 16px; line-height: 1.6; font-family: 'Courier New', monospace;
  white-space: pre-wrap; margin-bottom: 12px;
}
.code-line { display: flex; gap: 8px; padding: 2px 0; align-items: flex-start; }
.code-line .code-no {
  flex-shrink: 0; min-width: 20px; text-align: center; user-select: none;
  color: #000; background: var(--cyan); border-radius: 3px;
  font-size: 13px; font-weight: bold; line-height: 18px; padding: 0 3px;
}
.code-line .code-text { word-break: break-all; }

/* ===== Interaction: Ethics ===== */
.ethics-scenario {
  padding: 12px; background: #0e0e16; border-left: 3px solid var(--amber);
  font-size: 16px; line-height: 1.7; margin-bottom: 12px;
}
.ethics-choices { display: flex; flex-direction: column; gap: 6px; }
.ethics-choice {
  padding: 8px 12px; border: 1px solid var(--border); cursor: pointer;
  font-size: 16px; transition: all .2s;
}
.ethics-choice:hover { border-color: var(--cyan); }
.ethics-choice.selected { border-color: var(--amber); }
.ethics-choice.revealed-best { border-color: var(--green); background: rgba(0,230,118,.1); }
.ethics-choice.revealed { border-color: var(--dim); opacity: .6; }
.ethics-consequence {
  margin-top: 8px; padding: 8px; font-size: 16px; display: none;
}
.ethics-consequence.show { display: block; }
.ethics-consequence.good { background: rgba(0,230,118,.1); border-left: 3px solid var(--green); }
.ethics-consequence.ok { background: rgba(255,176,0,.1); border-left: 3px solid var(--amber); }
.ethics-consequence.bad { background: rgba(255,85,85,.1); border-left: 3px solid var(--red); }

/* ===== Interaction: Diagnosis Tree ===== */
.diag-question { font-size: 15px; margin-bottom: 10px; color: var(--amber); }
.diag-options { display: flex; flex-direction: column; gap: 6px; }
.diag-opt { padding: 8px 12px; border: 1px solid var(--border); cursor: pointer; font-size: 16px; transition: all .2s; }
.diag-opt:hover { border-color: var(--cyan); }
.diag-opt.correct { border-color: var(--green); background: rgba(0,230,118,.1); }
.diag-opt.wrong { border-color: var(--red); background: rgba(255,85,85,.1); }
.diag-progress { font-size: 16px; color: var(--dim); margin-top: 8px; }

/* ===== Interaction: Drag Classify ===== */
.classify-area { display: flex; gap: 12px; }
.classify-pool { flex: 1; }
.classify-pool h4, .classify-cats h4 { font-size: 16px; color: var(--dim); margin-bottom: 6px; }
.classify-item {
  padding: 5px 8px; border: 1px solid var(--border); margin-bottom: 3px;
  font-size: 16px; cursor: grab; transition: all .2s; text-align: center;
}
.classify-item:hover { border-color: var(--cyan); }
.classify-item.placed { opacity: .3; pointer-events: none; }
.classify-cats { flex: 1; }
.classify-cat {
  border: 1px dashed var(--border); padding: 6px; min-height: 40px; margin-bottom: 4px;
  font-size: 16px;
}
.classify-cat .cat-label { display: block; color: var(--dim); margin-bottom: 4px; font-size: 16px; }
.classify-cat .placed-item {
  display: inline-block; padding: 2px 6px; margin: 2px; border: 1px solid var(--green);
  font-size: 16px; background: rgba(0,230,118,.05);
}

/* ===== Notifications ===== */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  padding: 8px 16px; font-size: 16px; font-weight: bold;
  opacity: 0; transition: opacity .3s; pointer-events: none;
  z-index: 200;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--green); color: #000; }
.toast.info { background: var(--cyan); color: #000; }
.toast.error { background: var(--red); color: #000; }

/* ===== Level Up ===== */
.level-up-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.8); z-index: 150;
  align-items: center; justify-content: center;
}
.level-up-overlay.show { display: flex; }
.level-up-box {
  text-align: center; animation: levelUpAnim .5s ease-out;
}
.level-up-box .big-rank { font-size: 48px; color: var(--amber); font-weight: bold; }
.level-up-box .big-label { font-size: 16px; color: var(--dim); margin-top: 8px; }
@keyframes levelUpAnim {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== Director Dialogue ===== */
.director-box {
  display: flex; gap: 12px; padding: 12px; background: #0e0e16;
  border: 1px solid var(--border); margin-bottom: 14px;
  align-items: flex-start;
}
.director-portrait {
  font-size: 36px; line-height: 1; flex-shrink: 0;
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  background: #1a1a24; border-radius: 4px;
}
.director-bubble { flex: 1; min-width: 0; }
.director-name { font-size: 16px; color: var(--amber); margin-bottom: 2px; }
.director-text { font-size: 15px; line-height: 1.6; color: var(--text); }
.director-text .cursor-blink {
  display: inline-block; width: 4px; height: 14px;
  background: var(--amber); animation: blink 1s step-end infinite;
  vertical-align: text-bottom; margin-left: 1px;
}

/* ===== Shake ===== */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 50%, 90% { transform: translateX(-4px); }
  30%, 70% { transform: translateX(4px); }
}

/* ===== Glow ===== */
.glow-correct {
  animation: glowPulse 0.6s ease-out;
}
@keyframes glowPulse {
  0% { box-shadow: 0 0 0 0 rgba(0,230,118,0); }
  50% { box-shadow: 0 0 20px 4px rgba(0,230,118,0.4); }
  100% { box-shadow: 0 0 0 0 rgba(0,230,118,0); }
}

/* ===== Enhanced Terminal ===== */
.term-root { background: #050508; border: 1px solid #1a1a24; font-family: 'Courier New', monospace; }
.term-root .term-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px; background: #0a0a10; border-bottom: 1px solid #1a1a24;
  font-size: 16px; color: #505060;
}
.term-root .term-dots { display: flex; gap: 4px; }
.term-root .term-dot { width: 8px; height: 8px; border-radius: 50%; }
.term-root .term-dot.red { background: #ff5555; }
.term-root .term-dot.yellow { background: #ffb000; }
.term-root .term-dot.green { background: #00e676; }
.term-root .term-body {
  padding: 12px; min-height: 100px; max-height: 260px; overflow-y: auto;
  background: #050508;
}
.term-root .term-line { white-space: pre-wrap; word-break: break-all; line-height: 1.5; font-size: 16px; }
.term-root .term-prompt { color: var(--green); }
.term-root .term-cmd { color: #d0d0d8; }
.term-root .term-out { color: #808088; }
.term-root .term-success { color: var(--green); }
.term-root .term-error { color: var(--red); }
.term-root .term-info { color: var(--cyan); }
.term-root .term-warn { color: var(--amber); }
.term-root .term-cursor-blink {
  display: inline-block; width: 6px; height: 14px;
  background: var(--green); animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
}
.term-root .term-input-row {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  background: #08080c; border-top: 1px solid #1a1a24;
}
.term-root .term-input-row .prompt { color: var(--green); font-size: 16px; flex-shrink: 0; }
.term-root .term-input-row input {
  flex: 1; background: transparent; border: none; color: var(--text);
  font-family: inherit; font-size: 16px; padding: 4px 0; outline: none;
  caret-color: var(--green);
}
.term-root .term-input-row input:focus { outline: none; }
.term-task-title {
  padding: 8px 12px; background: rgba(255,176,0,.08);
  border-bottom: 1px solid var(--border);
  color: var(--amber); font-size: 14px; line-height: 1.5;
}

/* ===== Scanline overlay ===== */
.scanlines {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* ===== Boss HP Bar ===== */
.boss-hp-wrap { margin: 10px 0; }
.boss-hp-bg { height: 20px; background: #1a1a24; border: 1px solid var(--border); position: relative; overflow: hidden; }
.boss-hp-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--orange)); transition: width .5s; }
.boss-hp-label { position: absolute; top: 0; left: 0; right: 0; text-align: center; line-height: 20px; font-size: 16px; color: #fff; font-weight: bold; }

/* ===== Director Mood System ===== */
.director-box { transition: transform .2s, box-shadow .2s; }
.director-mood-proud .director-portrait { transform: scale(1.1); filter: drop-shadow(0 0 8px #0f0); }
.director-mood-stern .director-portrait { transform: scale(1.05); filter: drop-shadow(0 0 8px #f40); animation: stern-shake 0.5s ease; }
@keyframes stern-shake { 0%,100%{transform:translateX(0) scale(1.05)} 25%{transform:translateX(-3px) scale(1.05)} 75%{transform:translateX(3px) scale(1.05)} }
.director-mood-awkward .director-portrait { filter: grayscale(0.3) sepia(0.2); opacity: 0.9; }
.director-mood-thinking .director-portrait { animation: thinking-bounce 1.5s infinite; }
@keyframes thinking-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
.director-mood-line { white-space: pre-wrap; }

/* ===== Leaderboard / Achievements ===== */
.btn-icon { background: none; border: 1px solid var(--border); color: var(--dim); padding: 3px 8px; font-family: inherit; font-size: 16px; cursor: pointer; }
.btn-icon:hover { border-color: var(--amber); color: var(--amber); }
.ach-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 12px; border: 1px dashed var(--border); background: rgba(0,0,0,.25); margin-bottom: 12px; cursor: pointer; border-radius: 6px; }
.ach-bar:hover { border-color: var(--amber); }
.ach-bar-label { font-size: 15px; color: var(--dim); margin-right: 4px; }
.ach-bar-emoji { font-size: 18px; }
.lb-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.72); z-index: 9000; display: none; align-items: center; justify-content: center; }
.lb-overlay.show { display: flex; }
.lb-box { background: #12121a; border: 2px solid var(--border); border-radius: 10px; width: 660px; max-width: 94vw; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 60px rgba(0,188,212,.15); }
.lb-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 0 12px; }
.lb-tab { background: none; border: none; color: var(--dim); font-family: inherit; font-size: 17px; padding: 14px 18px; cursor: pointer; border-bottom: 2px solid transparent; }
.lb-tab.active { color: var(--amber); border-bottom-color: var(--amber); font-weight: bold; }
.lb-close { margin-left: auto; background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; padding: 10px 12px; }
.lb-close:hover { color: var(--red); }
.lb-body { overflow-y: auto; padding: 16px; }
.lb-summary { display: flex; gap: 28px; justify-content: center; padding: 10px; background: rgba(0,188,212,.06); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; font-size: 15px; color: var(--text); }
.lb-summary b { color: var(--amber); }
.lb-list { display: flex; flex-direction: column; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: rgba(0,0,0,.2); }
.lb-row.me { border-color: var(--amber); background: rgba(255,176,0,.08); }
.lb-no { width: 28px; text-align: center; font-weight: bold; color: var(--dim); }
.lb-row.me .lb-no { color: var(--amber); }
.lb-name { flex: 1; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pioneer { font-size: 14px; }
.lb-rank { width: 96px; font-size: 14px; color: var(--dim); }
.lb-xp { width: 92px; text-align: right; font-size: 15px; color: var(--green); font-weight: bold; }
.lb-bar { flex: 1; min-width: 110px; height: 9px; background: #1a1a24; border-radius: 4px; overflow: hidden; position: relative; }
.lb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); }
.lb-bar span { position: absolute; right: 4px; top: -5px; font-size: 12px; color: var(--dim); }
.lb-pioneers { margin-top: 16px; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; font-size: 14px; }
.lb-pioneers-title { color: var(--amber); font-weight: bold; margin-bottom: 8px; }
.lb-pioneer-line { padding: 2px 0; color: var(--text); }
.ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ach-cell { border: 1px solid var(--border); border-radius: 8px; padding: 12px 8px; text-align: center; background: rgba(0,0,0,.2); opacity: .45; }
.ach-cell.got { opacity: 1; border-color: rgba(255,176,0,.4); background: rgba(255,176,0,.06); }
.ach-cell.can { opacity: .85; }
.ach-emoji { font-size: 30px; }
.ach-name { font-size: 14px; font-weight: bold; margin-top: 6px; color: var(--text); }
.ach-desc { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
.ach-tag { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--green); border: 1px solid var(--green); border-radius: 3px; padding: 1px 6px; }
.ach-tag.can { color: var(--amber); border-color: var(--amber); }
@keyframes achPop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
.lb-empty { text-align: center; color: var(--dim); padding: 30px; }

/* ===== Password Modal ===== */
.pw-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.72); z-index: 9100; display: none; align-items: center; justify-content: center; }
.pw-overlay.show { display: flex; }
.pw-box { background: #12121a; border: 2px solid var(--border); border-radius: 10px; width: 400px; max-width: 92vw; overflow: hidden; box-shadow: 0 0 60px rgba(0,188,212,.15); }
.pw-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.pw-title { font-size: 18px; color: var(--amber); font-weight: bold; }
.pw-body { padding: 20px; }
.pw-field { margin-bottom: 14px; }
.pw-field label { display: block; font-size: 15px; color: var(--dim); margin-bottom: 6px; }
.pw-field input { width: 100%; padding: 9px 12px; background: #000; border: 1px solid var(--border); color: var(--green); font-family: inherit; font-size: 17px; outline: none; }
.pw-field input:focus { border-color: var(--amber); }
.pw-err { color: var(--red); font-size: 15px; min-height: 18px; margin-bottom: 8px; }

/* ===== Mini Game: Memory Match ===== */
.mm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.8); z-index: 9500; display: flex; align-items: center; justify-content: center; }
.mm-box { background: #12121a; border: 2px solid var(--border); border-radius: 12px; width: min(780px, 94vw); max-height: 92vh; display: flex; flex-direction: column; padding: 18px; box-shadow: 0 0 60px rgba(0,188,212,.15); overflow: hidden; }
.mm-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.mm-title { font-size: 20px; color: var(--amber); font-weight: bold; }
.mm-sub { font-size: 13px; color: var(--dim); margin-top: 4px; }
.mm-close { cursor: pointer; color: var(--dim); font-size: 20px; padding: 0 4px; }
.mm-close:hover { color: var(--red); }
.mm-stats { display: flex; gap: 20px; font-size: 15px; color: var(--text); margin-bottom: 14px; }
.mm-stats b { color: var(--amber); }
.mm-grid { display: grid; gap: 10px; overflow-y: auto; }
.mm-card { perspective: 800px; cursor: pointer; aspect-ratio: 1; }
.mm-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .35s ease; }
.mm-card.flipped .mm-inner { transform: rotateY(180deg); }
.mm-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border); background: #1a1a26; overflow: hidden; }
.mm-back { font-size: 24px; color: var(--dim); }
.mm-front { transform: rotateY(180deg); background: #0f2233; border-color: var(--cyan); }
.mm-emoji { font-size: 20px; }
.mm-text { font-size: 12px; color: var(--text); text-align: center; padding: 0 4px; line-height: 1.25; word-break: break-word; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mm-card.matched .mm-inner { transform: rotateY(180deg); }
.mm-card.matched .mm-front { border-color: var(--green); background: rgba(0,230,118,.12); box-shadow: 0 0 14px rgba(0,230,118,.4); animation: mmGlow .6s ease; }
.mm-card.wrong .mm-inner { transform: rotateY(180deg); }
.mm-card.wrong .mm-front { border-color: var(--red); background: rgba(255,85,85,.12); animation: mmShake .4s ease; }
@keyframes mmShake { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-4px); } 75% { transform: rotateY(180deg) translateX(4px); } }
@keyframes mmGlow { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.06); } 100% { transform: rotateY(180deg) scale(1); } }
.mm-card.celebrate .mm-front { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,176,0,.6); }
.mm-foot { margin-top: 14px; font-size: 13px; color: var(--dim); text-align: center; }
.mm-stack { position: relative; min-height: 360px; }
.mm-stack-level { position: absolute; inset: 0; opacity: 0; transform: translateY(18px) scale(.96); pointer-events: none; transition: opacity .45s ease, transform .45s ease; }
.mm-stack-level.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; z-index: 2; }
.mm-stack-level.leaving { opacity: 0; transform: translateY(26px) scale(.9); pointer-events: none; z-index: 1; }
.mm-stack-grid { display: grid; gap: 10px; }
.mm-result { text-align: center; padding: 26px 10px 10px; }
.mm-result .big { font-size: 52px; }
.mm-result .xp { font-size: 26px; color: var(--green); font-weight: bold; margin: 10px 0 4px; }
.mm-result .note { font-size: 12px; color: var(--dim); }
.mm-btn { padding: 9px 22px; background: #2a2a3a; border: none; color: var(--text); border-radius: 4px; font-size: 15px; cursor: pointer; font-family: inherit; }
.mm-btn:hover { background: #3a3a4a; }
.mm-btn.primary { background: var(--amber); color: #000; font-weight: bold; }
.mm-btn.primary:hover { background: #ffc030; }
.bonus-entry { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 12px 16px; border: 1px dashed var(--border); border-radius: 8px; cursor: pointer; background: rgba(0,0,0,.2); transition: all .2s; }
.bonus-entry:hover { border-color: var(--amber); background: rgba(255,176,0,.06); }
.bonus-title { font-size: 16px; color: var(--amber); font-weight: bold; }
.bonus-sub { font-size: 13px; color: var(--dim); margin-top: 4px; }
.bonus-go { font-size: 14px; color: var(--green); }
.review-panel { margin-top: 16px; border: 1px dashed var(--border); border-radius: 8px; padding: 12px; background: rgba(0,0,0,.15); }
.review-title { font-size: 15px; color: var(--amber); font-weight: bold; margin-bottom: 10px; }
.review-title .review-sub { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 6px; }
.review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.review-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; background: rgba(0,0,0,.2); transition: all .2s; }
.review-card.locked { opacity: .5; cursor: not-allowed; }
.review-card.unlocked:hover { border-color: var(--amber); background: rgba(255,176,0,.08); transform: translateY(-1px); }
.review-emoji { font-size: 24px; }
.review-name { font-size: 13px; font-weight: bold; margin-top: 6px; color: var(--text); }
.review-meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
@media (max-width: 560px) { .review-grid { grid-template-columns: repeat(2, 1fr); } }
.review-inline { display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin-top: 2px; border: 1px dashed var(--border); border-radius: 6px; cursor: pointer; background: rgba(0,0,0,.18); }
.review-inline.unlocked:hover { border-color: var(--amber); background: rgba(255,176,0,.08); }
.review-inline.locked { opacity: .55; cursor: not-allowed; }
.review-inline .ri-emoji { font-size: 18px; }
.review-inline .ri-name { flex: 1; font-size: 15px; font-weight: bold; color: var(--text); }
.review-inline .ri-meta { font-size: 12px; color: var(--dim); }
.review-inline.review-bonus { border-color: rgba(255,176,0,.35); background: rgba(255,176,0,.05); }
.review-inline.review-bonus.unlocked { border-color: var(--amber); }
.task-ops { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
.task-redo, .task-undo { cursor: pointer; font-size: 15px; padding: 2px 5px; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); }
.task-redo:hover { color: var(--green); border-color: var(--green); }
.task-undo:hover { color: var(--red); border-color: var(--red); }
.task-half { color: var(--amber); cursor: default; margin-left: 4px; flex-shrink: 0; }
/* ===== Quick Match (产线快打) ===== */
.qk-box { width: min(680px, 94vw); }
.qk-stats { display: flex; gap: 18px; font-size: 15px; color: var(--text); margin-bottom: 14px; }
.qk-stats b { color: var(--amber); }
.qk-terminal { border: 1px solid var(--border); border-radius: 8px; background: #000; margin-bottom: 14px; overflow: hidden; }
.qk-term-head { padding: 8px 12px; background: #1a1a26; color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--border); }
.qk-term-body { padding: 18px 14px; min-height: 70px; }
.qk-q { font-size: 17px; color: var(--green); line-height: 1.6; }
.qk-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.qk-btn { padding: 12px; background: #1a1a26; border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 6px; transition: all .15s; }
.qk-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.qk-btn.wrong { border-color: var(--red); color: var(--red); background: rgba(255,85,85,.1); }
.qk-msg { min-height: 24px; margin-top: 12px; font-size: 14px; text-align: center; }
.qk-ok { color: var(--green); }
.qk-err { color: var(--red); }
@media (max-width: 560px) { .qk-stats { gap: 12px; font-size: 13px; } .qk-q { font-size: 15px; } .qk-btn { font-size: 14px; padding: 10px; } }

/* ===== Term Pedia (图鉴) ===== */
.pd-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.72); z-index: 9150; display: none; align-items: center; justify-content: center; }
.pd-overlay.show { display: flex; }
.pd-box { background: #12121a; border: 2px solid var(--border); border-radius: 10px; width: 760px; max-width: 94vw; max-height: 84vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 60px rgba(0,188,212,.15); }
.pd-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.pd-title { font-size: 18px; color: var(--amber); font-weight: bold; }
.pd-sub { font-size: 13px; color: var(--dim); margin-top: 4px; }
.pd-body { overflow-y: auto; padding: 16px; }
.pd-full { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1px solid var(--green); border-radius: 8px; background: rgba(0,230,118,.08); color: var(--green); font-weight: bold; margin-bottom: 14px; font-size: 15px; }
.pd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pd-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: rgba(0,0,0,.2); overflow: hidden; }
.pd-card.locked { opacity: .45; text-align: center; }
.pd-emoji { font-size: 26px; }
.pd-term { font-size: 16px; font-weight: bold; margin-top: 6px; color: var(--text); }
.pd-hint { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.5; word-break: break-word; }
.pd-cmd { margin-top: 8px; padding: 6px 8px; background: #000; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--green); font-family: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pd-cat { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--cyan); border: 1px solid rgba(0,188,212,.4); border-radius: 3px; padding: 1px 6px; }

/* ===== Mobile adaptation ===== */
@media (max-width: 560px) {
  .mm-box { padding: 12px; }
  .mm-grid, .mm-stack-grid { gap: 6px; }
  .mm-stats { gap: 12px; font-size: 13px; margin-bottom: 10px; }
  .mm-emoji { font-size: 15px; }
  .mm-text { font-size: 10px; }
  .mm-title { font-size: 17px; }
  .mm-sub { font-size: 12px; }
  .mm-stack { min-height: 300px; }
  .pd-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pd-card { padding: 10px; }
  .pd-emoji { font-size: 22px; }
  .pd-term { font-size: 14px; }
  .pd-hint { font-size: 11px; }
  .pd-cmd { font-size: 11px; }
  .lb-box { max-height: 90vh; }
}

<body>
<!-- Header -->
<div class="header">
  <div class="h-left">
    <span class="logo">⚙</span>
    <span class="title" id="playerDisplay">—</span>
    <span class="rank-badge" id="rankDisplay">实习生</span>
  </div>
  <div class="h-right">
    <div class="xp-wrap"><div class="xp-fill" id="xpFill"></div><span class="xp-label" id="xpLabel">0</span></div>
    <button class="btn-icon" onclick="openLeaderboard()" title="班级排行榜">🏆</button>
    <button class="btn-icon" onclick="openAchievements()" title="我的成就">🎖️</button>
    <button class="btn-icon" onclick="openPasswordModal()" title="设置/修改密码" id="passwordBtn" style="display:none">🔑</button>
    <button class="btn-icon" onclick="openPedia()" title="术语图鉴">📖</button>

  </div>
</div>

<!-- Factory View -->
<div class="factory-wrap">
  <div class="ach-bar" id="achBar" onclick="openAchievements()"></div>
  <div class="factory-rows" id="factoryContainer"></div>
</div>

<!-- Mission Panel -->
<div class="mission-wrap">
  <div class="mission-header">
    <div>
      <div class="mission-title" id="missionTitle">选择关卡开始</div>
      <div class="task-progress" id="taskProgress"></div>
    </div>
  </div>
  <div class="mission-story" id="missionStory" style="display:none"></div>
  <ul class="task-list" id="taskList"></ul>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">任务</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>

// =========================================================================
// 2a. AUDIO SYSTEM (Web Audio API, no external files)
// =========================================================================
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    switch (type) {
      case 'success': {
        [523, 659, 784].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.2, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
          o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.2);
        });
        break;
      }
      case 'error': {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(180, now);
        o.frequency.linearRampToValueAtTime(80, now + 0.25);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        o.start(now); o.stop(now + 0.3);
        break;
      }
      case 'click': {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(900, now);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        o.start(now); o.stop(now + 0.04);
        break;
      }
      case 'type': {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(400 + Math.random() * 300, now);
        g.gain.setValueAtTime(0.03, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
        o.start(now); o.stop(now + 0.03);
        break;
      }
      case 'levelup': {
        [523, 659, 784, 1047].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + i * 0.12);
          g.gain.setValueAtTime(0.25, now + i * 0.12);
          g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
          o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.4);
        });
        break;
      }
      case 'boot': {
        // rapid boot sequence sounds
        for (let i = 0; i < 8; i++) {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'square';
          o.frequency.setValueAtTime(100 + i * 30, now + i * 0.05);
          g.gain.setValueAtTime(0.02, now + i * 0.05);
          g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.04);
          o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.04);
        }
        break;
      }
    }
  } catch(e) { /* audio not critical */ }
}

// =========================================================================
// 2b. TYPEWRITER EFFECT
// =========================================================================
function typewrite(el, text, speed, cb) {
  let idx = 0;
  el.textContent = '';
  function frame() {
    const end = Math.min(idx + 2, text.length);
    while (idx < end) {
      el.textContent += text[idx];
      if (text[idx] !== ' ') playSound('type');
      idx++;
    }
    if (idx < text.length) {
      setTimeout(frame, speed || 30);
    } else {
      if (cb) cb();
    }
  }
  frame();
}

  const explains = {
    '1-1': 'Ubuntu Server 不装图形界面，这不代表操作受限——你可以坐在服务器前接显示器键盘敲命令，也可以在另一台电脑甚至手机上用 SSH 远程登录。工控工程师经常晚上躺床上拿手机查服务器日志——跟你在 War3 地图上操作英雄没什么区别，只不过这次你的英雄是一台 Linux。记住 Shell 是 bash，装软件用 apt install，这些都是你后面每天都要用的基本操作。',
    '1-2': '输入 uname -a 查看系统完整信息。先记住 Linux 命令的**通用格式**：`命令名 [选项] [参数]`，各部分用空格隔开。比如 uname -a：uname 是命令名，-a 是选项（显示全部信息）。选项以 - 开头，可以有好几个、还能合并写（-la = -l -a）；长选项用两个短横（如 --help）。记住这个套路，后面所有命令都是它。',
    '1-3': '想搞清楚"我这台电脑在网络里是什么身份"，就用 ip addr。先补个基础：计算机里最小的信息单位叫"比特（bit）"，一个比特只能是 0 或 1。ip addr 的输出里你会看到三样东西：网卡（设备上网的接口，比如 ens33）、IP 地址（这台设备的门牌号，比如 192.168.1.100）、MAC 地址（出厂就烧录好的"身份证"，一个网卡一个号）。记住这三个，后面翻牌、排障都靠它们。',
    '1-4': 'IP 地址和子网掩码是成对出现的。先说最基础的概念：信息的最小单位叫"比特"（bit），一个比特只能是 0 或 1，8 个比特 = 1 字节。一个 IPv4 地址（如 192.168.1.100）一共 32 个比特，分成 4 组数字。那怎么区分"哪些位是网络号、哪些位是主机号"？靠子网掩码——它用 32 个比特里前面连续的 1 划出网络号（一个网段共有的部分），后面 0 划出主机号（区分网段内每台设备）。255.255.255.0 就是 24 个 1 接 8 个 0，简写为 /24（这叫 CIDR 记法）。一个 /24 子网有 256 个地址，去掉网络地址和广播地址，实际可用 254 台。再记两个词：IPv4 总共只有约 43 亿个地址，早就分完，所以有了更长的 IPv6；NAT 则是让厂里很多设备共用一个公网 IP 上网的翻译官。',
    '1-5': 'OSI 七层模型从下到上：物理层（网线）、数据链路层（MAC/交换机）、网络层（IP/路由）、传输层（TCP 可靠/UDP 快速）、会话层、表示层、应用层（HTTP）。传输层两个协议记清楚：TCP 先握手再传、不丢包，适合文件传输；UDP 发出去就不管、快但有风险，视频通话和传感器高频数据常用它。理解了七层，你就能准确定位网络问题出在哪一层。',
    '1-6': '0.0.0.0 是设备出厂状态——网卡还没有被分配有效的 IP 地址。这就好比新员工还没领工牌，别人不知道你叫啥号。拿到有效 IP 之前，设备对外通信全是这个占位状态。',

    '4-5': 'OpenPLC 是一个开源软 PLC，可以在普通电脑上运行 PLC 程序。和硬 PLC 相比，它成本低、灵活高，适合学习和原型验证。编译安装后通过浏览器访问 Web 界面进行编程。',
    '4-6': '软PLC用软件模拟所有PLC功能，成本低可定制，比硬PLC灵活太多。但硬PLC有独立电路和硬实时OS，带有严格安全认证——出了故障不会因为软件崩掉反应不过来。在生命安全的场景下必须靠哪个？',
    '4-hidden': '全量数据每分钟约 60 条，筛选后每分钟约 9 条。运行 2 分钟，全量约 120 条，筛选后约 18 条。这就是边缘计算的威力——少传数据，不丢信息。',
    '5-0': 'Docker 是当前最流行的容器化技术。它把应用和依赖打包成一个标准单元，在任何 Linux 系统上都能一键运行。装 Docker 很简单，官方提供一键安装脚本。',
    '5-1': 'docker run hello-world 是 Docker 的入门命令。它会从 Docker Hub 下载 hello-world 镜像，创建容器并运行。看到 Hello from Docker 的欢迎信息，就说明 Docker 安装成功了。',
    '5-2': 'docker run -d --name mynginx -p 8080:80 nginx 命令用 Nginx 镜像启动一个 Web 服务器。-d 后台运行，--name 指定容器名，-p 8080:80 把主机的 8080 端口映射到容器的 80 端口。',
    '5-3': 'Docker 常用命令不多：docker ps 看运行中的容器，docker stop 停掉容器，docker rm 删除容器，docker pull 下载镜像。记住这四个就能上手了。',
    '5-4': '用 Docker 运行 Node-RED 可以避免与原生版本的端口冲突。Docker 版的 Node-RED 使用 1881 端口（区别于原生的 1880），这样两个版本可以同时运行对比。',
    '5-5': 'Docker 和虚拟机的核心区别：Docker 共享宿主机内核（轻量），虚拟机有独立内核（重量）。所以 Docker 启动秒级、磁盘 MB 级；虚拟机启动分钟级、磁盘 GB 级。',
    '5-6': 'Docker 容器删了就全没了——这是设计哲学不是bug。想让数据活过容器生命周期，得用Docker提供的数据卷挂载——宿主机上留一块独立区域，容器重启数据还在。',
    '5-hidden': '同时运行原生 Node-RED 和 Docker 版 Node-RED，对比它们的安装方式、隔离性、数据持久化。这是理解 Docker 价值的最佳实践。',
    '6-0': 'Node-RED Dashboard 是一个插件，在 Node-RED 的节点管理面板中搜索安装即可。装好后你会看到 ui 开头的 Dashboard 节点——Gauge（仪表盘）、Chart（趋势图）、Notification（报警通知）等。',
    '6-1': '工控大屏的三条黄金原则：一目了然（操作员 3 秒读懂当前状态）、重点突出（只显示关键指标，不堆砌数据）、可操作（发现报警后能直接操作，不是只能看）。',
    '6-2': 'Dashboard 的层级结构：Tab（页面标签）→ Group（卡片组）→ Widget（仪表盘组件）。一个 Tab 可以包含多个 Group，一个 Group 可以包含多个 Widget。',
    '6-3': 'Gauge 仪表盘的颜色分段用来表示状态：绿色=正常，黄色=预警，红色=报警。配置阈值后，指针指到不同区域会自动变色，操作员一眼就能看出设备状态。',
    '6-4': 'Chart 趋势图可以显示多条曲线。用 topic 字段来区分不同的数据源——温度数据设置 topic 为 "温度"，振动数据设置 topic 为 "振动"，图表会自动用不同颜色绘制两条曲线。',
    '6-5': 'Notification 不弹窗？先查 Switch 阈值有没有触发——数据值 85℃ 超过阈值 80℃，应该触发。触发了还没弹窗？查 Notification 节点的 level 级别，可能级别太低被忽略了。',
    '6-6': '工控看板设计有三个原则：看一眼就知道情况、只展示重要信息、点一下能做动作。这三条相辅相成，没有哪个次要——缺少任意一条看板就不好用了。',
    '6-hidden': '三屏联动是指把温度、振动、报警三个维度的数据显示在同一个 Dashboard 上。当温度异常时振动往往也会变化，三屏同时展示能让操作员看到数据的关联性。',
    '7-0': 'Mosquitto 是开源的 MQTT Broker（消息代理），负责接收和转发设备消息。在 Ubuntu 上 apt install mosquitto 就能安装。MQTT 是工业物联网中最主流的消息协议。',
    '7-1': 'mosquitto_sub 是 MQTT 的订阅命令。mosquitto_sub -h localhost -t factory/temp 订阅本地 Broker 上 factory/temp 主题的消息。有设备发布消息到这个主题，你这里就会收到。',
    '7-2': 'MQTT 主题支持通配符：+ 匹配一级（factory/+/temp 匹配任意车间温度），# 匹配多层（factory/# 匹配 factory 下所有主题）。精确主题如 factory/workshop1/temp 只匹配特定设备。',
    '7-3': '工业大数据有 4V 特征：Velocity（速度快——每秒上千采样）、Volume（数据量大——每天 500GB）、Variety（类型多——波形/频谱/图像混合）、Value（价值密度低——大量数据中只有少量有价值信号）。',
    '7-4': '完整 MQTT 链路：传感器模拟(Inject+Function) 产生数据 → MQTT 发布节点 发到 Broker → Mosquitto Broker 中转 → MQTT 订阅节点 接收 → Dashboard 显示。数据从设备到屏幕的完整旅程。',
    '7-5': 'MQTT 订阅者离线期间 Broker 不会攒数据等它回来——中间这段丢了就丢了，这是发布订阅模式天生特性。除非把 Broker 配置为持久会话。',
    '7-6': 'Modbus 是主站发问从站回答，一问一答不能乱；MQTT 是发布者-订阅者模式，设备数据发到Broker所有订阅者同时收。工控几十台设备轮询 vs 工业级上千台设备组网，选哪个？',
    '7-hidden': 'LWT（Last Will Testament，遗嘱消息）是 MQTT 的特性。设备离线时 Broker 代它发一条消息通知其他设备「我离线了」。在工业场景中，及时发现设备掉线至关重要。',
    '8-0': 'AI 编程工具正在改变工业软件开发方式。选择一款合适的 AI 工具（如 GitHub Copilot 或通义灵码），能帮你自动生成代码、解释报错、优化算法。',
    '8-1': '5G 的三大工业场景：eMBB（增强移动宽带——适合高清视频质检）、uRLLC（超低时延高可靠——适合远程控制起重机）、mMTC（海量机器通信——适合上千个传感器同时上报）。',
    '8-2': '工业 AI 的三种形态：视觉检测（用摄像头识别产品缺陷）、预测性维护（从振动数据预测轴承剩余寿命）、过程优化（通过数据分析找到最优工艺参数）。',
    '8-3': '数字孪生三级进化：以虚映实（镜像映射——实时同步设备数据）、以虚控实（远程控制——在数字世界操纵物理设备）、以虚优实（优化仿真——用 AI 模拟找出最优方案）。',
    '8-4': 'MQTT 代码常见错误：connect 成功后要处理 error 事件和 close 事件，否则连接异常断开时程序会崩溃。代码里只监听了 connect 事件，没有错误处理，这是生产环境的大忌。',
    '8-5': 'AI 预测置信度 65%——不算高但也不算低。立即停机损失 50 万，赌错了是误判；不停机可能损失 500 万，赌对了省一笔。降负荷运行 24 小时再观察是折中的合理选择。',
    '8-6': 'AI 在工厂里能做分析预警建议，但最终拍板环节必须有人。不只是安全，还有合规——工厂出事故第一责任人是工程师。AI 给你建议你来做决定，这才是工业 AI 的正确打开方式。',
    '8-hidden': '同学抄了你的代码，你怎么处理？直接举报伤害关系，默不作声纵容错误，说是一起合作不诚实。私下跟同学说这样不对，既坚持了原则又给对方留了改过的机会。',
    '2-7': '输入 ssh student@192.168.1.100。格式：ssh 用户名@IP。第一次连接会提示确认指纹——输入 yes，然后回车继续。远程登录的具体操作。',
    '2-8': 'SSH 免密登录用非对称加密——私钥存客户端，公钥存服务器。客户端的公钥就放在服务器的 ~/.ssh/authorized_keys 这个文件里（一行一个公钥）。连接时服务器读出 authorized_keys 验证你的身份，两边匹配就直接放行。要让某台机器免密登进来，就把那台机器的公钥追加进这个文件。',
    '3-7': 'Modbus TCP 读取数据用 modbus read 命令，参数依次是 IP 地址、端口号、寄存器地址。Holding Register 是最常用的寄存器类型，存储传感器当前值。',
    '3-8': 'ISA-95 标准的 L3 执行层（MES）负责生产调度与执行——安排生产计划、跟踪工单进度、管理物料。L2 监控层（SCADA）负责实时监控，L4 管理层（ERP）负责企业资源规划。',
    '4-7': 'systemctl 是 Linux 管理服务的命令。systemctl status edge-service 查看边缘服务的运行状态——是否 active、运行了多久、占多少内存。排查服务问题时第一个就用它。',
    '4-8': '数据在设备旁边直接算叫边缘计算，几百公里外算叫云计算。前者延迟低响应快，后者算力强存量大。哪些任务等不起几毫秒延迟，必须就地处理？',
    '5-7': 'docker ps 查看正在运行的容器列表。显示容器 ID、使用的镜像、启动命令、创建时间、状态、端口映射、容器名。docker ps -a 还能看到已经停止的容器。',
    '5-8': 'Docker 网络模式有几种：none 无网，host 共用宿主共享IP，bridge 每个容器通过虚拟网桥独立通信。不带任何参数跑起来，默认就是其中一种——隔离性刚刚好的那种。',
    '6-7': 'curl 可以获取网页源码。curl -s http://localhost:1880/ui/dashboard 获取 Dashboard 页面的 HTML，通过管道 | head -20 只显示前 20 行，快速确认服务是否在运行。',
    '6-8': '常规的仪表盘每隔几秒刷新一次页面，过程中数据空洞。Node-RED 用 WebSocket 技术，服务端一有变化立刻主动推送到浏览器，数据是连续流动的。',
    '7-7': 'mosquitto_pub 是 MQTT 发布命令。mosquitto_pub -h localhost -t factory/temp -m 75.3 向本地 Broker 的 factory/temp 主题发布温度 75.3。订阅了这个主题的客户端会立即收到。',
    '7-8': 'MQTT 有 3 级服务质量：QoS 0 发一次拉倒（可能丢），QoS 1 至少发一次（可能重复），QoS 2 保证到达且只到达一次。核心区别在于对待丢包和重复的处理策略。',
    '8-7': 'AI 模型通过 REST API 提供推理服务。用 curl 发送 POST 请求，把传感器数据（振动、温度）以 JSON 格式发给模型，返回预测结果（剩余寿命、置信度）。这是工业 AI 的典型调用方式。',
    '8-8': '数字孪生三级形态：以虚映实（数据镜像同步）、以虚控实（远程操作设备）、以虚优实（AI 仿真优化）。最高级形态是以虚优实——在数字世界中模拟优化，然后把最优方案应用到物理世界。',
    '2-9': 'SSH 连接超时的排障思路：先 ping 看 IP 通不通，通的话检查 22 端口是否开放，不开的话检查 SSH 服务状态，没运行就启动它。端口改了就用 -p 参数。',
    '2-10': 'SSH 端口转发是高级功能：-L 本地转发（把本地端口映射到远程）、-R 远程转发（把远程端口映射到本地）、-D 动态转发（SOCKS 代理）。',
    '2-11': 'SSH 安全加固有三板斧：不要用默认端口、不要用 root 登、不要只用密码。其中有一项直接把安全风险最大的账号关了，最立竿见影。',
    '2-hidden-2': 'SSH 入侵取证三步走：查 /var/log/auth.log 看登录记录、查 authorized_keys 有没有陌生公钥、查 last 看异常登录时间。',
    '3-0': '先讲个故事：远古时人类语言统一，想合力建一座通天塔，上帝变乱了他们的语言，工人各说各话、建不成塔——这就是「巴别塔」，从此成了"语言不通、沟通混乱"的代名词。咱们车间也一样：七种设备至少用着四种协议（FANUC 私有、西门子 ProfiNet、ABB、倍福 EtherCAT、Modbus），各说各话。要解决设备"语言不通"，得靠协议转换网关（配翻译）或通用中间层（OPC UA）。理解了这个，再看 ISA-95 五层地图就更清楚了。',
    '3-1': 'ISA-95 五层从下到上：L0 现场设备层（传感器/执行器，采集数据）、L1 控制层（PLC 做逻辑控制）、L2 监控层（SCADA 看整条产线）、L3 制造运营层（MES 管订单进度）、L4 业务层（ERP 管财务采购）。一句话：设备采集→控制指挥→监控全局→运营订单→业务公司。',
    '3-2': 'Node-RED 是低代码「翻译台」——把设备数据用拖拽节点连成数据流。装它用官方一键脚本（来源要正），Web 界面跑在 1880 端口，要连 Modbus 设备就装 node-red-contrib-modbus 节点包。',
    '3-3': 'ProfiNet 是西门子的工业以太网协议，毫秒级实时。记得那句：紫色线 Profibus 是老款、绿色工业网线 ProfiNet 是新款，都是西门子家的。',
    '3-4': '协议各有个性：ProfiNet=西门子毫秒实时，EtherCAT=倍福快到极致（飞读飞写），CC-Link IE=三菱环形冗余断线不断，Modbus=最老最开放变频仪表都支持，Powerlink=贝加莱标准硬件，EtherNet/IP=罗克韦尔基于以太网。',
    '3-5': 'Modbus 用寄存器组织数据，四种：线圈（1 位可读写，开关状态）、离散输入（1 位只读，限位开关）、保持寄存器（16 位可读写，设定值）、输入寄存器（16 位只读，测量值）。口诀：保持=设定值、输入=测量值、线圈=开关可写、离散=开关只读。',
    '3-6': 'Modbus 通信故障排查按顺序来：网线（ip link）→ ping 从站 IP → 端口（ss -tln，如 8502）→ 从站 ID / 寄存器地址 → 防火墙。一步步排除，别跳步骤。',
    '3-hidden': 'QModMaster 是外部调试工具，直连 Modbus 从站验证读写。连接时填从站的 IP 地址和端口，能读到数据就说明从站和配置都对。',

    '3-9': 'Modbus 通信中断的排障流程：先确认 Server 运行，再检查端口号是否匹配，最后查防火墙有没有阻挡。一步一步来，别跳步骤。',
    '3-10': '工业协议各有千秋：ModbusTCP 简单通用适合大多数场景，ProfiNet 实时性高适合西门子生态，EtherCAT 纳秒级同步适合运动控制。',
    '3-11': 'PLC 梯形图中，两个触点串联代表与逻辑（AND），两个触点并联代表或逻辑（OR）。串联的触点必须全部接通才有输出。',
    '4-9': '网络流量突然飙升通常是某个设备异常导致。先定位哪个设备的数据量异常，然后分析原因——可能是采样频率配置错误，也可能是设备故障产生噪音数据。',
    '4-10': '边缘计算的三层架构：感知层负责数据采集，计算层负责本地处理，网络层负责上传结果到云端。每层各司其职、协同工作。',
    '4-11': '报警阈值设置的原则：正常范围下限到 80% 左右设预警，超过上限设报警。温度范围 0-80℃，65℃ 预警提示关注，80℃ 报警立即处置。',
    '5-9': 'Docker 容器集体宕机的处理流程：先查 Docker 守护进程，再查资源占用，清理不用的容器和镜像释放空间。docker system prune 一键清理。',
    '5-10': 'Docker Compose 用 YAML 文件定义多个容器的启动配置，默认文件名为 docker-compose.yml。一条 docker-compose up 就能启动整个服务栈。',
    '5-11': '减小镜像体积最常规的办法——把基础层换成 Alpine。Alpine 只有5MB，极致精简。另外编译阶段只保留最终产物，俗称多阶段构建。',
    '6-9': '监控大屏黑屏的排查步骤：先查 Node-RED 是否运行，再看 Flow 是否已部署，然后确认 WebSocket 连接有没有断开。加看门狗确保长期稳定。',
    '6-10': '监控大屏的颜色心理学：红色=危险/报警（紧急处置），黄色=预警/注意（提前干预），绿色=正常/安全（无需操作）。一目了然。',
    '6-11': '多屏联动的架构设计：车间屏实时设备数据（秒级），中控室屏综合概览（分钟级），厂长屏 KPI 报表（小时/天级）。信息分层呈现。',
    '7-9': 'MQTT 消息链路的故障排查：先检查 Broker 是否运行，再检查发布端是否正常，最后用心跳主题监控链路健康。防止消息黑洞。',
    '7-10': 'MQTT 主题命名建议用 / 分隔层级，如 factory/workshop1/temp。第一级厂区、第二级车间、第三级数据类型——清晰可扩展。',
    '7-11': 'MQTT 安全三要素：传输层加密（TLS/SSL 防窃听）、身份认证（用户名+密码防未授权）、消息签名（防数据篡改）。缺一不可。',
    '8-9': 'AI 模型漂移是输入数据分布变化导致准确率下降。解决办法：监控置信度、用新数据增量训练、建立自动重训练 Pipeline。',
    '8-10': 'AI 预测和人工检查矛盾时，降负荷运行+第三方检测最稳妥。不盲目信 AI，也不完全否定——折中策略降低风险。',
    '8-11': '工业元宇宙：AR 远程维修让专家不用到现场，数字孪生仿真投产前验证优化，区块链溯源确保产品全生命周期可追溯。这是工业互联网的终极愿景。'
  };

  if (task.type === 'fill_blank') return `厂长在终端上圈了一个位置：「把这个补齐，别填错了。」`;
  return `厂长把这个任务交给你了。机器不会等——赶紧处理。`;
}

function getRandomMoodLine(mood) {
  var pool = directorMoodLines[mood] || directorMoodLines.neutral;
  return pool[Math.floor(Math.random() * pool.length)];
}

function getDirectorMood(task, context) {
  // context: { streak, errors, hintUsed, firstTime, wrongCmdType }
  if (!context) return 'neutral';
  
  // 优先级：尴尬(输错类型) > 严肃(连续错/用hint还错) > 得意(连胜/0失误) > 思考(初次/请求hint) > 中性
  if (context.wrongCmdType) return 'awkward';
  if (context.errors >= 2 || (context.hintUsed && context.errors >= 1)) return 'stern';
  if (context.streak >= 3 && context.errors === 0) return 'proud';
  if (context.firstTime || context.hintUsed) return 'thinking';
  return 'neutral';
}

async function api(path, options) {
  const headers = {'Content-Type':'application/json','Authorization':'Bearer '+token};
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const r = await fetch(API + path, { signal: controller.signal, headers: { ...headers, ...(options?.headers || {}) }, ...options });
    clearTimeout(timer);
    if (r.status === 401) { sessionStorage.clear(); location.href = 'index.html'; return null; }
    return await r.json();
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') showToast('请求超时', 'error');
    else if (!e.message?.includes('sessionStorage')) showToast('网络请求失败', 'error');
    return null;
  }
}

// 5. COMPUTED
// =========================================================================
function getLevelTasks(levelId) {
  const lv = content.levels.find(l => l.id === levelId);
  return lv ? lv.tasks : [];
}

function taskKey(taskId) {
  return '' + taskId;
}

function isTaskDone(taskId) {
  return !!gameState.check[taskKey(taskId)];
}

function taskXP(task) {
  if (task.hidden) return 300;
  if (task.type === 'quiz' && task.xp <= 50) return 50;
  if (task.xp === 0) return 0;
  return task.xp || 100;
}

function calcTotalXP() {
  if (!content) return 0;
  let xp = 0;
  content.levels.forEach(lv => {
    lv.tasks.forEach(t => {
      const c = gameState.check[taskKey(t.id)];
      if (c) xp += (c && c.half) ? Math.floor(taskXP(t) / 2) : taskXP(t);
    });
  });
  return xp;
}

function getRank(xp) {
  let r = RANKS[0];
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (xp >= RANKS[i].min) { r = RANKS[i]; break; }
  }
  return r;
}

function levelProgress(lvId) {
  const tasks = getLevelTasks(lvId);
  let done = 0, total = 0;
  tasks.forEach(t => {
    if (t.auto) return;
    total++;
    if (isTaskDone(t.id)) done++;
  });
  return { done, total, pct: total ? Math.round(done / total * 100) : 0, completed: done >= total && total > 0 };
}

function areaStars(lvId) {
  const s = gameState.stars[lvId];
  if (!s) return 0;
  return Math.round((s.self * 0.3 + s.peer * 0.3 + s.teacher * 0.4) * 10) / 10;
}

function starStr(v) {
  if (v <= 0) return '';
  const f = Math.floor(v);
  let s = '';
  for (let i = 0; i < f; i++) s += '★';
  for (let i = f; i < 5; i++) s += '☆';
  return s;
}

function renderFactory() {
  if (!content) return;
  const container = document.getElementById('factoryContainer');
  container.innerHTML = '';

  content.factory.rows.forEach((row, ri) => {
    // area row
    const rowDiv = document.createElement('div');
    rowDiv.className = 'factory-row';
    row.areas.forEach(areaKey => {
      const lv = content.levels.find(l => l.factoryArea === areaKey);
      if (!lv) return;
      const prog = levelProgress(lv.id);
      const prevLv = content.levels.find(l => l.id === lv.id - 1);
      const canAccess = lv.id === 1 || (prevLv && levelProgress(prevLv.id).completed);
      let cls = 'area locked';
      if (prog.completed) cls = 'area completed';
      else if (canAccess) cls = 'area active';
      if (lv.id === currentLevelId) cls += ' current';

      const div = document.createElement('div');
      div.className = cls;
      div.style.setProperty('--color', lv.color || '#00bcd4');
      div.onclick = () => selectLevel(lv.id);
      div.innerHTML = `
        <span class="lock-icon">${canAccess || prog.completed ? '' : '🔒'}</span>
        <span class="icon">${lv.areaIcon}</span>
        <span class="a-name">${lv.areaName}</span>
        <span class="a-stars">${starStr(areaStars(lv.id))}</span>
      `;
      rowDiv.appendChild(div);
    });
    container.appendChild(rowDiv);

    // pipe row (between factory rows)
    if (ri < content.factory.rows.length - 1) {
      const pipeDiv = document.createElement('div');
      pipeDiv.className = 'pipe-row';
      for (let i = 0; i < 4; i++) {
        const cell = document.createElement('div');
        cell.className = 'pipe-cell';
        const a1 = row.areas[i];
        const a2 = content.factory.rows[ri + 1].areas[i];
        const lv1 = content.levels.find(l => l.factoryArea === a1);
        const done = lv1 && levelProgress(lv1.id).completed;
        cell.innerHTML = `<div class="h-line ${done ? 'done' : ''}"></div><div class="v-line ${done ? 'done' : ''}"></div><div class="arrow ${done ? 'done' : ''}"></div>`;
        pipeDiv.appendChild(cell);
      }
      container.appendChild(pipeDiv);
    }
  });
}

function selectLevel(lvId) {
  const lv = content.levels.find(l => l.id === lvId);

function renderMission() {
  const lv = content.levels.find(l => l.id === currentLevelId);
  if (!lv) return;

  const title = document.getElementById('missionTitle');
  title.innerHTML = `<span class="lv-tag">L${lv.id}</span> ${lv.name}`;

  const story = document.getElementById('missionStory');
  const prog = levelProgress(lv.id);
  if (!prog.completed) {
    story.style.display = 'block';
    story.textContent = lv.narrative.intro;
    story.style.borderLeftColor = lv.color || '#00bcd4';
    story.style.setProperty('--color', lv.color || '#00bcd4');
  } else if (lv.narrative.complete) {
    story.style.display = 'block';
    story.textContent = '✅ ' + lv.narrative.complete;
    story.style.borderLeftColor = 'var(--green)';
    
    // Check if just completed (was not completed before this render)
    const wasCompleted = sessionStorage.getItem('levelCompleteShown_' + lv.id) === 'true';
    if (!wasCompleted) {
      sessionStorage.setItem('levelCompleteShown_' + lv.id, 'true');
      // Small delay to let UI settle
      setTimeout(() => showLevelComplete(lv), 300);
    }
  } else {
    story.style.display = 'none';
  }

  document.getElementById('taskProgress').textContent = `进度 ${prog.done}/${prog.total}`;

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  // 构建"块最后一个任务 -> 复习翻牌"映射
  const tl = getTermLevel(lv.id);
  const reviewAfter = {};
  if (tl) tl.warmups.forEach(w => {
    const last = w.blockTasks[w.blockTasks.length - 1];
    if (last) {
      if (!reviewAfter[last]) reviewAfter[last] = [];
      reviewAfter[last].push(w);
    }
  });
  lv.tasks.forEach(t => {
    const done = isTaskDone(t.id);
    const _ck = gameState.check[taskKey(t.id)];
    const isHalf = done && _ck && _ck.half;
    const li = document.createElement('li');
    li.className = 'task-item' + (done ? ' done' : '') + (t.auto ? ' auto' : '') + (t.hidden ? ' hidden' : '');
    li.innerHTML = `
      <span class="cb">${done ? '✓' : ''}</span>
      <span class="task-title">${t.title}</span>
      <span class="task-xp">${taskXP(t) > 0 ? '+' + taskXP(t) + 'XP' : ''}</span>
      ${isHalf ? '<span class="task-half" title="经验减半，点任务可重刷拿满分">⚡</span>' : ''}
      ${done ? '<span class="task-ops"><span class="task-redo" title="重做本关拿满分">↻</span><span class="task-undo" title="撤销完成">✕</span></span>' : ''}
      <div class="task-tags">${(t.tags || []).map(tagId => {
        const tag = window.KNOWLEDGE_TAGS?.[tagId];
        return tag ? `<span class="task-tag category-${tag.category}">${tag.label}</span>` : '';
      }).join('')}</div>
    `;
    if (!t.auto) {
      li.onclick = () => {
        if (t.hidden && !done) {
          // check if all non-hidden tasks are done
          const nonHidden = lv.tasks.filter(x => !x.hidden);
          const allDone = nonHidden.every(x => isTaskDone(x.id));
          if (!allDone) { showToast('先完成所有普通任务再挑战隐藏', 'info'); return; }
        }
        // 已完成的任务点击 = 重做（重刷拿满分），未完成 = 直接做
        openTaskModal(currentLevelId, t.id);
      };
      const redo = li.querySelector('.task-redo');
      if (redo) redo.onclick = (e) => { e.stopPropagation(); openTaskModal(currentLevelId, t.id); };
      const undo = li.querySelector('.task-undo');
      if (undo) undo.onclick = (e) => { e.stopPropagation(); toggleTask(t.id); };
    }
    list.appendChild(li);
    // 块最后一个任务后，紧跟一行对应的复习翻牌
    if (reviewAfter[t.id]) {
      reviewAfter[t.id].forEach(w => {
      const unlocked = w.blockTasks.every(tid => isTaskDone(tid));
      const wType = w.type || 'memory';
      const isQuick = wType === 'quick';
      const isMatch = wType === 'match';
      const row = document.createElement('li');
      row.className = 'review-inline' + (unlocked ? ' unlocked' : ' locked');
      row.innerHTML = '<span class="ri-emoji">' + (unlocked ? (isQuick ? '⚡' : isMatch ? '🔗' : '🃏') : '🔒') + '</span><span class="ri-name">' + ((isQuick || isMatch) ? escHtml(w.name) : '翻牌 · ' + escHtml(w.name)) + '</span><span class="ri-meta">' + (isQuick ? w.size + ' 题' : isMatch ? w.size + ' 组' : (w.size * 2) + ' 张') + ' · ' + (unlocked ? '可玩' : '完成本块任务解锁') + '</span>';
      row.onclick = () => {
        if (!unlocked) { showToast('还没有解锁，先完成对应任务', 'error'); return; }
        if (isQuick) openQuickMatch(w, (win) => { if (win) showToast('⚡ 快打完成', 'success'); });
        else if (isMatch) openMatchGame(w, (win) => { if (win) showToast('🔗 连线完成', 'success'); });
        else openMemoryMatch(w, (win) => { if (win) showToast('🧠 翻牌完成', 'success'); });
      };
      list.appendChild(row);
      });
    }
  });
  // 番外：记忆大师挑战（本关通关后解锁，放在列表最后）
  if (tl && tl.bonus) {
    const lvDone = levelProgress(lv.id).completed;
    const row = document.createElement('li');
    row.className = 'review-inline review-bonus' + (lvDone ? ' unlocked' : ' locked');
    row.innerHTML = '<span class="ri-emoji">' + (lvDone ? '🏆' : '🔒') + '</span><span class="ri-name">记忆大师挑战 · 三层堆叠</span><span class="ri-meta">' + (lvDone ? '可玩' : '通关本关解锁') + '</span>';
    row.onclick = () => {
      if (!lvDone) { showToast('通关本关后才能挑战记忆大师', 'error'); return; }
      openMemoryMatch(tl.bonus, (win) => { if (win) showToast('🏆 记忆大师完成！', 'success'); });
    };
    list.appendChild(row);
  }
}

var selfTeachTypes = ['terminal', 'quiz', 'chain_quiz', 'fill_blank', 'drag_classify', 'install_wizard', 'progress_bar'];

function openTaskModal(lvId, taskId) {
  const lv = content.levels.find(l => l.id === lvId);
  if (!lv) return;
  const task = lv.tasks.find(t => t.id === taskId);
  if (!task) return;

  currentTaskId = taskId;
  
  // Show task preface dialogue first, then open modal with interaction
  showTaskPreface(task, () => {
    const overlay = document.getElementById('modalOverlay');
    overlay.style.display = '';
    overlay.classList.remove('show');
    document.getElementById('modalTitle').textContent = task.title;
    const body = document.getElementById('modalBody');
    body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--dim)">加载中…</div>';
    document.getElementById('modalFoot').innerHTML = '';
    overlay.classList.add('show');

    // 如果该类型自带讲解则直接委托渲染
    if (selfTeachTypes.indexOf(task.type) >= 0) {
      const handler = getInteraction(task.type);
      if (handler) {
        handler.render(body, task);
      }
    } else {
      // 通用模式：直接渲染交互（教学已在前置弹窗完成）
      const handler = getInteraction(task.type);
      if (!handler) {
        body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--dim)">⚠️ 未知任务类型: ' + task.type + '</div>';
        return;
      }
      handler.render(body, task);
    }
  });
}

function closeModal() {
  const el = document.getElementById('modalOverlay');
  if (!el) return;
  el.classList.remove('show');
  currentTaskId = null;
}

function completeTask(taskId, xp) {
  try {
    // 经验减半：命令猜错多次时 xp 低于满值，存 half 标记（影响实际总分，可重刷拿满分）
    const tFull = (content.levels.find(l => l.tasks.some(t => t.id === taskId)) || {}).tasks;
    const tFullXp = tFull ? taskXP(tFull.find(t => t.id === taskId)) : xp;
    if (xp < tFullXp) gameState.check[taskId] = { half: true };
    else gameState.check[taskId] = true;
    closeModal();
    renderFactory();
    renderMission();
    renderHeader();
    showToast('+' + xp + 'XP', 'success');
    checkLevelUp();
    saveState();
    evaluateAchievements(true);
    refreshLeaderboard().then(() => evaluateAchievements(true));
  } catch (e) {
    console.error('completeTask error:', e);
    showToast('保存失败，请重试', 'error');
  }
}

function toggleTask(taskId) {
  delete gameState.check[taskId];
  renderFactory();
  renderMission();
  renderHeader();
  saveState();
}

        <span class="prompt">root@锐智:~$</span>
        <input type="text" id="termInput" spellcheck="false" autocomplete="off" placeholder="输入命令">
      </div>
    </div>
    <div style="font-size: 14px;color:var(--dim);margin-top:6px" id="termHint"></div>
  `;

  const teachArea = document.getElementById('termTeachArea');
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn" onclick="closeModal()">取消</button>
  `;
  // 初始 mood：首次进关卡 -> thinking
  const initialMood = getDirectorMood(task, { firstTime: true });
  addDirectorBox(teachArea, teachText, () => startBoot(), initialMood);

  function startBoot() {
  document.getElementById('termRoot').style.display = 'block';

  const body = document.getElementById('termBody');
  const history = document.getElementById('termHistory');
  const cursorLine = document.getElementById('termCursorLine');
  const input = document.getElementById('termInput');
  const inputRow = document.getElementById('termInputRow');
  const hint = document.getElementById('termHint');
  const bootEl = document.getElementById('bootMsgs');

  // Boot sequence
  playSound('boot');
  let bIdx = 0;
  bootEl.textContent = '';
  function bootTick() {
    if (bIdx < bootMsgs.length) {
      bootEl.textContent += bootMsgs[bIdx] + '\n';
      body.scrollTop = body.scrollHeight;
      bIdx++;
      setTimeout(bootTick, 120);
    } else {
      errors++;
      streak = 0;
      // Boot complete - show prompt as permanent hint
      hint.textContent = cfg.prompt || '输入命令开始…';
      hint.style.color = 'var(--amber)';
      cursorLine.style.display = 'none';
      inputRow.style.display = 'flex';
      input.focus();
    }
  }
  bootTick();

  function appendOutput(html) {
    history.innerHTML += `<div class="term-line">${html}</div>`;
    body.scrollTop = body.scrollHeight;
  }

  function doCheck() {
    const cmd = input.value.trim();
    if (!cmd) return;
    playSound('click');
    attempts++;
    cmdHistory.push(cmd);
    historyIdx = cmdHistory.length;

    // Echo the command
    cursorLine.style.display = 'none';
    appendOutput(`<span class="term-prompt">root@锐智:~$ </span><span class="term-cmd">${cmd.replace(/</g,'&lt;')}</span>`);

    const expected = Array.isArray(cfg.command) ? cfg.command : [cfg.command];
    const match = expected.some(e => cmd.toLowerCase() === e.toLowerCase() || cmd.toLowerCase().replace(/\s+/g,' ') === e.toLowerCase().replace(/\s+/g,' '));

    if (match) {
      streak++;
      errors = 0;
      // Fade in output character by character
      const outputLines = (cfg.output || '命令执行成功').split('\n');
      let lineIdx = 0;
      function showLine() {
        if (lineIdx < outputLines.length) {
          const line = outputLines[lineIdx];
          const cls = line.includes('ping statistics') || line.includes('packets transmitted') || line.includes('OK)')
            ? 'term-success' : 'term-out';
          appendOutput(`<span class="${cls}">${line}</span>`);
          lineIdx++;
          setTimeout(showLine, lineIdx === 1 ? 200 : 60);
        } else {
      errors++;
      streak = 0;
          // Done
          appendOutput('');
          playSound('success');
          input.disabled = true;
          input.style.display = 'none';
          inputRow.style.display = 'none';

          // Show the claim button
          const foot = document.getElementById('modalFoot');
          foot.innerHTML = '';
          const claimBtn = document.createElement('button');
          claimBtn.className = 'btn btn-success';
          claimBtn.textContent = '✓ 领取 XP +' + taskXP(task);
          foot.appendChild(claimBtn);
          claimBtn.addEventListener('click', function(ev) {
            ev.preventDefault();
            completeTask(task.id, taskXP(task));
          });

          showToast('命令正确！', 'success');
        }
      }
      showLine();
    } else {
      errors++;
      streak = 0;
      // Check for intermediate commands (same base cmd, wrong args, or --help)
      const baseCmd = cmd.split(' ')[0];
      const expectedBases = expected.map(e => e.split(' ')[0]);
      const isRelated = expectedBases.includes(baseCmd);
      const wantsHelp = cmd.includes('--help') || cmd === baseCmd + ' -h' || cmd === baseCmd + ' --h' || cmd === baseCmd + ' -?';

      if (isRelated && wantsHelp) {
        // Realistic help text by command
        const helpMap = {
          'uname': `用法：uname [选项]...\n显示系统信息。\n\n选项：\n  -a, --all                显示所有信息\n  -s, --kernel-name        显示内核名称\n  -n, --nodename           显示网络节点主机名\n  -r, --kernel-release     显示内核发行版\n  -v, --kernel-version     显示内核版本\n  -m, --machine            显示机器硬件架构\n  -p, --processor          显示处理器类型\n  -i, --hardware-platform  显示硬件平台\n  -o, --operating-system   显示操作系统\n      --help               显示此帮助信息`,
          'ip': `用法：ip [选项] 对象 [命令]\n       ip address {show|add|del} [dev 设备名]\n\n对象：\n  address      网络设备地址\n  link         网络设备\n  route        路由表\n\nip address show 选项：\n  -s, -stats   显示统计信息\n  -4           仅 IPv4\n  -6           仅 IPv6`,
          'ping': `用法：ping [选项] 目标主机\n\n选项：\n  -c <次数>    发送指定次数的报文后停止\n  -i <间隔>    每次发送间隔（秒）\n  -s <大小>    发送的数据包大小\n  -t <TTL>     设置 TTL 值\n  -4           仅使用 IPv4\n  -6           仅使用 IPv6`,
          'traceroute': `用法：traceroute [选项] 目标 [跳数]\n\n选项：\n  -n            不解析域名到 IP\n  -q <查询数>   每跳查询次数\n  -w <超时>     等待响应时间（秒）\n  -4            仅 IPv4\n  -6            仅 IPv6`,
          'nslookup': `用法：nslookup [域名] [DNS服务器]\n\n示例：\n  nslookup www.baidu.com\n  nslookup www.baidu.com 8.8.8.8`,
          'ssh': `用法：ssh [选项] 用户名@主机地址\n\n选项：\n  -p <端口>    指定端口号\n  -i <密钥>    使用指定密钥文件\n  -v           详细模式（调试用）\n\n示例：\n  ssh root@192.168.1.100\n  ssh -p 2222 admin@10.0.0.1`,
          'curl': `用法：curl [选项] URL\n\n选项：\n  -o <文件>    输出到文件\n  -s           静默模式\n  -I           仅显示响应头\n  -H <头>      自定义请求头\n\n示例：\n  curl ifconfig.me\n  curl -I https://baidu.com`,
          'docker': `用法：docker [命令] [选项]\n\n常用命令：\n  run         运行容器\n  ps          查看容器列表\n  stop        停止容器\n  rm          删除容器\n  pull        下载镜像`,
          'mosquitto_sub': `用法：mosquitto_sub [选项]\n\n选项：\n  -h <主机>    Broker 地址\n  -p <端口>    Broker 端口\n  -t <主题>    订阅主题\n  -v          显示消息详情`,
          'mosquitto_pub': `用法：mosquitto_pub [选项]\n\n选项：\n  -h <主机>    Broker 地址\n  -p <端口>    Broker 端口\n  -t <主题>    发布主题\n  -m <消息>    消息内容`,
          'systemctl': `用法：systemctl [命令] [服务名]\n\n常用命令：\n  status       查看服务状态\n  start        启动服务\n  stop         停止服务\n  restart      重启服务\n  enable       设置开机自启\n\n示例：\n  systemctl status edge-service\n  systemctl restart ssh`
        };
        const helpText = helpMap[baseCmd] || `${baseCmd}: 试试 ${expected[0]} 看看效果`;
        // Type out help line by line
        const helpLines = helpText.split('\n');
        let hIdx = 0;
        function showHelpLine() {
          if (hIdx < helpLines.length) {
            const line = helpLines[hIdx];
            const cls = line.startsWith('用法') ? 'term-info' : line.startsWith('  -') ? 'term-success' : 'term-out';
            appendOutput(`<span class="${cls}">${line}</span>`);
            hIdx++;
            setTimeout(showHelpLine, 30);
          } else {
      errors++;
      streak = 0;
            const idx = Math.min(attempts - 1, hints.length - 1);
            hintUsed = true;
            hint.textContent = '💡 ' + hints[idx];
            hint.style.color = 'var(--amber)';
            playSound('click');
            input.value = '';
            input.focus();
          }
        }
        showHelpLine();
      } else if (isRelated && cmd.split(' ').length < 2) {
        // Base command without arguments - show realistic output
        const baseOutputs = {
          'uname': 'Linux',
          'ip': 'Usage: ip [ OPTIONS ] OBJECT { COMMAND | help }\n       ip [ -force ] -batch filename\n\nwhere  OBJECT := { link | address | route | neigh | ... }',
          'ping': 'ping: usage error: Destination address required',
          'traceroute': 'traceroute: usage error: No destination specified',
          'nslookup': '> （进入交互模式，输入 exit 返回）',
          'ssh': 'usage: ssh [-46AaCfGgKkMNnqsTtVvXxYy] [-B bind_interface] [-b bind_address] [-c cipher_spec] [-D [bind_address:]port] [-E log_file] [-e escape_char] [-F configfile] [-I pkcs11] [-i identity_file] [-J [user@]host[:port]] [-L address] [-l login_name] [-m mac_spec] [-O ctl_cmd] [-o option] [-p port] [-Q query_option] [-R address] [-S ctl_path] [-W host:port] [-w local_tun[:remote_tun]] destination [command]',
          'curl': 'curl: try \'curl --help\' or \'curl --manual\' for more information',
          'docker': 'Usage:  docker [OPTIONS] COMMAND\n\nA self-sufficient runtime for containers\n\nCommon Commands:\n  run         Create and run a new container from an image\n  ps          List containers\n  pull        Download an image from a registry\n  --help      Print usage',
          'mosquitto_sub': 'mosquitto_sub: error: need a topic to subscribe to\nUse mosquitto_sub --help to see usage.',
          'mosquitto_pub': 'mosquitto_pub: error: need a topic and a message\nUse mosquitto_pub --help to see usage.',
          'systemctl': 'Usage: systemctl [OPTIONS...] COMMAND [UNIT...]\n\nQuery or send control commands to the system manager.\n\nCommands:\n  status UNIT    Show runtime status of a unit\n  start UNIT     Start (activate) one or more units\n  stop UNIT      Stop (deactivate) one or more units\n  restart UNIT   Restart one or more units\n  enable UNIT    Enable one or more unit files'
        };
        const realOutput = baseOutputs[baseCmd] || `${baseCmd}: 需要指定参数，试试 ${expected[0]}`;
        const outLines = realOutput.split('\n');
        outLines.forEach((line, li) => {
          appendOutput(`<span class="${li === 0 ? 'term-warn' : 'term-out'}">${line}</span>`);
        });
        const idx = Math.min(attempts - 1, hints.length - 1);
        hint.textContent = '💡 ' + hints[idx];
        hint.style.color = 'var(--amber)';
        input.value = '';
        input.focus();
      } else {
      errors++;
      streak = 0;
        appendOutput(`<span class="term-error">bash: ${cmd}: 命令未找到</span>`);
        const idx = Math.min(attempts - 1, hints.length - 1);
        hint.textContent = '💡 ' + hints[idx];
        hint.style.color = 'var(--amber)';
        shakeScreen();
        input.value = '';
        input.focus();
      }
    }
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doCheck();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (cmdHistory.length > 0) {
        historyIdx = Math.max(0, historyIdx - 1);
        input.value = cmdHistory[historyIdx];
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx < cmdHistory.length - 1) {
        historyIdx++;
        input.value = cmdHistory[historyIdx];
      } else {
      errors++;
      streak = 0;
        historyIdx = cmdHistory.length;
        input.value = '';
      }
    }
  });

  setTimeout(() => input.focus(), 200);
  } // end startBoot
} // end renderTypeTerminal
