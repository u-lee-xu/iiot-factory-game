<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锐智工厂 · 工业互联网实训</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="transit" class="transit"><div class="tr-inner">
  <div class="tr-icon">⚙️</div><div class="tr-bar"><div class="tr-fill"></div></div>
  <div class="tr-text" id="trText">正在进入…</div>
</div></div>
<script>try{
  var _u=location.search;
  var _q=new URLSearchParams(_u);
  // 旧版学生关卡页已废弃：裸 student.html(无参数) 不再渲染旧页，直接回厂区地图(新版)
  if(!_q.get('task') && !_q.get('level') && !_q.get('open')){
    location.replace('map_proto.html');
  } else if(_q.get('level') && !_q.get('task')){
    // 旧版"进入关卡"入口已废弃：?level=X → 进该关卡的新版房间，避免 map-flow 空壳/旧页
    location.replace('room.html?room='+encodeURIComponent(_q.get('level')));
  } else if(/[?&](task|level|open)=/.test(_u)){
    document.body.classList.add("map-flow");
    var _f=(_u.match(/[?&]open=([^&]+)/)||[])[1];
    var _t=_f==='game'?'游戏专区':_f==='pedia'?'术语图鉴':_f==='leaderboard'?'排行榜':_f==='achievements'?'成就':_f==='wallet'?'工资与商城':(/[?&]task=/.test(_u)?'任务':(/[?&]level=/.test(_u)?'关卡':''));
    var _tr=document.getElementById('trText');
    if(_tr&&_t)_tr.innerHTML='正在进入 <b>'+_t+'</b>…';
    var _tv=document.getElementById('transit');
    if(_tv)_tv.classList.add('show');
  }
}catch(e){}</script>
<!-- Header -->
<div id="mapCrumb" style="display:none;background:#0a0e1c;border-bottom:1px solid var(--border);color:var(--amber);font-size:12px;padding:5px 12px;letter-spacing:1px"></div>
<div class="header">
  <div class="h-left">
    <span class="logo">⚙</span>
    <span class="title" id="playerDisplay">—</span>
    <span class="rank-badge" id="rankDisplay">实习生</span>
  </div>
  <div class="h-right">
    <div class="xp-wrap"><div class="xp-fill" id="xpFill"></div><span class="xp-label" id="xpLabel">0</span></div>
    <button class="btn-icon" onclick="openWallet()" title="工资与商城">💰<span id="walletAmt" style="font-size:12px;margin-left:2px">0</span></button>
    <button class="btn-icon" onclick="openGameZone()" title="游戏专区">🎮</button>
    <button class="btn-icon" onclick="openLeaderboard()" title="班级排行榜">🏆</button>
    <button class="btn-icon" onclick="openAchievements()" title="我的成就">🎖️</button>
    <button class="btn-icon" onclick="openGameRecords()" title="我的战绩">📊</button>
    <button class="btn-icon" onclick="openPasswordModal()" title="设置/修改密码" id="passwordBtn" style="display:none">🔑</button>
    <button class="btn-icon" onclick="openPedia()" title="术语图鉴">📖</button>
    <button class="btn-icon" id="soundToggle" onclick="toggleSound()" title="音效开关">🔊</button>
    <button class="btn-icon" id="musicToggle" onclick="toggleMusic()" title="背景音乐开关">🎵</button>
    <button class="btn-icon" onclick="nextMusic()" title="切换背景曲">⏭</button>
    <span class="director-avatar" id="directorAvatar" style="font-size:20px;margin-left:8px;cursor:default;transition:transform .2s">👨‍💼</span>
    <button class="btn-icon" id="backMapBtn" onclick="goMap()" title="返回厂区地图" style="display:none;color:var(--amber);border-color:var(--amber);font-size:13px;padding:3px 9px">🗺️ 返回厂区</button>
    <button class="btn-logout" onclick="logout()">退出</button>
  </div>
</div>

<!-- Factory View -->
<div class="factory-wrap">
  <div class="ach-bar" id="achBar" onclick="openAchievements()"></div>
  <div class="factory-rows" id="factoryContainer"></div>
</div>

<!-- Mission Panel -->
<div class="mission-wrap">
  <div class="mission-header">
    <div>
      <div class="mission-title" id="missionTitle">选择关卡开始</div>
      <div class="task-progress" id="taskProgress"></div>
    </div>
  </div>
  <div class="mission-story" id="missionStory" style="display:none"></div>
  <ul class="task-list" id="taskList"></ul>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div class="mh-left">
        <h3 id="modalTitle">任务</h3>
        <div id="modalSub" class="modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- Level Up -->
<div class="level-up-overlay" id="levelUpOverlay">
  <div class="level-up-box">
    <div class="big-rank" id="levelUpRank">🎉</div>
    <div class="big-label" id="levelUpLabel"></div>
  </div>
</div>

<!-- Leaderboard / Achievements -->
<div class="lb-overlay" id="lbOverlay" onclick="if(event.target===this)closeLb()">
  <div class="lb-box">
    <div class="lb-head">
      <button class="lb-tab active" id="tabRank" onclick="switchLbTab('rank')">🏆 排行榜</button>
      <button class="lb-tab" id="tabAch" onclick="switchLbTab('ach')">🎖️ 成就</button>
      <span class="lb-close" onclick="closeLb()">✕</span>
    </div>
    <div class="lb-body" id="lbBody"></div>
  </div>
</div>

<!-- 我的战绩 -->
<div class="rec-overlay" id="recOverlay" onclick="if(event.target===this)closeGameRecords()">
  <div class="rec-box">
    <div class="rec-head"><div class="rec-title">📊 我的战绩</div><span class="lb-close" onclick="closeGameRecords()">✕</span></div>
    <div class="rec-body" id="recBody"></div>
  </div>
</div>

<!-- Password Modal -->
<div class="pw-overlay" id="pwOverlay" onclick="if(event.target===this)closePasswordModal()">
  <div class="pw-box">
    <div class="pw-head">
      <div class="pw-title" id="pwTitle">设置登录密码</div>
      <span class="lb-close" onclick="closePasswordModal()">✕</span>
    </div>
    <div class="pw-body">
      <div class="pw-field" id="pwOldField">
        <label>原密码</label>
        <input id="pwOld" type="password" placeholder="当前密码" autocomplete="current-password">
      </div>
      <div class="pw-field">
        <label>新密码</label>
        <input id="pwNew" type="password" placeholder="至少 4 位" autocomplete="new-password">
      </div>
      <div class="pw-field">
        <label>确认新密码</label>
        <input id="pwNew2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
      </div>
      <div class="pw-err" id="pwErr"></div>
      <button class="btn btn-success" id="pwSaveBtn" style="width:100%" onclick="savePassword()">确认</button>
    </div>
  </div>
</div>

<!-- Term Pedia -->
<div class="pd-overlay" id="pdOverlay" onclick="if(event.target===this)closePedia()">
  <div class="pd-box">
    <div class="pd-head">
      <div>
        <div class="pd-title">📖 术语图鉴</div>
        <div class="pd-sub" id="pdProgress"></div>
      </div>
      <span class="lb-close" onclick="closePedia()">✕</span>
    </div>
    <div class="pd-body" id="pdBody"></div>
  </div>
</div>

<!-- 🐛 抓虫有奖 - Bug 反馈入口 -->
<div id="bugFloater" onclick="openBugReport()" title="反馈 Bug，抓虫有奖">🐛 <span>反馈 Bug · 抓虫有奖</span></div>
<div class="bug-overlay" id="bugOverlay" onclick="if(event.target===this)closeBugReport()">
  <div class="bug-box">
    <div class="bug-head">
      <div class="bug-title">🐛 反馈 Bug · 抓虫有奖</div>
      <button class="bug-close" onclick="closeBugReport()">✕</button>
    </div>
    <div class="bug-body">
      <div class="bug-tip">在锐智工厂里发现任何问题（页面错乱、卡住、报错、题目/答案有误、提示不清晰…）都可以反馈。老师核实后会给<b>有效反馈</b>发成就徽章 🎖️，抓虫有奖！</div>
      <div class="bug-field">
        <label>出现在哪（选填）</label>
        <input id="bugLocation" placeholder="例如：L3 翻牌游戏 / 答题页 / 排行榜 / 教师端…" maxlength="100">
      </div>
      <div class="bug-field">
        <label>遇到的问题</label>
        <textarea id="bugContent" placeholder="描述你遇到的 Bug：点什么没反应、数字显示错、卡住不动、提示不对…"></textarea>
      </div>
      <div class="bug-err" id="bugErr"></div>
      <button id="bugSubmit" onclick="submitBugReport()">🐛 提交反馈</button>
    </div>
  </div>
</div>

<!-- Scanlines CRT effect -->
<div class="scanlines"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// zzfx() - the universal entry point -- returns a AudioBufferSourceNode
zzfx=(...t)=>zzfxP(zzfxG(...t))

// zzfxP() - the sound player -- returns a AudioBufferSourceNode
zzfxP=(...t)=>{let e=zzfxX.createBufferSource(),f=zzfxX.createBuffer(t.length,t[0].length,zzfxR);t.map((d,i)=>f.getChannelData(i).set(d)),e.buffer=f,e.connect(zzfxX.destination),e.start();return e}

// zzfxG() - the sound generator -- returns an array of sample data
zzfxG=(q=1,k=.05,c=220,e=0,t=0,u=.1,r=0,F=1,v=0,z=0,w=0,A=0,l=0,B=0,x=0,G=0,d=0,y=1,m=0,C=0)=>{let b=2*Math.PI,H=v*=500*b/zzfxR**2,I=(0<x?1:-1)*b/4,D=c*=(1+2*k*Math.random()-k)*b/zzfxR,Z=[],g=0,E=0,a=0,n=1,J=0,K=0,f=0,p,h;e=99+zzfxR*e;m*=zzfxR;t*=zzfxR;u*=zzfxR;d*=zzfxR;z*=500*b/zzfxR**3;x*=b/zzfxR;w*=b/zzfxR;A*=zzfxR;l=zzfxR*l|0;for(h=e+m+t+u+d|0;a<h;Z[a++]=f)++K%(100*G|0)||(f=r?1<r?2<r?3<r?Math.sin((g%b)**3):Math.max(Math.min(Math.tan(g),1),-1):1-(2*g/b%2+2)%2:1-4*Math.abs(Math.round(g/b)-g/b):Math.sin(g),f=(l?1-C+C*Math.sin(2*Math.PI*a/l):1)*(0<f?1:-1)*Math.abs(f)**F*q*zzfxV*(a<e?a/e:a<e+m?1-(a-e)/m*(1-y):a<e+m+t?y:a<h-d?(h-a-d)/u*y:0),f=d?f/2+(d>a?0:(a<h-d?1:(h-a)/d)*Z[a-d|0]/2):f),p=(c+=v+=z)*Math.sin(E*x-I),g+=p-p*B*(1-1E9*(Math.sin(a)+1)%2),E+=p-p*B*(1-1E9*(Math.sin(a)**2+1)%2),n&&++n>A&&(c+=w,D+=w,n=0),!l||++J%l||(c=D,v=H,n=n||1);return Z}

// zzfxV - global volume
zzfxV=.3

// zzfxR - global sample rate
zzfxR=44100

// zzfxX - the common audio context
zzfxX=new(window.AudioContext||webkitAudioContext);
</script>

</script>
<script src="/data/music.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
