<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>锐智工厂 · 厂区地图（原型）</title>
<style>
:root{
  --bg:#0b0e1a; --floor:#141a2e; --road:#1b2339; --roadline:#3a4568;
  --text:#e8eaf0; --dim:#9aa3bd; --amber:#ffb340; --green:#00e676; --red:#ff5252;
  --border:#2c3552;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;overflow-x:hidden}
/* ===== 登录 ===== */
#loginBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--bg)}
#loginBox.hide{display:none}
.login-card{width:min(340px,90vw);background:#121830;border:2px solid var(--border);padding:26px 22px;border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.5)}
.login-card h1{font-size:20px;color:var(--amber);letter-spacing:2px;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input{width:100%;background:#0a0e1c;border:2px solid var(--border);color:var(--text);font-family:inherit;font-size:15px;padding:9px 11px;outline:none}
.field input:focus{border-color:var(--amber)}
.btn{width:100%;padding:11px;font-size:15px;font-family:inherit;background:var(--amber);color:#1a1206;border:none;cursor:pointer;font-weight:bold;letter-spacing:2px}
.btn:hover{filter:brightness(1.1)}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;text-align:center}
.hint{font-size:11px;color:var(--dim);text-align:center;margin-top:14px}
/* ===== 主界面 ===== */
#mapApp{display:none}
#mapApp.show{display:block}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#10162a;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:20}
.brand{font-size:17px;color:var(--amber);letter-spacing:2px;font-weight:bold}
.brand small{font-size:10px;color:var(--dim);display:block;letter-spacing:0}
.player{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.pill{background:#0a0e1c;border:1px solid var(--border);padding:4px 10px;border-radius:3px;color:var(--text)}
.pill b{color:var(--amber)}
.back{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--border);padding:5px 9px;border-radius:3px}
.back:hover{color:var(--amber);border-color:var(--amber)}
/* ===== 厂区 ===== */
#map{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:14px 12px 36px}
.compound{position:relative;border:2px solid #223050;border-radius:10px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(30,50,95,.18), transparent 60%),
    linear-gradient(180deg,#0d1226,#0a0e1c)}
/* 厂区入口 */
.entrance{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 14px 12px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(255,179,64,.06),transparent)}
.gate-sign{text-align:center}
.gate-sign .t{font-size:18px;letter-spacing:6px;color:var(--amber);text-shadow:0 0 12px rgba(255,179,64,.6)}
.gate-sign .s{font-size:10px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.gate{position:relative;width:min(420px,80vw);height:26px;margin:6px auto 0;border-top:2px solid #3a4568;border-bottom:2px solid #3a4568;background:rgba(20,26,46,.6)}
.gate::before{content:"";position:absolute;left:0;top:-4px;bottom:-4px;width:6px;background:linear-gradient(180deg,#56617e,#2a3040);border:2px solid #0a0d18}
.gate::after{content:"";position:absolute;right:0;top:-4px;bottom:-4px;width:6px;background:linear-gradient(180deg,#56617e,#2a3040);border:2px solid #0a0d18}
.gate .bar{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:6px;
  background:repeating-linear-gradient(90deg,#3a4568 0 8px,transparent 8px 12px);border:1px solid #0a0d18;opacity:.7}
.guard{position:absolute;right:8px;bottom:-18px;width:34px;height:22px;background:#151b2e;border:2px solid #0a0d18;box-shadow:0 0 8px rgba(255,179,64,.25)}
.guard::before{content:"🚦";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;animation:blink 1.2s infinite}
.npc{display:flex;align-items:center;gap:10px;background:#121830;border:2px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:0 0 16px rgba(255,179,64,.18)}
.npc .npc-sprite{font-size:30px;filter:drop-shadow(0 0 8px rgba(255,179,64,.4));animation:npcBob 2.2s ease-in-out infinite}
.npc .bubble{font-size:12px;color:var(--amber);max-width:230px;line-height:1.5}
@keyframes npcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 主干道 */
.road{position:relative;margin:10px 0;height:30px}
.road-h{position:absolute;top:50%;left:0;right:0;height:16px;background:var(--road);border-top:2px solid var(--roadline);border-bottom:2px solid var(--roadline);transform:translateY(-50%)}
.road-h::before{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,rgba(255,179,64,.8) 0 12px,transparent 12px 24px);transform:translateY(-50%);animation:flow 1.1s linear infinite}
.road-h::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(100,200,255,.7) 0 6px,transparent 6px 18px);animation:flow .9s linear infinite reverse;opacity:.4}
@keyframes flow{to{background-position:24px 0}}
.walker{position:absolute;top:50%;z-index:5;font-size:16px;transform:translateY(-50%);animation:walkX 16s linear infinite}
.walker.w2{animation-duration:20s;animation-delay:3s;font-size:14px}
@keyframes walkX{0%{left:2%;transform:translateY(-50%) scaleX(1)}48%{left:96%;transform:translateY(-50%) scaleX(1)}50%{left:96%;transform:translateY(-50%) scaleX(-1)}98%{left:2%;transform:translateY(-50%) scaleX(-1)}100%{left:2%;transform:translateY(-50%) scaleX(1)}}
.walker.w3{animation-duration:24s;animation-delay:5s;font-size:13px}
.forklift{position:absolute;top:50%;z-index:5;font-size:18px;transform:translateY(-50%);animation:forkX 34s linear infinite}
@keyframes forkX{0%{left:-4%;transform:translateY(-50%) scaleX(1)}45%{left:96%;transform:translateY(-50%) scaleX(1)}50%{left:96%;transform:translateY(-50%) scaleX(-1)}95%{left:-4%;transform:translateY(-50%) scaleX(-1)}100%{left:-4%;transform:translateY(-50%) scaleX(1)}}
/* 生产区 */
.zone{position:relative;background:rgba(10,14,28,.42);border:1px solid #223050;border-radius:8px;padding:14px 10px 10px;margin:0 0 8px}
.zone-tag{position:absolute;top:-9px;left:14px;font-size:10px;color:var(--dim);background:#0b0e1a;border:1px solid var(--border);padding:2px 10px;border-radius:10px;letter-spacing:2px}
.zone-tag b{color:var(--amber)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
/* 中心广场 */
.plaza{display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:4px 0 8px;padding:12px 0;background:linear-gradient(180deg,transparent,rgba(0,229,118,.04),transparent);border-radius:8px}
.flag{font-size:24px;animation:flagWave 2.4s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* 配套设施区（像素风设施楼） */
.fac-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;align-items:start}
.fac-cell{text-align:center;cursor:pointer;padding:8px 2px;border-radius:8px;background:rgba(10,14,28,.35);border:1px solid transparent}
.fac-cell:hover{border-color:var(--amber)}
.fac-cell .fac-sub{font-size:9px;color:var(--dim);margin-top:3px;line-height:1.5}
.fac-cell .fac-sub em{color:var(--green);font-style:normal}
/* 游戏房：门前条纹雨棚 */
.b-awning{position:absolute;left:-2px;right:-2px;top:2px;height:6px;z-index:2;background:repeating-linear-gradient(90deg,#ff5252 0 6px,#f2f2f2 6px 12px);border:1px solid #04060c;border-bottom:none;box-shadow:0 0 6px rgba(255,82,82,.4)}
/* 休息区 · 凉亭 */
.pavilion{position:relative;width:88px;height:54px;margin:0 auto}
.pv-roof{position:absolute;left:8px;right:8px;top:0;height:12px;background:linear-gradient(180deg,#2b3454,#181e36);border:2px solid #04060c;clip-path:polygon(2% 0,98% 0,86% 100%,14% 100%)}
.pv-roof::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#00e676;box-shadow:0 0 6px rgba(0,230,118,.5)}
.pv-post{position:absolute;top:10px;bottom:8px;width:3px;background:#3a4560;border:1px solid #04060c}
.pv-post.p1{left:16px}
.pv-post.p2{right:16px}
.pv-bench{position:absolute;left:26px;right:26px;bottom:4px;height:5px;background:#5a5f6e;border:1px solid #04060c;border-radius:2px}
.pv-bench::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-6px;width:10px;height:6px;background:#6b7180;border:1px solid #04060c;border-radius:2px 2px 0 0}
.pv-bench::after{content:"";position:absolute;left:-8px;top:-11px;width:9px;height:11px;background:radial-gradient(circle at 35% 30%,#3fd97f,#1f9d57 75%);border:1px solid #04140b;border-radius:50% 50% 4px 4px}
/* 停车场 */
.parking{position:relative;width:88px;height:54px;margin:0 auto;background:#151b2e;border:2px solid #2a3852;border-radius:4px}
.parking::before{content:"";position:absolute;inset:8px 6px;background:repeating-linear-gradient(90deg,transparent 0 14px,#3a4568 14px 16px,transparent 16px 30px);opacity:.4}
.parking .pk-pole{position:absolute;left:8px;top:8px;width:2px;height:12px;background:#3a4560;border:1px solid #04060c}
.parking .pk-arm{position:absolute;left:10px;top:8px;width:14px;height:2px;background:#ff5252;transform-origin:left;animation:armUp 4s ease-in-out infinite}
@keyframes armUp{0%,8%,30%,100%{transform:rotate(0)}12%,24%{transform:rotate(58deg)}}
.pk-car{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;opacity:0;will-change:left}
.pk-car.cA{animation:carA 11s linear infinite;transform:translateY(-50%) scaleX(-1)}
.pk-car.cB{animation:carB 13s linear infinite 2.5s;font-size:13px}
@keyframes carA{0%{left:-26px;opacity:0}9%{opacity:1}24%{left:26px}30%{left:26px}52%{left:26px}74%{left:62px}92%{left:112px;opacity:1}100%{left:118px;opacity:0}}
@keyframes carB{0%{left:112px;opacity:0}9%{opacity:1}24%{left:62px}52%{left:62px}74%{left:26px}92%{left:-22px;opacity:1}100%{left:-28px;opacity:0}}
/* 像素树 */
.p-tree{position:relative;display:inline-block;width:18px;height:22px}
.p-tree .pt-trunk{position:absolute;left:7px;bottom:0;width:4px;height:8px;background:#6b4a2b;border:1px solid #04060c}
.p-tree .pt-top{position:absolute;left:2px;top:0;width:14px;height:14px;background:radial-gradient(circle at 35% 30%,#3fd97f,#1f9d57 72%);border:1px solid #04140b;border-radius:50% 50% 45% 45%;box-shadow:0 0 6px rgba(31,157,87,.3)}
/* 路灯 */
.p-lamp{position:relative;display:inline-block;width:8px;height:26px}
.p-lamp .pl-pole{position:absolute;left:3px;top:0;bottom:0;width:2px;background:#3a4560;border:1px solid #04060c}
.p-lamp .pl-head{position:absolute;left:0;top:0;width:8px;height:4px;background:#ffd98a;border-radius:4px 4px 1px 1px;box-shadow:0 0 9px #ffd98a;animation:blink 2.6s ease-in-out infinite}
.road .p-lamp{position:absolute;top:1px;z-index:4}
.road .lamp-l{left:14px}
.road .lamp-r{right:14px}
/* 水塔 */
.water-tower{position:relative;width:34px;height:46px;display:inline-block}
.wt-legs{position:absolute;left:4px;right:4px;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#2a3040 0 4px,transparent 4px 6px)}
.wt-tank{position:absolute;left:6px;right:6px;top:10px;height:20px;background:linear-gradient(180deg,#465170,#2a3248);border:2px solid #04060c;border-radius:6px 6px 2px 2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}
.wt-tank::after{content:"";position:absolute;left:2px;right:2px;top:8px;height:2px;background:#ff9800;opacity:.55}
.wt-roof{position:absolute;left:4px;right:4px;top:0;height:12px;background:linear-gradient(180deg,#2b3454,#181e36);border:2px solid #04060c;clip-path:polygon(50% 0,100% 100%,0 100%)}
/* 储罐 */
.tanks{display:inline-flex;gap:6px;align-items:flex-end}
.tk{position:relative;width:16px;height:24px;background:linear-gradient(180deg,#3a4560,#1c2438);border:2px solid #04060c;border-radius:8px 8px 2px 2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}
.tk::after{content:"";position:absolute;left:2px;right:2px;top:8px;height:2px;background:#ff9800;opacity:.5}
.tk.tk2{height:19px}
/* 喷泉 */
.fountain{position:relative;width:48px;height:36px;display:inline-block}
.f-basin{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(180deg,#1e2a4a,#0e1428);border:2px solid #2a3852;border-radius:50%}
.f-basin::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:2px;background:#4fd6ff;opacity:.7;border-radius:50%}
.f-spout{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:4px;height:16px;background:#2a3852;border:1px solid #04060c}
.f-water{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:3px;height:8px;background:linear-gradient(180deg,#7deaff,#4fd6ff);border-radius:50% 50% 0 0;opacity:.85;animation:fountain 2.2s ease-in-out infinite}
@keyframes fountain{0%,100%{height:6px;opacity:.5}50%{height:12px;opacity:1}}
/* 花坛 */
.flowerbed{position:relative;display:inline-block;width:18px;height:9px;background:linear-gradient(180deg,#7a5a2e,#4a3416);border:1px solid #04060c;border-radius:2px}
.flowerbed::before{content:"";position:absolute;left:3px;top:-4px;width:4px;height:4px;background:#ff6d9c;border-radius:50%}
.flowerbed::after{content:"";position:absolute;right:4px;top:-3px;width:3px;height:3px;background:#ffd400;border-radius:50%}
/* 动力站区 */
.utility-zone{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0 4px;padding:10px 14px;background:rgba(10,14,28,.35);border:1px dashed #2a3852;border-radius:8px}
.utility-zone .ut-label{font-size:10px;color:var(--dim);letter-spacing:3px}
/* 设施 Logo */
.lg-ctrl .lgc-body{position:absolute;left:1px;top:2px;width:18px;height:4px;background:var(--c);border-radius:2px;box-shadow:0 0 6px var(--cg)}
.lg-ctrl .lgc-btn{position:absolute;width:2px;height:2px;border-radius:50%;background:#0a0e1c}
.lg-ctrl .lgc-btn.b1{left:5px;top:3px}
.lg-ctrl .lgc-btn.b2{right:5px;top:3px}
.lg-flask .lgf-neck{position:absolute;left:9px;top:0;width:3px;height:3px;border:1px solid var(--c);border-bottom:none}
.lg-flask .lgf-body{position:absolute;left:6px;top:2px;width:10px;height:6px;border:1px solid var(--c);border-radius:0 0 5px 5px}
.lg-flask .lgf-liquid{position:absolute;left:7px;bottom:1px;width:8px;height:3px;background:var(--c);box-shadow:0 0 4px var(--cg);border-radius:0 0 4px 4px}
/* 伸缩门开关（有车进出） */
.gate .bar{animation:gateSlide 9s ease-in-out infinite}
@keyframes gateSlide{0%,55%,100%{transform:translateY(-50%) scaleX(1);opacity:.65}64%,88%{transform:translateY(-50%) scaleX(.25);opacity:1}}
/* 水塔滴水 + 警示灯 */
.water-tower .wt-drop{position:absolute;left:50%;top:30px;width:2px;height:3px;background:#7deaff;border-radius:50% 50% 2px 2px;opacity:0;animation:wtDrip 3s ease-in infinite}
@keyframes wtDrip{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(16px);opacity:0}}
.wt-tank::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-4px;width:4px;height:4px;border-radius:50%;background:#ff6d00;box-shadow:0 0 6px #ff6d00;animation:blink 1.4s infinite}
/* 储罐指示灯 */
.tk::before{content:"";position:absolute;left:6px;top:-3px;width:3px;height:3px;border-radius:50%;background:#ff5252;animation:blink 2s infinite}
/* 天空小鸟 */
.sky-bird{position:absolute;color:#9aa3bd;font-size:10px;z-index:3;pointer-events:none;animation:fly 42s linear infinite}
.sky-bird.b2{top:13%;animation-duration:55s;animation-delay:9s;font-size:8px}
@keyframes fly{from{left:-24px}to{left:104%}}
/* 无人机 */
.drone{position:absolute;top:6%;left:110%;z-index:3;width:22px;height:10px;pointer-events:none;animation:droneX 34s linear infinite}
@keyframes droneX{to{left:-14%}}
.dr-body{position:absolute;left:6px;top:3px;width:10px;height:4px;background:#2a3852;border:1px solid #04060c;border-radius:2px}
.dr-rotor{position:absolute;left:4px;top:0;width:6px;height:2px;background:#4a5570;border:1px solid #04060c;animation:spin .18s linear infinite}
.dr-rotor.r2{left:13px}
@keyframes spin{from{transform:scaleX(1)}50%{transform:scaleX(.3)}to{transform:scaleX(1)}}
.dr-light{position:absolute;left:14px;top:1px;width:2px;height:2px;border-radius:50%;background:#ff5252;box-shadow:0 0 5px #ff5252;animation:blink .5s infinite}
/* 无人机航线光点 */
.drone-path{position:absolute;top:7%;left:0;right:0;height:2px;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(120,200,255,.5) 0 6px,transparent 6px 16px);opacity:.3;animation:pathPulse 2.4s ease-in-out infinite}
@keyframes pathPulse{0%,100%{opacity:.22}50%{opacity:.5}}
/* 探照灯 */
.searchlight{position:absolute;left:10px;bottom:8px;width:70px;height:100px;z-index:4;pointer-events:none}
.sl-beam{position:absolute;left:50%;bottom:0;width:34px;height:120px;transform-origin:50% 100%;background:conic-gradient(from 90deg at 50% 100%,transparent 8deg,rgba(255,240,180,.08) 40deg,transparent 78deg);animation:slSweep 15s ease-in-out infinite}
@keyframes slSweep{0%,100%{transform:rotate(-42deg);opacity:.55}50%{transform:rotate(42deg);opacity:1}}
/* 风车 */
.windmill{position:relative;width:30px;height:46px;display:inline-block}
.wm-pole{position:absolute;left:13px;top:10px;bottom:0;width:3px;background:repeating-linear-gradient(180deg,#3a4560 0 4px,#20283c 4px 6px);border:1px solid #04060c}
.wm-rotor{position:absolute;left:12px;top:4px;width:6px;height:6px;animation:spin3 3.6s linear infinite}
.wm-blade{position:absolute;left:2px;top:-12px;width:2px;height:14px;background:#cfe3ff;border:1px solid #04060c;transform-origin:50% 100%;opacity:.9}
.wm-blade.b1{transform:rotate(0deg)}
.wm-blade.b2{transform:rotate(120deg)}
.wm-blade.b3{transform:rotate(240deg)}
.wm-hub{position:absolute;left:1px;top:1px;width:4px;height:4px;border-radius:50%;background:#56617e;border:1px solid #04060c;z-index:2}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* ===== 新建筑（工业骨架+赛博皮肤）===== */
.building{--c:#00bcd4;--cg:rgba(0,188,212,.5);--sh:74px;--bh:56px;
  text-align:center;cursor:pointer;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.building .b-sprite{position:relative;width:84px;height:var(--sh);margin:0 auto;image-rendering:pixelated}
.b-shadow{position:absolute;bottom:-6px;left:6px;right:6px;height:8px;background:rgba(0,0,0,.5);border-radius:50%;filter:blur(1px);pointer-events:none}
.b-body{position:absolute;left:6px;right:6px;bottom:0;height:var(--bh);
  background:
    linear-gradient(90deg, rgba(0,0,0,.5), transparent 15%, transparent 85%, rgba(0,0,0,.5)),
    repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 2px, transparent 2px 5px),
    linear-gradient(180deg,#242d4d 0%,#161c34 60%,#0b1020 100%);
  box-shadow:inset 0 0 0 2px #04060c, inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -4px 0 rgba(0,0,0,.35), 0 0 12px var(--cg)}
.b-wall{position:absolute;inset:0}
.b-wall::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 2px, transparent 2px 9px);opacity:.45}
.b-ribs{position:absolute;inset:0;background:repeating-linear-gradient(90deg, transparent 0 15px, rgba(0,0,0,.4) 15px 17px)}

/* ===== 房间界面 ===== */
#room{position:fixed;inset:0;background:rgba(4,6,12,.84);display:none;align-items:center;justify-content:center;z-index:70;padding:14px}
#room.show{display:flex}
.room-panel{width:min(600px,96vw);max-height:92vh;overflow:auto;background:#10162a;border:2px solid var(--border);border-radius:10px;box-shadow:0 0 40px rgba(0,0,0,.6)}
.room-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid #223050;position:sticky;top:0;background:#10162a;z-index:2}
.room-logo{width:46px;height:46px;background:#0a0e1c;border:1px solid var(--rc);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px var(--rcg);flex:none}
.room-logo .b-logo{transform:scale(2.1)}
.room-title{flex:1}
.rt-name{font-size:18px;color:var(--text);letter-spacing:1px}
.rt-sub{font-size:11px;color:var(--dim);margin-top:2px}
.room-close{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px}
.room-close:hover{color:var(--amber)}
.room-progress{padding:14px 18px 0}
.rp-bar{height:10px;background:#0a0e1c;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.rp-fill{height:100%;background:var(--rc);width:0%;box-shadow:0 0 8px var(--rcg)}
.rp-txt{font-size:11px;color:var(--dim);margin-top:5px;text-align:right}
.room-narr{padding:11px 14px;font-size:13px;color:#cdd8ea;line-height:1.7;border-left:3px solid var(--rc);margin:12px 18px 6px;background:rgba(10,14,28,.5);border-radius:0 6px 6px 0}
.room-narr .rt-who{font-size:11px;color:var(--rc);font-weight:bold;margin-bottom:4px;letter-spacing:1px}
.room-tasks{padding:6px 18px 12px}
.rt-sec{font-size:12px;color:var(--dim);margin:16px 0 8px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.rt-sec::after{content:"";flex:1;height:1px;background:#223050}
.task-card{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:6px 0;border-radius:8px;border:1px solid #223050;background:#0a0e1c;transition:border-color .2s}
.task-card .tc-icon{font-size:16px;width:24px;text-align:center;flex:none}
.task-card .tc-title{flex:1;font-size:13px;color:#9aa3bd;line-height:1.3}
.task-card .tc-xp{font-size:10px;color:#7c8ca6;background:#10172c;border:1px solid #223050;padding:2px 6px;border-radius:8px;flex:none}
.task-card .tc-state{font-size:14px;flex:none;width:22px;text-align:center}
.task-card{cursor:pointer}
.task-card:hover{border-color:var(--rc);transform:translateX(2px)}
.task-card.todo .tc-icon,.task-card.todo .tc-title{filter:grayscale(1);opacity:.55}
.task-card.next{border-color:var(--amber);box-shadow:0 0 10px rgba(255,179,64,.28)}
.task-card.next .tc-title{color:var(--amber);font-weight:bold}
.task-card.next .tc-state{color:var(--amber);animation:startPulse 1.8s ease-in-out infinite}
.task-card.done{border-color:var(--rc);background:linear-gradient(90deg,var(--rcg2),transparent 60%)}
.task-card.done .tc-title{color:var(--text)}
.task-card.done .tc-state{color:var(--rc);animation:doneFlash 1.6s ease-in-out infinite}
@keyframes doneFlash{0%,100%{filter:drop-shadow(0 0 2px var(--rc));transform:scale(1)}50%{filter:drop-shadow(0 0 9px var(--rc));transform:scale(1.18)}}
.room-foot{display:flex;gap:10px;padding:2px 18px 16px}
.room-back{flex:1;padding:11px;font-size:14px;font-family:inherit;background:#0a0e1c;color:var(--dim);border:1px solid var(--border);cursor:pointer;border-radius:6px}
.room-back:hover{color:var(--text);border-color:var(--amber)}
.room-go{flex:1.6;padding:11px;font-size:14px;font-family:inherit;background:var(--rc);color:#0a0e1c;border:none;cursor:pointer;font-weight:bold;letter-spacing:1px;border-radius:6px}
.room-go:hover{filter:brightness(1.12)}
.room-go.locked{background:#2a3852;color:#9aa3bd}
.room-panel.done{border-color:var(--rc);box-shadow:0 0 30px var(--rcg)}
.room-cleared{display:inline-block;font-size:11px;color:#04140b;background:var(--green);padding:2px 10px;border-radius:10px;font-weight:bold;animation:startPulse 1.8s ease-in-out infinite;margin-top:3px}
/* ===== 移动端 ===== */
@media (max-width:700px){

}

<script>
const API = location.origin;
const RANKS=[{min:0,t:'实习生',e:'🔰'},{min:1000,t:'学徒',e:'🔧'},{min:2500,t:'技工',e:'⚙️'},{min:4500,t:'工程师',e:'🛠️'},{min:7000,t:'专家',e:'🏆'}];
let content=null, me=null, token='';
const $=id=>document.getElementById(id);

// 厂区幕色（样张定稿，暂不走 game-content 的旧色）
const AREA_COLOR={control_room:'#00bcd4',console:'#ffd400',workshop:'#00e676',edge_cabinet:'#ff5252',
  cloud_platform:'#1565c0',big_screen:'#e040fb',data_pipe:'#ff6d00',ai_lab:'#9c27b0'};
const FACADES={

    {x:8,y:14,w:24,h:6,t:'strip',l:'glow',a:'tw'},{x:36,y:14,w:24,h:6,t:'strip',l:'glow',a:'tw'},{x:8,y:24,w:24,h:6,t:'strip',l:'warm',a:'tw'},{x:36,y:24,w:24,h:6,t:'strip',l:'warm',a:'tw'},{x:8,y:34,w:24,h:6,t:'strip',l:'dark',a:''},{x:36,y:34,w:24,h:6,t:'strip',l:'dark',a:''}],
  workshop:[
    {x:8,y:13,w:13,h:8,t:'sq',l:'glow',a:'tw'},{x:23,y:13,w:13,h:8,t:'sq',l:'warm',a:'tw'},{x:38,y:13,w:13,h:8,t:'sq',l:'dark',a:''},{x:53,y:13,w:13,h:8,t:'sq',l:'glow',a:'tw'},
    {x:8,y:24,w:13,h:8,t:'sq',l:'glow',a:'tw'},{x:23,y:24,w:13,h:8,t:'sq',l:'glow',a:'tw'},{x:38,y:24,w:13,h:8,t:'sq',l:'warm',a:'tw'},{x:53,y:24,w:13,h:8,t:'sq',l:'glow',a:'flick'},
    {x:8,y:35,w:13,h:8,t:'sq',l:'dark',a:''},{x:23,y:35,w:13,h:8,t:'sq',l:'dark',a:''},{x:38,y:35,w:13,h:8,t:'sq',l:'dark',a:''},{x:53,y:35,w:13,h:8,t:'sq',l:'dark',a:''}],
  edge_cabinet:[
    {x:10,y:13,w:11,h:11,t:'round',l:'red',a:'tw'},{x:28,y:13,w:11,h:11,t:'round',l:'glow',a:'tw'},{x:46,y:13,w:11,h:11,t:'round',l:'glow',a:'tw'},{x:10,y:30,w:47,h:8,t:'grill',l:'',a:''}],
  cloud_platform:[
    {x:12,y:12,w:6,h:20,t:'slit',l:'glow',a:'breath'},{x:26,y:12,w:6,h:20,t:'slit',l:'glow',a:'breath'},{x:40,y:12,w:6,h:20,t:'slit',l:'warm',a:'tw'},{x:54,y:12,w:6,h:20,t:'slit',l:'glow',a:'breath'}],
  big_screen:[
    {x:12,y:12,w:44,h:20,t:'screen',l:'glow',a:'breath'},{x:12,y:36,w:14,h:5,t:'sq',l:'warm',a:'tw'},{x:30,y:36,w:14,h:5,t:'sq',l:'dark',a:''},{x:48,y:36,w:14,h:5,t:'sq',l:'warm',a:'tw'}],
  data_pipe:[
    {x:8,y:14,w:12,h:12,t:'round',l:'glow',a:'tw'},{x:24,y:14,w:12,h:12,t:'round',l:'warm',a:'tw'},{x:40,y:14,w:12,h:12,t:'round',l:'glow',a:'tw'},{x:56,y:14,w:12,h:12,t:'round',l:'warm',a:'tw'},{x:24,y:31,w:20,h:10,t:'screen',l:'glow',a:'flick'}],
  ai_lab:[
    {x:10,y:13,w:14,h:14,t:'round',l:'glow',a:'breath'},{x:30,y:13,w:14,h:14,t:'round',l:'glow',a:'breath'},{x:50,y:13,w:14,h:14,t:'round',l:'glow',a:'breath'},{x:10,y:33,w:14,h:8,t:'sq',l:'glow',a:'flick'},{x:44,y:33,w:14,h:8,t:'sq',l:'glow',a:'flick'}]
};
const ISA_LAYERS=[
  {level:'L4',name:'云与智能层',sub:'☁️云平台 · 🤖AI分析 · 业务决策',areas:['cloud_platform','ai_lab'],flow:'数据上云 · 智能分析'},
  {level:'L3',name:'数据贯通层',sub:'📊监控大屏 · 🔗数据管道 · 实时流',areas:['big_screen','data_pipe'],flow:'监控上送 · 实时流转'},
  {level:'L2',name:'控制操作层',sub:'🖥️中控室 · 🎛️操作台 · SCADA/HMI',areas:['control_room','console'],flow:'状态采集 · 控制指令'},
  {level:'L1',name:'现场接入层',sub:'⚙️车间设备 · 📦边缘网关 · 数据源头',areas:['workshop','edge_cabinet'],flow:'物理过程 · 数据源头'}
];
const LOGOS={
  control_room:'<span class="b-logo lg-term"><i class="lt-screen"></i><i class="lt-line l1"></i><i class="lt-line l2"></i><i class="lt-line l3"></i></span>',
  console:'<span class="b-logo lg-console"><i class="lc-body"></i><i class="lc-btn b1"></i><i class="lc-btn b2"></i><i class="lc-knob"></i></span>',
  workshop:'<span class="b-logo lg-gear"><i class="lg-hub"></i><i class="lg-tooth t1"></i><i class="lg-tooth t2"></i><i class="lg-tooth t3"></i><i class="lg-tooth t4"></i></span>',
  edge_cabinet:'<span class="b-logo lg-cabinet"><i class="lcab-body"></i><i class="lcab-led"></i><i class="lcab-vents"></i></span>',
  cloud_platform:'<span class="b-logo lg-cloud"><i class="lcl-b b1"></i><i class="lcl-b b2"></i><i class="lcl-b b3"></i><i class="lcl-drop"></i></span>',
  big_screen:'<span class="b-logo lg-chart"><i class="lch-body"></i><i class="lch-bar b1"></i><i class="lch-bar b2"></i><i class="lch-bar b3"></i></span>',
  data_pipe:'<span class="b-logo b-pipe-logo"><i class="pl-pipe"></i><i class="pl-dot"></i><i class="pl-dot d2"></i><i class="pl-dot d3"></i></span>',
  ai_lab:'<span class="b-logo lg-chip"><i class="lchp-body"></i><i class="lchp-core"></i><i class="lchp-pin p1"></i><i class="lchp-pin p2"></i><i class="lchp-pin p3"></i><i class="lchp-pin p4"></i></span>'
};
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

async function doLogin(){
  const name=$('inpName').value.trim(), pw=$('inpPw').value;
  $('err').textContent='';
  if(!name){ $('err').textContent='请输入姓名'; return; }
  try{
    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,password:pw})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'登录失败');
    token=j.token;
    try{ sessionStorage.setItem('token',token); sessionStorage.setItem('role','student'); sessionStorage.setItem('name',name); }catch(e){}
    await loadAll();
    $('loginBox').classList.add('hide');
    $('mapApp').classList.add('show');
    try{ musStart(); }catch(e){}
  }catch(e){ $('err').textContent=e.message; }
}

async function loadAll(){
  const [cr, mr]=await Promise.all([
    fetch(API+'/api/game/content').then(r=>r.json()),
    fetch(API+'/api/student/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json())
  ]);
  content=cr.data||cr; me=mr.data;
  if(!content||!content.levels){ throw new Error('内容加载失败'); }
  render();
}

function isTaskDone(tid){ return !!(me.check && me.check[''+tid]); }
function levelProgress(lv){
  let done=0,total=0;
  (lv.tasks||[]).forEach(t=>{ if(t.auto)return; total++; if(isTaskDone(t.id))done++; });
  return {done,total,pct:total?Math.round(done/total*100):0,completed:total>0&&done>=total};
}
function accessOf(lv,idx){
  if(idx===0) return 'open';
  const prev=content.levels[idx-1];
  return levelProgress(prev).completed ? 'open' : 'locked';
}
function areaStars(lv){
  const st=(me.stars&&me.stars[lv.id])||{};
  return {self:st.self||0, peer:st.peer||0, teacher:st.teacher||0};
}
function starStr(v){ let s=''; for(let i=0;i<5;i++) s+= i<v?'★':'☆'; return s; }

function winHTML(f,i){
  const anim=f.a?` b-win ${f.a}`:'';
  const delay=f.a==='tw'?` style="animation-delay:${(i%5)*0.4}s"`:'';
  return `<div class="b-win ${f.t} ${f.l}${anim}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px${delay}"></div>`;
}
function logoHTML(area,color){
  const [r,g,b]=hex2rgb(color);
  return `<span style="--c:${color};--cg:rgba(${r},${g},${b},.5);display:inline-block">${LOGOS[area]||''}</span>`;
}

function buildingHTML(lv){
  const idx=content.levels.indexOf(lv);
  const prog=levelProgress(lv);
  const acc=accessOf(lv,idx);
  const state= prog.completed?'completed':(acc==='open'?'current':'locked');
  const st=areaStars(lv);
  const color=AREA_COLOR[lv.factoryArea]||lv.color;
  const area=lv.factoryArea;
  const [r,g,b]=hex2rgb(color);
  const cg=`rgba(${r},${g},${b},.5)`;
  const shape={control_room:'flat',console:'peak',workshop:'flat',edge_cabinet:'flat',cloud_platform:'flat',big_screen:'flat',data_pipe:'pipe',ai_lab:'dome'}[area]||'flat';
  const bh={control_room:'62px',console:'56px',workshop:'56px',edge_cabinet:'56px',cloud_platform:'62px',big_screen:'62px',data_pipe:'56px',ai_lab:'56px'}[area]||'56px';
  // 窗户随任务进度点亮：未做=暗，进行中=幕色微光，全通关=暖光闪烁
  const winDefs=(FACADES[area]||[]);
  const darks=winDefs.map((f,i)=>f.l==='dark'?i:-1).filter(i=>i>=0);
  const litN=Math.round(darks.length*(prog.pct/100));
  const wins=winDefs.map((f,i)=>{
    if(f.l==='dark'&&darks.indexOf(i)<litN){
      const lit=prog.completed?{l:'warm',a:'tw'}:{l:'glow',a:'flick'};
      return winHTML(Object.assign({},f,lit),i);
    }
    return winHTML(f,i);
  }).join('');
  const roof = shape==='peak' ? '<div class="b-roof roof-peak"></div>'
    : shape==='dome' ? '<div class="b-roof roof-dome"></div>'
    : shape==='pipe' ? '<div class="b-roof roof-pipe"></div>'
    : '<div class="b-roof roof-flat"></div>';
  const chimney = area==='workshop' ? '<div class="b-chimney"><i class="b-smoke"></i><i class="b-smoke s2"></i><i class="b-smoke s3"></i></div>' : '';
  const ant = (area==='control_room'||area==='big_screen') ? '<div class="b-ant"><i class="b-beacon"></i></div>' : '';
  const alarm = area==='edge_cabinet' ? '<div class="b-alarm"></div>' : '';
  const logo = logoHTML(area,color);
  const totalStar = Math.max(st.self||0, st.teacher||0);
  const order='①②③④⑤⑥⑦⑧'[idx];
  return `<div class="building ${state}" style="--c:${color};--cg:${cg};--bh:${bh}" onclick="openRoom('${lv.id}')">
    ${state==='current'?'<div class="b-go">▶ 从这里开始</div>':''}

function render(){
  const xp=me.salaryInfo?me.salaryInfo.xp:0;
  let rank=RANKS[0];
  for(const r of RANKS) if(xp>=r.min) rank=r;
  $('pName').textContent=me.name;
  $('pRank').textContent=rank.e+' '+rank.t;
  $('pXp').textContent=xp;
  $('pCoins').textContent=me.coins||0;

  $('isaArea').innerHTML = ISA_LAYERS.map((L,i)=>{
    const body=L.areas.map(a=>{ const lv=content.levels.find(l=>l.factoryArea===a); return lv?buildingHTML(lv):''; }).join('');
    const flow=i<ISA_LAYERS.length-1 ? `<div class="dataflow"><span class="df-label">↑ ${L.flow}</span><i class="df-pack p1"></i><i class="df-pack p2"></i><i class="df-pack p3"></i></div>` : '';

  }).join('');

  // 闯关路线条
  const nums=['①','②','③','④','⑤','⑥','⑦','⑧'];
  let curIdx=-1;
  content.levels.forEach((lv,i)=>{ if(!levelProgress(lv).completed && curIdx<0) curIdx=i; });
  $('routeBar').innerHTML='<span class="rb-title">闯关路线</span>'+content.levels.map((lv,i)=>{
    const done=levelProgress(lv).completed, cur=i===curIdx;
    return `<span class="rb-step ${done?'done':''} ${cur?'cur':''}">${nums[i]}${lv.areaName}</span>`+(i<7?'<span class="rb-arrow">→</span>':'');
  }).join('');

  // 返回庆祝：刚从任务页回来且刚完成一个任务
  try{
    const lc=JSON.parse(sessionStorage.getItem('lastCompleted')||'null');
    if(lc&&lc.title){ setTimeout(()=>showToast('✅ 已完成「'+lc.title+'」'+(lc.xp?'  +'+lc.xp+'XP':''), lc.color), 700); sessionStorage.removeItem('lastCompleted'); }
  }catch(e){}
  const doneCount=content.levels.filter(l=>levelProgress(l).completed).length;
  if(doneCount===0) $('npcBubble').textContent='厂长：沿 ①→⑧ 数字顺序闯关！从①中控室开始，一层层打通。';

}

const TASK_ICON={install_wizard:'🖥️',terminal:'⌨️',chain_quiz:'💬',quiz:'💬',fill_blank:'✍️',sort:'🔀',diagnosis_tree:'🩺',progress_bar:'📊',scenario_match:'🔗',code_review:'📝',ethics:'⚖️',drag_classify:'🗂️',boss_fight:'💥'};
function openRoom(id){
  const lv=content.levels.find(l=>l.id==id); if(!lv) return;

  const [r,g,b]=hex2rgb(color);

      ${taskHTML}

    </div>

}

<script>
zzfxV=.3; zzfxR=44100;
zzfxG=(q=1,k=.05,c=220,e=0,t=0,u=.1,r=0,F=1,v=0,z=0,w=0,A=0,l=0,B=0,x=0,G=0,d=0,y=1,m=0,C=0)=>{let b=2*Math.PI,H=v*=500*b/zzfxR**2,I=(0<x?1:-1)*b/4,D=c*=(1+2*k*Math.random()-k)*b/zzfxR,Z=[],g=0,E=0,a=0,n=1,J=0,K=0,f=0,p,h;e=99+zzfxR*e;m*=zzfxR;t*=zzfxR;u*=zzfxR;d*=zzfxR;z*=500*b/zzfxR**3;x*=b/zzfxR;w*=b/zzfxR;A*=zzfxR;l=zzfxR*l|0;for(h=e+m+t+u+d|0;a<h;Z[a++]=f)++K%(100*G|0)||(f=r?1<r?2<r?3<r?Math.sin((g%b)**3):Math.max(Math.min(Math.tan(g),1),-1):1-(2*g/b%2+2)%2:1-4*Math.abs(Math.round(g/b)-g/b):Math.sin(g),f=(l?1-C+C*Math.sin(2*Math.PI*a/l):1)*(0<f?1:-1)*Math.abs(f)**F*q*zzfxV*(a<e?a/e:a<e+m?1-(a-e)/m*(1-y):a<e+m+t?y:a<h-d?(h-a-d)/u*y:0),f=d?f/2+(d>a?0:(a<h-d?1:(h-a)/d)*Z[a-d|0]/2):f),p=(c+=v+=z)*Math.sin(E*x-I),g+=p-p*B*(1-1E9*(Math.sin(a)+1)%2),E+=p-p*B*(1-1E9*(Math.sin(a)**2+1)%2),n&&++n>A&&(c+=w,D+=w,n=0),!l||++J%l||(c=D,v=H,n=n||1);return Z}

const MUSIC_KEYS=['hub','control_room','console','workshop','edge_cabinet','cloud_platform','big_screen','data_pipe','ai_lab','tetris','mario','dkc','kirby','pokemon'];
let musCtx=null,musSrc=null,musGain=null,musOn=true,musIdx=0;
function musAudio(){ if(!musCtx){musCtx=new(window.AudioContext||window.webkitAudioContext)();} if(musCtx.state==='suspended')musCtx.resume(); return musCtx; }
function musPlay(k){
  if(!window.MUSIC_SONGS||!window.MUSIC_SONGS[k])return;
  try{
    const c=musAudio();
    if(musSrc){try{musSrc.stop();}catch(e){} musSrc=null;}

    if(!musGain){musGain=c.createGain();musGain.gain.value=.5;musGain.connect(c.destination);}
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.connect(musGain);src.start();musSrc=src;
  }catch(e){}
}
function musNext(){ musIdx=(musIdx+1)%MUSIC_KEYS.length; musPlay(MUSIC_KEYS[musIdx]); }
