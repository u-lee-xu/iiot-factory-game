<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>锐智工厂 · 厂区地图</title>
<style>
:root{
  --bg:#0b0e1a; --floor:#141a2e; --road:#1b2339; --roadline:#3a4568;
  --text:#e8eaf0; --dim:#9aa3bd; --amber:#ffb340; --green:#00e676; --red:#ff5252;
  --border:#2c3552;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;overflow-x:hidden}
/* ===== 登录 ===== */
#loginBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--bg)}
#loginBox.hide{display:none}
.login-card{width:min(340px,90vw);background:#121830;border:2px solid var(--border);padding:26px 22px;border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.5)}
.login-card h1{font-size:20px;color:var(--amber);letter-spacing:2px;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input{width:100%;background:#0a0e1c;border:2px solid var(--border);color:var(--text);font-family:inherit;font-size:15px;padding:9px 11px;outline:none}
.field input:focus{border-color:var(--amber)}
.btn{width:100%;padding:11px;font-size:15px;font-family:inherit;background:var(--amber);color:#1a1206;border:none;cursor:pointer;font-weight:bold;letter-spacing:2px}
.btn:hover{filter:brightness(1.1)}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;text-align:center}
.hint{font-size:11px;color:var(--dim);text-align:center;margin-top:14px}
/* ===== 主界面 ===== */
#mapApp{display:none}
#mapApp.show{display:block}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#10162a;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:20}
.brand{font-size:17px;color:var(--amber);letter-spacing:2px;font-weight:bold}
.brand small{font-size:10px;color:var(--dim);display:block;letter-spacing:0}
.player{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.pill{background:#0a0e1c;border:1px solid var(--border);padding:4px 10px;border-radius:3px;color:var(--text)}
.pill b{color:var(--amber)}
.back{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--border);padding:5px 9px;border-radius:3px}
.back:hover{color:var(--amber);border-color:var(--amber)}
/* ===== 厂区 ===== */
#map{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:14px 12px 36px}
.compound{position:relative;border:2px solid #223050;border-radius:10px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(30,50,95,.18), transparent 60%),
    linear-gradient(180deg,#0d1226,#0a0e1c)}
/* 厂区入口 */
.entrance{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 14px 12px;background:linear-gradient(180deg,rgba(255,179,64,.06),transparent)}

.gate{position:relative;width:min(420px,80vw);height:26px;margin:6px auto 0;border-top:2px solid #3a4568;border-bottom:2px solid #3a4568;background:rgba(20,26,46,.6)}
.gate::before{content:"";position:absolute;left:0;top:-4px;bottom:-4px;width:6px;background:linear-gradient(180deg,#56617e,#2a3040);border:2px solid #0a0d18}
.gate::after{content:"";position:absolute;right:0;top:-4px;bottom:-4px;width:6px;background:linear-gradient(180deg,#56617e,#2a3040);border:2px solid #0a0d18}
.gate .bar{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:6px;
  background:repeating-linear-gradient(90deg,#3a4568 0 8px,transparent 8px 12px);border:1px solid #0a0d18;opacity:.7}

.npc{display:flex;align-items:center;gap:10px;background:#121830;border:2px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:0 0 16px rgba(255,179,64,.18)}
.npc .npc-sprite{font-size:30px;filter:drop-shadow(0 0 8px rgba(255,179,64,.4));animation:npcBob 2.2s ease-in-out infinite}
.npc .bubble{font-size:12px;color:var(--amber);max-width:230px;line-height:1.5}
@keyframes npcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 主干道 */
.road{position:relative;margin:10px 0;height:30px}
.road-h{position:absolute;top:50%;left:0;right:0;height:16px;background:var(--road);border-top:2px solid var(--roadline);border-bottom:2px solid var(--roadline);transform:translateY(-50%)}
.road-h::before{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,rgba(255,179,64,.8) 0 12px,transparent 12px 24px);transform:translateY(-50%);animation:flow 1.1s linear infinite}
.road-h::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(100,200,255,.7) 0 6px,transparent 6px 18px);animation:flow .9s linear infinite reverse;opacity:.4}
@keyframes flow{to{background-position:24px 0}}
.walker{position:absolute;top:50%;z-index:5;font-size:16px;transform:translateY(-50%);animation:walkX 16s linear infinite}
.walker.w2{animation-duration:20s;animation-delay:3s;font-size:14px}
@keyframes walkX{0%{left:2%;transform:translateY(-50%) scaleX(1)}48%{left:96%;transform:translateY(-50%) scaleX(1)}50%{left:96%;transform:translateY(-50%) scaleX(-1)}98%{left:2%;transform:translateY(-50%) scaleX(-1)}100%{left:2%;transform:translateY(-50%) scaleX(1)}}
.walker.w3{animation-duration:24s;animation-delay:5s;font-size:13px}
.forklift{position:absolute;top:50%;z-index:5;font-size:18px;transform:translateY(-50%);animation:forkX 34s linear infinite}
@keyframes forkX{0%{left:-4%;transform:translateY(-50%) scaleX(1)}45%{left:96%;transform:translateY(-50%) scaleX(1)}50%{left:96%;transform:translateY(-50%) scaleX(-1)}95%{left:-4%;transform:translateY(-50%) scaleX(-1)}100%{left:-4%;transform:translateY(-50%) scaleX(1)}}
.wcar{position:absolute;top:50%;z-index:5;font-size:15px;transform:translateY(-50%);animation:wcarX 18s linear infinite}
@keyframes wcarX{0%{left:96%;transform:translateY(-50%) scaleX(1)}46%{left:2%;transform:translateY(-50%) scaleX(1)}50%{left:2%;transform:translateY(-50%) scaleX(-1)}96%{left:96%;transform:translateY(-50%) scaleX(-1)}100%{left:96%;transform:translateY(-50%) scaleX(1)}}
/* 生产区 */
.zone{position:relative;background:rgba(10,14,28,.42);border:1px solid #223050;border-radius:8px;padding:14px 10px 10px;margin:0 0 8px}
.zone-tag{position:absolute;top:-9px;left:14px;font-size:10px;color:var(--dim);background:#0b0e1a;border:1px solid var(--border);padding:2px 10px;border-radius:10px;letter-spacing:2px}
.zone-tag b{color:var(--amber)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
/* 中心广场 */
.plaza{display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:4px 0 8px;padding:12px 0;background:linear-gradient(180deg,transparent,rgba(0,229,118,.04),transparent);border-radius:8px}
.flag{font-size:24px;animation:flagWave 2.4s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* 配套设施区（像素风设施楼） */
.fac-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;align-items:start}
.fac-cell{text-align:center;cursor:pointer;padding:8px 2px;border-radius:8px;background:rgba(10,14,28,.35);border:1px solid transparent}
.fac-cell:hover{border-color:var(--amber)}
.fac-cell .fac-sub{font-size:9px;color:var(--dim);margin-top:3px;line-height:1.5}
.fac-cell .fac-sub em{color:var(--green);font-style:normal}
/* 游戏房：门前条纹雨棚 */
.b-awning{position:absolute;left:-2px;right:-2px;top:2px;height:6px;z-index:2;background:repeating-linear-gradient(90deg,#ff5252 0 6px,#f2f2f2 6px 12px);border:1px solid #04060c;border-bottom:none;box-shadow:0 0 6px rgba(255,82,82,.4)}
/* 休息区 · 凉亭 */
.pavilion{position:relative;width:88px;height:54px;margin:0 auto}
.pv-roof{position:absolute;left:8px;right:8px;top:0;height:12px;background:linear-gradient(180deg,#2b3454,#181e36);border:2px solid #04060c;clip-path:polygon(2% 0,98% 0,86% 100%,14% 100%)}
.pv-roof::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#00e676;box-shadow:0 0 6px rgba(0,230,118,.5)}
.pv-post{position:absolute;top:10px;bottom:8px;width:3px;background:#3a4560;border:1px solid #04060c}
.pv-post.p1{left:16px}
.pv-post.p2{right:16px}
.pv-bench{position:absolute;left:26px;right:26px;bottom:4px;height:5px;background:#5a5f6e;border:1px solid #04060c;border-radius:2px}
.pv-bench::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-6px;width:10px;height:6px;background:#6b7180;border:1px solid #04060c;border-radius:2px 2px 0 0}
.pv-bench::after{content:"";position:absolute;left:-8px;top:-11px;width:9px;height:11px;background:radial-gradient(circle at 35% 30%,#3fd97f,#1f9d57 75%);border:1px solid #04140b;border-radius:50% 50% 4px 4px}
/* 停车场 */
.parking{position:relative;width:88px;height:54px;margin:0 auto;background:#151b2e;border:2px solid #2a3852;border-radius:4px}
.parking::before{content:"";position:absolute;inset:8px 6px;background:repeating-linear-gradient(90deg,transparent 0 14px,#3a4568 14px 16px,transparent 16px 30px);opacity:.4}
.parking .pk-pole{position:absolute;left:8px;top:8px;width:2px;height:12px;background:#3a4560;border:1px solid #04060c}
.parking .pk-arm{position:absolute;left:10px;top:8px;width:14px;height:2px;background:#ff5252;transform-origin:left;animation:armUp 4s ease-in-out infinite}
@keyframes armUp{0%,8%,30%,100%{transform:rotate(0)}12%,24%{transform:rotate(58deg)}}
.pk-car{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;opacity:0;will-change:left}
.pk-car.cA{animation:carA 11s linear infinite;transform:translateY(-50%) scaleX(-1)}
.pk-car.cB{animation:carB 13s linear infinite 2.5s;font-size:13px}
@keyframes carA{0%{left:-26px;opacity:0}9%{opacity:1}24%{left:26px}30%{left:26px}52%{left:26px}74%{left:62px}92%{left:112px;opacity:1}100%{left:118px;opacity:0}}
@keyframes carB{0%{left:112px;opacity:0}9%{opacity:1}24%{left:62px}52%{left:62px}74%{left:26px}92%{left:-22px;opacity:1}100%{left:-28px;opacity:0}}
/* 像素树 */
.p-tree{position:relative;display:inline-block;width:18px;height:22px}
.p-tree .pt-trunk{position:absolute;left:7px;bottom:0;width:4px;height:8px;background:#6b4a2b;border:1px solid #04060c}
.p-tree .pt-top{position:absolute;left:2px;top:0;width:14px;height:14px;background:radial-gradient(circle at 35% 30%,#3fd97f,#1f9d57 72%);border:1px solid #04140b;border-radius:50% 50% 45% 45%;box-shadow:0 0 6px rgba(31,157,87,.3)}
/* 路灯 */
.p-lamp{position:relative;display:inline-block;width:8px;height:26px}
.p-lamp .pl-pole{position:absolute;left:3px;top:0;bottom:0;width:2px;background:#3a4560;border:1px solid #04060c}
.p-lamp .pl-head{position:absolute;left:0;top:0;width:8px;height:4px;background:#ffd98a;border-radius:4px 4px 1px 1px;box-shadow:0 0 9px #ffd98a;animation:blink 2.6s ease-in-out infinite}
.road .p-lamp{position:absolute;top:1px;z-index:4}
.road .lamp-l{left:14px}
.road .lamp-r{right:14px}
/* 水塔 */
.water-tower{position:relative;width:34px;height:46px;display:inline-block}
.wt-legs{position:absolute;left:4px;right:4px;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#2a3040 0 4px,transparent 4px 6px)}
.wt-tank{position:absolute;left:6px;right:6px;top:10px;height:20px;background:linear-gradient(180deg,#465170,#2a3248);border:2px solid #04060c;border-radius:6px 6px 2px 2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}
.wt-tank::after{content:"";position:absolute;left:2px;right:2px;top:8px;height:2px;background:#ff9800;opacity:.55}
.wt-roof{position:absolute;left:4px;right:4px;top:0;height:12px;background:linear-gradient(180deg,#2b3454,#181e36);border:2px solid #04060c;clip-path:polygon(50% 0,100% 100%,0 100%)}
/* 储罐 */
.tanks{display:inline-flex;gap:6px;align-items:flex-end}
.tk{position:relative;width:16px;height:24px;background:linear-gradient(180deg,#3a4560,#1c2438);border:2px solid #04060c;border-radius:8px 8px 2px 2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}
.tk::after{content:"";position:absolute;left:2px;right:2px;top:8px;height:2px;background:#ff9800;opacity:.5}
.tk.tk2{height:19px}
/* 喷泉 */
.fountain{position:relative;width:48px;height:36px;display:inline-block}
.f-basin{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(180deg,#1e2a4a,#0e1428);border:2px solid #2a3852;border-radius:50%}
.f-basin::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:2px;background:#4fd6ff;opacity:.7;border-radius:50%}
.f-spout{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:4px;height:16px;background:#2a3852;border:1px solid #04060c}
.f-water{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:3px;height:8px;background:linear-gradient(180deg,#7deaff,#4fd6ff);border-radius:50% 50% 0 0;opacity:.85;animation:fountain 2.2s ease-in-out infinite}
@keyframes fountain{0%,100%{height:6px;opacity:.5}50%{height:12px;opacity:1}}
/* 花坛 */
.flowerbed{position:relative;display:inline-block;width:18px;height:9px;background:linear-gradient(180deg,#7a5a2e,#4a3416);border:1px solid #04060c;border-radius:2px}
.flowerbed::before{content:"";position:absolute;left:3px;top:-4px;width:4px;height:4px;background:#ff6d9c;border-radius:50%}
.flowerbed::after{content:"";position:absolute;right:4px;top:-3px;width:3px;height:3px;background:#ffd400;border-radius:50%}
/* 动力站区 */
.utility-zone{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0 4px;padding:10px 14px;background:rgba(10,14,28,.35);border:1px dashed #2a3852;border-radius:8px}
.utility-zone .ut-label{font-size:10px;color:var(--dim);letter-spacing:3px}
/* 设施 Logo */
.lg-ctrl .lgc-body{position:absolute;left:1px;top:2px;width:18px;height:4px;background:var(--c);border-radius:2px;box-shadow:0 0 6px var(--cg)}
.lg-ctrl .lgc-btn{position:absolute;width:2px;height:2px;border-radius:50%;background:#0a0e1c}
.lg-ctrl .lgc-btn.b1{left:5px;top:3px}
.lg-ctrl .lgc-btn.b2{right:5px;top:3px}
.lg-flask .lgf-neck{position:absolute;left:9px;top:0;width:3px;height:3px;border:1px solid var(--c);border-bottom:none}
.lg-flask .lgf-body{position:absolute;left:6px;top:2px;width:10px;height:6px;border:1px solid var(--c);border-radius:0 0 5px 5px}
.lg-flask .lgf-liquid{position:absolute;left:7px;bottom:1px;width:8px;height:3px;background:var(--c);box-shadow:0 0 4px var(--cg);border-radius:0 0 4px 4px}
/* 商城 · 硬币 */
.lg-coin .c-body{position:absolute;left:5px;top:1px;width:10px;height:8px;background:radial-gradient(circle at 35% 35%,#ffe082,#ffb300 72%);border:1px solid #04060c;border-radius:50%;box-shadow:0 0 6px rgba(255,179,0,.65)}
.lg-coin .c-hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:3px;border-radius:50%;background:#5a3e00;opacity:.85}
/* 伸缩门开关（有车进出） */
.gate .bar{animation:gateSlide 9s ease-in-out infinite}
@keyframes gateSlide{0%,55%,100%{transform:translateY(-50%) scaleX(1);opacity:.65}64%,88%{transform:translateY(-50%) scaleX(.25);opacity:1}}
/* 信号灯塔：红白条纹圆锥塔 + 玻璃灯房 + 旋转光束 + 红信标 */
.signal-tower{position:absolute;left:-22px;bottom:-2px;width:24px;height:72px;pointer-events:none;z-index:3}
/* 塔身：圆锥台（上窄下宽），红白条纹 */
.st-body{position:absolute;left:4px;right:4px;top:28px;bottom:0;
  background:repeating-linear-gradient(0deg,#f0f0f0 0 9px,#e04848 9px 18px);
  clip-path:polygon(22% 0, 78% 0, 100% 100%, 0 100%);
  border:1px solid #04060c;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
/* 玻璃灯房：带发光灯泡 */
.st-lantern{position:absolute;left:6px;right:6px;top:19px;height:12px;
  background:linear-gradient(180deg,#30384e,#1a2238);
  border:2px solid #04060c;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.st-lantern::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#fff3c4;box-shadow:0 0 12px #ffe9a8;animation:blink 1.2s infinite}
/* 灯房锥顶 */
.st-roof{position:absolute;left:3px;right:3px;top:13px;height:8px;background:linear-gradient(180deg,#3a4560,#20283c);border:2px solid #04060c;clip-path:polygon(0 100%,50% 0,100% 100%)}
/* 旋转光束（从灯房射出） */
.st-beam{position:absolute;left:50%;top:25px;width:44px;height:46px;transform-origin:50% 0;
  background:conic-gradient(from 90deg at 50% 0,transparent 10deg,rgba(255,230,120,.15) 40deg,transparent 70deg);
  animation:stSweep 6s ease-in-out infinite}
@keyframes stSweep{0%,100%{transform:rotate(-34deg);opacity:.7}50%{transform:rotate(34deg);opacity:1}}
/* 塔尖红信标 */
.st-beacon{position:absolute;left:50%;transform:translateX(-50%);top:7px;width:4px;height:4px;border-radius:50%;background:#ff5252;box-shadow:0 0 9px #ff5252;animation:blink 1s infinite}
/* 水塔滴水 + 警示灯 */
.water-tower .wt-drop{position:absolute;left:50%;top:30px;width:2px;height:3px;background:#7deaff;border-radius:50% 50% 2px 2px;opacity:0;animation:wtDrip 3s ease-in infinite}
@keyframes wtDrip{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(16px);opacity:0}}
.wt-tank::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-4px;width:4px;height:4px;border-radius:50%;background:#ff6d00;box-shadow:0 0 6px #ff6d00;animation:blink 1.4s infinite}
/* 储罐指示灯 */
.tk::before{content:"";position:absolute;left:6px;top:-3px;width:3px;height:3px;border-radius:50%;background:#ff5252;animation:blink 2s infinite}
/* 天空小鸟 */
.sky-bird{position:absolute;color:#9aa3bd;font-size:10px;z-index:3;pointer-events:none;animation:fly 42s linear infinite}
.sky-bird.b2{top:13%;animation-duration:55s;animation-delay:9s;font-size:8px}
@keyframes fly{from{left:-24px}to{left:104%}}
/* 无人机 */
.drone{position:absolute;top:6%;left:110%;z-index:3;width:22px;height:10px;pointer-events:none;animation:droneX 34s linear infinite}
@keyframes droneX{to{left:-14%}}
.dr-body{position:absolute;left:6px;top:3px;width:10px;height:4px;background:#2a3852;border:1px solid #04060c;border-radius:2px}
.dr-rotor{position:absolute;left:4px;top:0;width:6px;height:2px;background:#4a5570;border:1px solid #04060c;animation:spin .18s linear infinite}
.dr-rotor.r2{left:13px}
@keyframes spin{from{transform:scaleX(1)}50%{transform:scaleX(.3)}to{transform:scaleX(1)}}
.dr-light{position:absolute;left:14px;top:1px;width:2px;height:2px;border-radius:50%;background:#ff5252;box-shadow:0 0 5px #ff5252;animation:blink .5s infinite}
/* 无人机航线光点 */
.drone-path{position:absolute;top:7%;left:0;right:0;height:2px;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(120,200,255,.5) 0 6px,transparent 6px 16px);opacity:.3;animation:pathPulse 2.4s ease-in-out infinite}
@keyframes pathPulse{0%,100%{opacity:.22}50%{opacity:.5}}
/* 探照灯 */
.searchlight{position:absolute;left:10px;bottom:8px;width:70px;height:100px;z-index:4;pointer-events:none}
.sl-beam{position:absolute;left:50%;bottom:0;width:34px;height:120px;transform-origin:50% 100%;background:conic-gradient(from 90deg at 50% 100%,transparent 8deg,rgba(255,240,180,.08) 40deg,transparent 78deg);animation:slSweep 15s ease-in-out infinite}
@keyframes slSweep{0%,100%{transform:rotate(-42deg);opacity:.55}50%{transform:rotate(42deg);opacity:1}}
/* 风车 */
.windmill{position:relative;width:30px;height:46px;display:inline-block}
.wm-pole{position:absolute;left:13px;top:10px;bottom:0;width:3px;background:repeating-linear-gradient(180deg,#3a4560 0 4px,#20283c 4px 6px);border:1px solid #04060c}
.wm-rotor{position:absolute;left:12px;top:4px;width:6px;height:6px;animation:spin3 3.6s linear infinite}
.wm-blade{position:absolute;left:2px;top:-12px;width:2px;height:14px;background:#cfe3ff;border:1px solid #04060c;transform-origin:50% 100%;opacity:.9}
.wm-blade.b1{transform:rotate(0deg)}
.wm-blade.b2{transform:rotate(120deg)}
.wm-blade.b3{transform:rotate(240deg)}
.wm-hub{position:absolute;left:1px;top:1px;width:4px;height:4px;border-radius:50%;background:#56617e;border:1px solid #04060c;z-index:2}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* ===== 新建筑（工业骨架+赛博皮肤）===== */
.building{--c:#00bcd4;--cg:rgba(0,188,212,.5);--sh:74px;--bh:56px;
  text-align:center;cursor:pointer;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.building .b-sprite{position:relative;width:84px;height:var(--sh);margin:0 auto;image-rendering:pixelated}
.b-shadow{position:absolute;bottom:-6px;left:6px;right:6px;height:8px;background:rgba(0,0,0,.5);border-radius:50%;filter:blur(1px);pointer-events:none}
.b-body{position:absolute;left:6px;right:6px;bottom:0;height:var(--bh);
  background:
    linear-gradient(90deg, rgba(0,0,0,.5), transparent 15%, transparent 85%, rgba(0,0,0,.5)),
    repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 2px, transparent 2px 5px),
    linear-gradient(180deg,#242d4d 0%,#161c34 60%,#0b1020 100%);
  box-shadow:inset 0 0 0 2px #04060c, inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -4px 0 rgba(0,0,0,.35), 0 0 12px var(--cg)}
.b-wall{position:absolute;inset:0}
.b-wall::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 2px, transparent 2px 9px);opacity:.45}
.b-ribs{position:absolute;inset:0;background:repeating-linear-gradient(90deg, transparent 0 15px, rgba(0,0,0,.4) 15px 17px)}
.b-base{position:absolute;left:0;right:0;bottom:0;height:calc(var(--bh) - 46px);background:repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 10px, transparent 10px 12px),linear-gradient(180deg,#12182e,#0a0e1c);border-top:2px solid #04060c}
.b-side{position:absolute;right:-4px;top:2px;bottom:2px;width:4px;background:linear-gradient(180deg,#1c2440,#0a0e1c);border:1px solid #04060c;z-index:1}
.b-pipe{position:absolute;left:1px;top:calc(var(--sh) - var(--bh) - 8px);bottom:0;width:6px;z-index:2;background:repeating-linear-gradient(180deg,#4a5570 0 5px,#222a40 5px 7px);border:1px solid #04060c}
.b-pipe::before{content:"";position:absolute;left:-2px;top:10px;width:9px;height:3px;background:#3a4560;border:1px solid #04060c}
.b-pipe::after{content:"";position:absolute;left:-2px;top:26px;width:9px;height:3px;background:#3a4560;border:1px solid #04060c}
.b-win{position:absolute;background:#0a0e1c;border:1px solid #04060c}
.b-win.sq{border-radius:1px}
.b-win.round{border-radius:50%}
.b-win.strip{border-radius:1px}
.b-win.slit{border-radius:1px}
.b-win.grill{border-radius:1px;background:repeating-linear-gradient(90deg,#0a0e1c 0 4px,#1c2440 4px 6px)}
.b-win.screen{border-radius:2px;border:2px solid #04060c}
.b-win.dark{background:#0a0e1c}
.b-win.warm{background:#ffd98a;box-shadow:0 0 5px rgba(255,217,138,.9)}
.b-win.cy{background:#c9f2ff;box-shadow:0 0 6px var(--cg)}
.b-win.red{background:#ff7a7a;box-shadow:0 0 6px rgba(255,80,80,.95)}
.b-win.glow{background:var(--c);box-shadow:0 0 8px var(--cg)}
.b-win.tw{animation:winTw 3.2s ease-in-out infinite}
.b-win.flick{animation:flick .55s steps(2,end) infinite}
.b-win.breath{animation:breath 2.6s ease-in-out infinite}
@keyframes winTw{0%,100%{filter:brightness(1)}45%{filter:brightness(.55)}60%{filter:brightness(1.2)}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.12}}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.4}}
.b-door{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:14px;height:9px;z-index:2;background:#04060c;border:1px solid var(--c);box-shadow:0 0 6px var(--cg)}
.b-roof{position:absolute;left:3px;right:3px;background:linear-gradient(180deg,#2b3454,#181e36);border:2px solid #04060c}
.b-roof::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--c);box-shadow:0 0 8px var(--cg);animation:neonPulse 2.6s ease-in-out infinite}
.roof-flat{top:calc(var(--sh) - var(--bh) - 8px);height:8px}
.roof-peak{top:calc(var(--sh) - var(--bh) - 20px);height:20px;clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:none}
.roof-dome{top:calc(var(--sh) - var(--bh) - 16px);height:16px;border-radius:50% 50% 0 0}
.roof-pipe{top:calc(var(--sh) - var(--bh) - 16px);height:16px}
@keyframes neonPulse{0%,100%{opacity:1}50%{opacity:.55}}
.b-sign{position:absolute;top:calc(var(--sh) - var(--bh) + 1px);left:50%;transform:translateX(-50%);width:24px;height:8px;background:rgba(4,6,12,.9);border:1px solid var(--c);border-radius:1px;box-shadow:0 0 9px var(--cg), inset 0 0 3px var(--cg);display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1;animation:neonPulse 2.2s ease-in-out infinite;z-index:3}
.b-chimney{position:absolute;left:16px;top:calc(var(--sh) - var(--bh) - 24px);width:13px;height:16px;background:repeating-linear-gradient(180deg,#3a4560 0 4px,#1c2438 4px 6px);border:2px solid #04060c}
.b-chimney::before{content:"";position:absolute;top:-3px;left:-2px;width:13px;height:3px;background:var(--c);box-shadow:0 0 6px var(--cg)}
.b-chimney::after{content:"";position:absolute;bottom:3px;left:-2px;width:13px;height:3px;background:rgba(255,255,255,.13)}
.b-chimney{overflow:visible}
.b-smoke{position:absolute;top:-12px;left:-3px;width:9px;height:9px;border-radius:50%;background:rgba(190,200,215,.5);opacity:0;animation:smoke 3s ease-out infinite}
.b-smoke.s2{left:4px;animation-delay:1.2s}
.b-smoke.s3{left:0;animation-delay:2.1s}
@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:.55}100%{transform:translateY(-34px) scale(1.8);opacity:0}}
.b-ant{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sh) - var(--bh) - 32px);width:3px;height:26px;background:linear-gradient(180deg,#4a5570,#1c2438);border:1px solid #04060c}
.b-beacon{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--cg);animation:blink 1.1s infinite}
.b-scan{position:absolute;left:4px;right:4px;top:-74px;height:16px;pointer-events:none;background:linear-gradient(180deg, transparent, rgba(255,255,255,.06) 45%, transparent);animation:scanSweep 6s linear infinite;opacity:0}
@keyframes scanSweep{0%{transform:translateY(0);opacity:0}6%{opacity:1}55%{opacity:1}72%{opacity:0}100%{transform:translateY(156px);opacity:0}}
.b-baseglow{position:absolute;left:2px;right:2px;bottom:-4px;height:9px;pointer-events:none;background:radial-gradient(ellipse at center, var(--cg) 0%, transparent 70%);animation:neonPulse 3s ease-in-out infinite}
.b-label{margin-top:6px;font-size:12px;color:var(--text);line-height:1.2}
.b-label .icon{display:block;font-size:14px;margin-bottom:1px}
.b-stars{font-size:10px;color:var(--dim);margin-top:2px}
/* 状态 */
.building.locked .b-sprite{filter:grayscale(1) brightness(.5)}
.building.locked .b-label{opacity:.6}
.building.locked::after{content:"🔒";position:absolute;top:-2px;right:calc(50% - 50px);font-size:14px;z-index:6;filter:none}
.building.current .b-label{color:var(--amber);font-weight:bold}
.building.current .b-sprite{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px var(--c))}50%{filter:drop-shadow(0 0 12px var(--c))}}
.building.completed .b-label{color:var(--green)}
.building.completed::after{content:"✓";position:absolute;top:-4px;right:calc(50% - 48px);color:var(--green);font-size:14px;font-weight:bold;z-index:6}
.building:hover .b-sprite{transform:translateY(-3px)}
.building:active .b-sprite{transform:translateY(0)}
/* ===== 8 栋楼专属像素 Logo ===== */
.b-logo{position:relative;width:20px;height:8px;display:inline-block;vertical-align:middle;flex:none}
.lg-term .lt-screen{position:absolute;left:1px;top:0;width:18px;height:8px;background:#04060c;border:1px solid var(--c);box-shadow:0 0 5px var(--cg);border-radius:1px}
.lg-term .lt-line{position:absolute;left:3px;height:1px;background:var(--c);box-shadow:0 0 3px var(--cg)}
.lg-term .lt-line.l1{top:2px;width:12px}
.lg-term .lt-line.l2{top:4px;width:7px}
.lg-term .lt-line.l3{top:6px;width:10px}
.lg-console .lc-body{position:absolute;left:2px;top:1px;width:16px;height:6px;background:#0a0e1c;border:1px solid var(--c);border-radius:1px;box-shadow:0 0 5px var(--cg)}
.lg-console .lc-btn{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--c);box-shadow:0 0 4px var(--cg)}
.lg-console .lc-btn.b1{left:4px;top:3px}
.lg-console .lc-btn.b2{left:8px;top:3px}
.lg-console .lc-knob{position:absolute;left:13px;top:2px;width:2px;height:4px;background:var(--c);box-shadow:0 0 3px var(--cg)}
.lg-gear .lg-hub{position:absolute;left:7px;top:1px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--cg)}
.lg-gear .lg-tooth{position:absolute;background:var(--c);box-shadow:0 0 3px var(--cg)}
.lg-gear .lg-tooth.t1{left:9px;top:0;width:2px;height:3px}
.lg-gear .lg-tooth.t2{left:9px;bottom:0;width:2px;height:3px}
.lg-gear .lg-tooth.t3{left:5px;top:3px;width:3px;height:2px}
.lg-gear .lg-tooth.t4{right:5px;top:3px;width:3px;height:2px}
.lg-cabinet .lcab-body{position:absolute;left:2px;top:0;width:12px;height:8px;background:#0a0e1c;border:1px solid var(--c);box-shadow:0 0 5px var(--cg)}
.lg-cabinet .lcab-led{position:absolute;left:6px;top:1px;width:3px;height:2px;background:var(--c);box-shadow:0 0 4px var(--cg);animation:flick .6s steps(2,end) infinite}
.lg-cabinet .lcab-vents{position:absolute;left:4px;bottom:1px;width:8px;height:1px;background:repeating-linear-gradient(90deg,var(--c) 0 1px,transparent 1px 2px);opacity:.8}
.lg-cloud .lcl-b{position:absolute;background:var(--c);box-shadow:0 0 5px var(--cg)}
.lg-cloud .lcl-b.b1{left:2px;top:4px;width:6px;height:3px;border-radius:2px}
.lg-cloud .lcl-b.b2{left:6px;top:2px;width:6px;height:5px;border-radius:3px 3px 0 0}
.lg-cloud .lcl-b.b3{left:11px;top:4px;width:6px;height:3px;border-radius:2px}
.lg-cloud .lcl-drop{position:absolute;left:17px;top:1px;width:2px;height:2px;background:#fff;opacity:.85;animation:drop 1.6s ease-in infinite}
@keyframes drop{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(4px);opacity:.3}}
.lg-chart .lch-body{position:absolute;left:1px;top:0;width:18px;height:8px;background:#04060c;border:1px solid var(--c);box-shadow:0 0 5px var(--cg)}
.lg-chart .lch-bar{position:absolute;bottom:1px;width:3px;background:var(--c);box-shadow:0 0 4px var(--cg);animation:breath 2.4s ease-in-out infinite}
.lg-chart .lch-bar.b1{left:3px;height:3px}
.lg-chart .lch-bar.b2{left:9px;height:5px}
.lg-chart .lch-bar.b3{left:15px;height:7px}
.b-pipe-logo{position:relative;width:20px;height:8px;display:inline-block;vertical-align:middle;flex:none}
.b-pipe-logo .pl-pipe{position:absolute;left:1px;right:1px;top:50%;transform:translateY(-50%);height:4px;background:linear-gradient(180deg,#465170,#262e44);border:1px solid #04060c;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), 0 0 6px var(--cg)}
.b-pipe-logo .pl-pipe::before,.b-pipe-logo .pl-pipe::after{content:"";position:absolute;top:-2px;bottom:-2px;width:3px;background:linear-gradient(180deg,#56617e,#30384e);border:1px solid #04060c}
.b-pipe-logo .pl-pipe::before{left:-3px}
.b-pipe-logo .pl-pipe::after{right:-3px}
.b-pipe-logo .pl-dot{position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--cg);transform:translateY(-50%);animation:plFlow 1.5s linear infinite;opacity:0}
.b-pipe-logo .pl-dot.d2{animation-delay:.5s}
.b-pipe-logo .pl-dot.d3{animation-delay:1s}
@keyframes plFlow{0%{left:2px;opacity:0}12%{opacity:1}85%{opacity:1}100%{left:15px;opacity:0}}
.lg-chip .lchp-body{position:absolute;left:5px;top:1px;width:10px;height:8px;background:#0a0e1c;border:1px solid var(--c);box-shadow:0 0 5px var(--cg)}
.lg-chip .lchp-core{position:absolute;left:8px;top:3px;width:4px;height:4px;background:var(--c);box-shadow:0 0 6px var(--cg);animation:breath 2s ease-in-out infinite}
.lg-chip .lchp-pin{position:absolute;background:var(--c);width:2px;height:2px}
.lg-chip .lchp-pin.p1{left:6px;top:-1px}
.lg-chip .lchp-pin.p2{left:12px;top:-1px}
.lg-chip .lchp-pin.p3{left:6px;bottom:-1px}
.lg-chip .lchp-pin.p4{left:12px;bottom:-1px}
/* ===== 氛围背景 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-sky{position:absolute;inset:0;background:linear-gradient(180deg,#04060f 0%,#070c1f 38%,#0e1730 65%,#1a2340 100%)}
.bg-stars{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1px 1px at 42% 22%,#ffd,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 67% 25%,#cfe,transparent),radial-gradient(1px 1px at 78% 9%,#fff,transparent),radial-gradient(1px 1px at 88% 20%,#ffe,transparent),radial-gradient(1px 1px at 8% 32%,#fff,transparent),radial-gradient(1px 1px at 93% 30%,#fff,transparent),radial-gradient(1px 1px at 35% 30%,#fff,transparent);
  animation:starTw 4s ease-in-out infinite}
@keyframes starTw{0%,100%{opacity:.6}50%{opacity:1}}
.bg-moon{position:absolute;top:8%;right:12%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d9d2a8 55%,#b8b18a);box-shadow:0 0 40px 12px rgba(255,240,180,.18)}
.bg-clouds{position:absolute;background:rgba(30,45,80,.28);border-radius:40px;filter:blur(2px)}
.bg-clouds.c1{width:220px;height:26px;top:16%;left:-240px;animation:drift 60s linear infinite}
.bg-clouds.c2{width:150px;height:20px;top:27%;left:-170px;animation:drift 80s linear infinite 12s;opacity:.7}
.bg-clouds::before,.bg-clouds::after{content:"";position:absolute;border-radius:50%;background:inherit}
.bg-clouds::before{width:70px;height:50px;top:-26px;left:24px}
.bg-clouds::after{width:50px;height:40px;top:-18px;left:90px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 400px))}}
/* ===== 信息弹窗 ===== */
#popup{position:fixed;inset:0;background:rgba(4,6,12,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#popup.show{display:flex}
.pop-card{width:min(380px,92vw);background:#121830;border:2px solid var(--border);border-radius:6px;padding:20px;max-height:82vh;overflow:auto}
.pop-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pop-head .big{font-size:36px}
.pop-head .t{flex:1}
.pop-head .t h2{font-size:18px;color:var(--text);margin-bottom:2px}
.pop-head .t .lvl{font-size:12px;color:var(--dim)}
.pop-close{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer}
.pop-narr{font-size:13px;color:var(--dim);line-height:1.6;border-left:3px solid var(--amber);padding-left:10px;margin:10px 0}
.prog{font-size:12px;color:var(--dim);margin:10px 0}
.prog-bar{height:10px;background:#0a0e1c;border:1px solid var(--border);margin-top:4px}
.prog-fill{height:100%;background:var(--c,var(--amber));width:0%}
.stars-row{font-size:13px;color:var(--dim);margin:8px 0}
.stars-row b{color:var(--amber)}
.games{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.game-chip{font-size:12px;background:#0a0e1c;border:1px solid var(--border);padding:4px 9px;border-radius:3px;color:var(--text)}
.pop-enter{width:100%;padding:12px;font-size:15px;font-family:inherit;background:var(--c,var(--amber));color:#111;border:none;cursor:pointer;font-weight:bold;letter-spacing:2px;margin-top:6px}
.pop-enter:hover{filter:brightness(1.12)}
.pop-tip{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}
.foot{text-align:center;font-size:11px;color:var(--dim);padding:14px 0 20px;letter-spacing:1px}
/* ===== ISA-95 数据流转层次 ===== */
.isa-layer{position:relative;background:rgba(10,14,28,.45);border:1px solid #223050;border-radius:8px;padding:18px 10px 12px;margin:0 0 4px}
.isa-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:#0b0e1a;border:1px solid var(--border);padding:2px 12px;border-radius:12px;white-space:nowrap;z-index:2}
.isa-tag .ilv{font-size:11px;font-weight:bold;color:#1a1206;background:var(--amber);padding:1px 7px;border-radius:8px}
.isa-tag b{font-size:12px;color:var(--text)}
.isa-tag em{font-size:9px;color:var(--dim);font-style:normal;letter-spacing:1px}
.isa-layer .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 8px}
/* 层间数据流（自下而上） */
.dataflow{display:flex;align-items:center;justify-content:center;gap:6px;height:28px;margin:6px 0 12px;position:relative}
.dataflow .df-label{font-size:9px;color:#4fd6ff;letter-spacing:2px;opacity:.75}
.df-pack{width:5px;height:5px;border-radius:50%;background:#4fd6ff;box-shadow:0 0 6px #4fd6ff;opacity:0;animation:dfUp 2.6s ease-in infinite}
.df-pack.p2{animation-delay:.9s}
.df-pack.p3{animation-delay:1.8s}
@keyframes dfUp{0%{transform:translateY(7px);opacity:0}25%{opacity:1}100%{transform:translateY(-11px);opacity:0}}
/* 音乐喷泉 */
.fountain.musical .f-jet{position:absolute;left:50%;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(180deg,#7deaff,#4fd6ff);opacity:.85}
.fountain.musical .f-jet.j1{transform:translateX(-12px);animation:jetA 1.1s ease-in-out infinite}
.fountain.musical .f-jet.j2{height:14px;animation:jetB 1.1s ease-in-out infinite .18s}
.fountain.musical .f-jet.j3{transform:translateX(12px);animation:jetC 1.1s ease-in-out infinite .36s}
@keyframes jetA{0%,100%{height:6px;opacity:.6}50%{height:14px;opacity:1}}
@keyframes jetB{0%,100%{height:14px;opacity:1}50%{height:5px;opacity:.5}}
@keyframes jetC{0%,100%{height:9px;opacity:.8}50%{height:16px;opacity:1}}
.fountain.musical .f-note{position:absolute;left:50%;transform:translateX(-50%);color:#ffd400;font-size:8px;bottom:20px;opacity:0;animation:noteUp 2.8s ease-in infinite}
@keyframes noteUp{0%{transform:translate(-10px,0);opacity:0}25%{opacity:1}100%{transform:translate(9px,-20px);opacity:0}}
.fountain.musical .f-basin::after{animation:hueCycle 6s linear infinite}
@keyframes hueCycle{0%,100%{background:#4fd6ff}25%{background:#e040fb}50%{background:#ffd400}75%{background:#00e676}}
/* 蒸汽 */
.steam{position:relative;width:20px;height:18px;display:inline-block;opacity:.85}
.steam i{position:absolute;bottom:0;width:6px;height:6px;border-radius:50%;background:rgba(225,235,245,.55);filter:blur(1px);animation:stRise 3s ease-out infinite}
.steam .s2{left:7px;animation-delay:1s}
.steam .s3{left:13px;animation-delay:2s}
@keyframes stRise{0%{transform:translateY(0) scale(.6);opacity:.6}100%{transform:translateY(-24px) scale(1.7);opacity:0}}
/* 警报灯（边缘柜） */
.b-alarm{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sh) - var(--bh) - 36px);width:5px;height:5px;border-radius:50%;background:#ff1744;box-shadow:0 0 9px #ff1744;z-index:2;animation:alarmFlash 3.6s steps(2,end) infinite}
@keyframes alarmFlash{0%,72%,100%{opacity:1}80%{opacity:.15}}
/* 闯关引导：编号徽章 + 开始标记 + 路线条 */
.b-order{position:absolute;top:-7px;left:calc(50% - 50px);width:17px;height:17px;border-radius:50%;background:#2a3852;color:#9aa3bd;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:6;border:2px solid #04060c;box-shadow:0 0 5px rgba(0,0,0,.5)}
.building.current .b-order{background:var(--amber);color:#1a1206;animation:startPulse 1.8s ease-in-out infinite}
.building.completed .b-order{background:var(--green);color:#04140b}
.b-go{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--amber);background:rgba(11,14,26,.92);border:1px solid var(--amber);padding:2px 9px;border-radius:10px;z-index:7;white-space:nowrap;animation:startPulse 1.8s ease-in-out infinite}
@keyframes startPulse{0%,100%{box-shadow:0 0 4px rgba(255,179,64,.35)}50%{box-shadow:0 0 14px rgba(255,179,64,.95)}}
.route-bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px;justify-content:center;margin:8px 0 10px;background:rgba(10,14,28,.5);border:1px solid #223050;border-radius:8px;padding:7px 10px}
.rb-title{font-size:10px;color:var(--dim);letter-spacing:2px;margin-right:6px}
.rb-step{font-size:11px;color:#7c8ca6;background:#0a0e1c;border:1px solid #223050;border-radius:10px;padding:2px 8px;white-space:nowrap}
.rb-step.cur{color:var(--amber);border-color:var(--amber);font-weight:bold;animation:startPulse 1.8s ease-in-out infinite}
.rb-step.done{color:var(--green);border-color:var(--green)}
.rb-arrow{font-size:9px;color:#4a5570}
/* ===== RPG 室内场景（俯视工坊风 · 8bit） ===== */
.room-scene{position:relative;height:340px;margin:0 18px 12px;border-radius:2px;overflow:hidden;
  border:10px solid #2a3352;box-shadow:inset 0 0 0 2px #0a0d18, 0 4px 0 rgba(0,0,0,.35)}
/* 地板：8bit 木板像素格 */
.rs-floor{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,#1c2340 0 16px,#19203a 16px 32px),
  repeating-linear-gradient(0deg,#1b223d 0 16px,#182039 16px 32px)}
.rs-floor::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, rgba(255,179,64,.07), transparent 55%),
  radial-gradient(80% 60% at 12% 88%, rgba(255,120,40,.10), transparent 60%)}
/* 四周像素砖墙 */
.rs-wall{position:absolute;background:
  repeating-linear-gradient(90deg,#3a4568 0 12px,#313c5c 12px 24px);z-index:3}
.rs-wall.t{top:0;left:0;right:0;height:12px}
.rs-wall.b{bottom:0;left:0;right:0;height:12px;background:
  repeating-linear-gradient(90deg,#313c5c 0 12px,#3a4568 12px 24px)}
.rs-wall.l{left:0;top:12px;bottom:12px;width:12px;background:
  repeating-linear-gradient(180deg,#3a4568 0 12px,#313c5c 12px 24px)}
.rs-wall.r{right:0;top:12px;bottom:12px;width:12px;background:
  repeating-linear-gradient(180deg,#313c5c 0 12px,#3a4568 12px 24px)}
/* 门（顶部墙开口） */
.rs-door{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:56px;height:16px;background:#2a3852;border:2px solid #0a0d18;z-index:6}
.rs-door::after{content:"🚪";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px}
/* 楼层标牌 */
.rs-label{position:absolute;top:16px;left:18px;font-size:11px;color:var(--amber);background:rgba(11,14,26,.85);border:1px solid var(--amber);padding:2px 9px;border-radius:2px;z-index:6;letter-spacing:1px}
/* 工坊家具（装饰，不可交互） */
.rs-furn{position:absolute;z-index:2;background:#151b33;border:2px solid #0a0d18;box-shadow:3px 3px 0 rgba(0,0,0,.35);cursor:pointer}
.rs-furn:hover{border-color:var(--amber);transform:translateY(-1px)}
.rs-furn:hover::after{filter:brightness(1.2)}
.rs-furnace{left:20px;bottom:26px;width:64px;height:56px;border-radius:2px;background:linear-gradient(180deg,#2a1a14,#1a100c);box-shadow:3px 3px 0 rgba(0,0,0,.4),0 0 18px rgba(255,110,30,.35)}
.rs-furnace::before{content:"🔥";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:20px;animation:furnFire 1.4s ease-in-out infinite}
.rs-furnace::after{content:"熔炉";position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;color:#e8b88a;letter-spacing:2px}
.rs-bench{left:50%;transform:translateX(-50%);bottom:30px;width:150px;height:44px;border-radius:2px;background:
  repeating-linear-gradient(90deg,#3a2f1e 0 10px,#33291a 10px 20px);box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.rs-bench::before{content:"🛠️🔧";position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:15px;letter-spacing:6px}
.rs-bench::after{content:"工作台";position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9px;color:#cbb98a;letter-spacing:3px}
.rs-shelf{right:20px;bottom:30px;width:54px;height:62px;border-radius:2px;background:linear-gradient(180deg,#241c14,#1a140e)}
.rs-shelf::before{content:"📦";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:16px}
.rs-shelf::after{content:"货架";position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9px;color:#cbb98a;letter-spacing:2px}
.rs-crate{width:26px;height:24px;border-radius:2px;background:#3a2f1e}
.rs-crate.c1{left:96px;bottom:30px}
.rs-crate.c2{right:90px;bottom:30px}
.rs-crate::after{content:"🪵";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.9}
@keyframes furnFire{0%,100%{filter:drop-shadow(0 0 3px rgba(255,150,60,.8));transform:translateX(-50%) scale(1)}50%{filter:drop-shadow(0 0 10px rgba(255,180,80,1));transform:translateX(-50%) scale(1.15)}}
/* 任务设备（房间里的交互点） */
.rs-task{position:absolute;width:58px;height:50px;z-index:4;background:#0c1122;border:2px solid #4a5a86;border-radius:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,transform .15s;box-shadow:4px 4px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.03)}
.rs-task::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:5px;background:repeating-linear-gradient(90deg,var(--rc,#00bcd4) 0 6px,#0c1122 6px 12px);opacity:.85}
.rs-task:hover{border-color:var(--amber);transform:translateY(-2px)}
.rs-task .rt-icon{font-size:20px;line-height:1}
.rs-task .rt-name{font-size:8px;color:#c3cbe0;margin-top:3px;max-width:54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
.rs-task.done{border-color:var(--green);background:linear-gradient(180deg,rgba(0,230,118,.12),transparent)}
.rs-task.done .rt-name{color:var(--green)}
.rs-task.done::after{content:"✓";position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#04140b;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(0,230,118,.5)}
.rs-task.next{border-color:var(--amber);box-shadow:0 0 14px rgba(255,179,64,.6);animation:stNext 1.6s ease-in-out infinite}
.rs-task.next::before{content:"▶";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--amber);font-size:12px;animation:stArrow 1.1s ease-in-out infinite;text-shadow:0 0 6px rgba(255,179,64,.7)}
.rs-task.next .rt-icon{animation:stPulse 1.6s ease-in-out infinite}
.rs-task.next .rt-name{color:var(--amber);font-weight:bold}
.rs-task.todo{opacity:.55}
.rs-task.todo:hover{opacity:1}
/* 楼梯（上楼） */
.rs-stairs{position:absolute;right:14px;bottom:12px;width:38px;height:38px;z-index:5;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:2px;cursor:pointer;background:#0a0e1c;border:2px solid #2a3852;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.rs-stairs.locked{opacity:.4;cursor:not-allowed}
.rs-stairs.open{border-color:var(--amber);box-shadow:0 0 12px rgba(255,179,64,.55);animation:stNext 1.6s ease-in-out infinite}
.rs-stairs.open::after{content:"↑ 上楼";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--amber);white-space:nowrap;text-shadow:0 0 5px rgba(255,179,64,.6)}
/* 厂长 NPC（站在门口右侧） */
.rs-npc{position:absolute;left:18px;top:16px;font-size:24px;z-index:6;filter:drop-shadow(0 0 6px rgba(255,179,64,.4));animation:npcBob 2.2s ease-in-out infinite}
/* 俯视玩家小人（与横版同款像素小人） */
.rs-player{position:absolute;z-index:9;width:18px;height:26px;left:48%;top:58%;pointer-events:none;transition:left .42s ease,top .42s ease}
.rs-player .pl{position:absolute;image-rendering:pixelated}
.rs-player .hair{left:3px;top:0;width:12px;height:5px;background:#3a2a20;box-shadow:inset 0 -1px 0 #241a12}
.rs-player .face{left:4px;top:5px;width:10px;height:8px;background:#f0c89a}
.rs-player .eye{left:6px;top:7px;width:2px;height:2px;background:#2a2130}
.rs-player .body{left:2px;top:13px;width:14px;height:8px;background:#3d6df2;box-shadow:inset 0 -2px 0 #2748b0}
.rs-player .belt{left:2px;top:15px;width:14px;height:2px;background:#1d2f6e}
.rs-player .leg.l{left:2px;top:21px;width:6px;height:5px;background:#2a3852}
.rs-player .leg.r{left:10px;top:21px;width:6px;height:5px;background:#2a3852}
.rs-player.flip{transform:scaleX(-1)}
.rs-player::after{content:"";position:absolute;left:1px;right:1px;top:24px;height:2px;background:rgba(0,0,0,.4);filter:blur(1px)}
/* 任务/小游戏区（场景下方） */
.rs-foot{margin:0 18px 12px}
@keyframes stNext{0%,100%{box-shadow:0 0 8px rgba(255,179,64,.35)}50%{box-shadow:0 0 20px rgba(255,179,64,.75)}}
@keyframes stArrow{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
@keyframes stPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
/* ===== 横版过关场景（side-scroll · 室内房间剖面 · 8bit） ===== */
/* 三层结构：天花板 / 跑动区 / 地面 / 底部操作区(HUD) —— 跑动区始终在画面中间 */
.sx-scene{position:relative;height:520px;margin:0 18px 12px;border-radius:2px;overflow:hidden;
  border:10px solid #2c2a48;box-shadow:inset 0 0 0 2px #141222,0 4px 0 rgba(0,0,0,.4);background:#0a0e22;touch-action:none}
.sx-stage{position:absolute;top:0;left:0;height:100%;will-change:transform}
/* 室内墙背景：亮暖灰 + 砖纹 + 墙裙 */
.sx-bg{position:absolute;inset:0;background:
  linear-gradient(180deg,#3d4a72 0%,#38446a 55%,#333f63 100%)}
.sx-bg::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 22px,transparent 22px 44px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 22px,transparent 22px 44px)}
.sx-bg::after{content:"";position:absolute;left:0;right:0;height:96px;bottom:56px;
  background:linear-gradient(180deg,#2c3558 0%,#262e4e 100%);
  border-top:3px solid #4a5a86;border-bottom:3px solid #1d2440}
/* 天花板：横梁 + 灯带 */
.sx-ceil{position:absolute;left:0;right:0;top:0;height:30px;z-index:2;
  background:linear-gradient(180deg,#2c2a48,#211f3a);border-bottom:3px solid #141222;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.06)}
.sx-ceil::after{content:"";position:absolute;left:0;right:0;top:12px;height:4px;
  background:repeating-linear-gradient(90deg,#ffd9a0 0 26px,#ffb340 26px 28px,#ffd9a0 28px 54px);
  opacity:.9;filter:drop-shadow(0 0 4px rgba(255,179,64,.6))}
/* 墙上装饰：挂画/仪表盘/窗户/时钟/横管 */
.sx-deco{position:absolute;border:3px solid #141222;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.sx-deco.pic{width:34px;height:26px;background:repeating-linear-gradient(135deg,#4a7fb0 0 8px,#3a6a9a 8px 16px)}
.sx-deco.gauge{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#7fd0ff 0 26%,#2a3a60 30% 60%,#1a2440 62%);box-shadow:0 0 8px rgba(127,208,255,.4)}
.sx-deco.win{width:36px;height:32px;background:linear-gradient(180deg,#7fd0ff,#4a9ad0);border-width:4px;border-color:#4a5a86;box-shadow:inset 0 0 0 2px #141222,0 0 10px rgba(127,208,255,.35)}
.sx-deco.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#2c3558}
.sx-deco.win::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#2c3558}
.sx-deco.clock{width:24px;height:24px;border-radius:50%;background:#e8e2d0;border:3px solid #141222}
.sx-deco.clock::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:7px;background:#333;transform-origin:bottom;transform:rotate(-35deg)}
.sx-deco.pipe{height:8px;background:linear-gradient(180deg,#5a6a9a,#3a4a78);border-left:none;border-right:none}
/* 地面下方：底部操作区（HUD 条），深色不透明，不挡跑动区 */
.sx-hud{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:11;
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(180deg,#1a2140,#10162a);border-top:3px solid #4a5a86;box-shadow:0 -3px 0 rgba(0,0,0,.35)}
.sx-hint{font-size:11px;color:#e2e9fb;line-height:1.4;text-shadow:0 1px 0 #000;max-width:56%}
.sx-hint b{color:var(--amber)}
.sx-btns{display:none;gap:8px;flex:none}
.sx-btn{width:50px;height:46px;font-size:20px;border-radius:3px;background:rgba(13,16,34,.95);border:2px solid #5a6a9a;color:var(--amber);cursor:pointer;user-select:none;touch-action:none;font-family:inherit;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.sx-btn:active{background:#2a3852;transform:translateY(2px);box-shadow:none}
@media (hover:none),(pointer:coarse){
  .sx-btns{display:flex}
}
/* 地板：厚实木地板（在 HUD 条上方） */
.sx-ground{position:absolute;left:0;right:0;bottom:52px;height:46px;background:
  repeating-linear-gradient(90deg,#6a5a3a 0 26px,#5a4c30 26px 52px);
  border-top:4px solid #8a7a52;box-shadow:0 -2px 0 rgba(255,255,255,.12),inset 0 6px 0 rgba(255,255,255,.07)}
.sx-ground::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 13px,transparent 13px 26px)}
/* 地面静态装饰：木箱/木桶（放在设备间隙，不与设备重叠） */
.sx-prop{position:absolute;z-index:4}
.sx-prop.crate{width:28px;height:22px;background:#6a5a3a;border:2px solid #141222;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.sx-prop.crate::after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.4);border-top:none;border-left:none}
.sx-prop.barrel{width:20px;height:24px;border-radius:3px;background:linear-gradient(180deg,#5a4c30,#4a3e28);border:2px solid #141222;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.sx-prop.barrel::before{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:rgba(0,0,0,.4)}
/* 平台：像素金属平台（带支撑腿） */
.sx-platform{position:absolute;height:14px;background:
  repeating-linear-gradient(90deg,#6a7aae 0 10px,#5a6a9a 10px 20px);border:2px solid #141222;border-radius:1px;box-shadow:3px 3px 0 rgba(0,0,0,.4);z-index:5}
.sx-platform::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.22)}
.sx-platform::after{content:"";position:absolute;left:12px;top:14px;width:4px;height:50px;background:#2a2f4e;box-shadow:40px 0 0 #2a2f4e,80px 0 0 #2a2f4e}
/* 任务设备：像素机柜/终端（放大） */
.sx-task{position:absolute;width:66px;height:56px;z-index:6;background:#141a30;border:2px solid #5a6a9a;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:5px 5px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.04);transition:transform .15s,border-color .2s}
.sx-task::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:6px;background:repeating-linear-gradient(90deg,var(--rc,#00bcd4) 0 8px,#141a30 8px 16px);opacity:.9}
.sx-task .rt-icon{font-size:26px;line-height:1;filter:drop-shadow(0 0 3px rgba(0,0,0,.7))}
.sx-task .rt-name{font-size:10px;color:#dce4f5;margin-top:4px;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000;letter-spacing:.5px}
.sx-task.done{border-color:var(--green);background:rgba(0,230,118,.14)}
.sx-task.done::before{background:repeating-linear-gradient(90deg,var(--green) 0 8px,#141a30 8px 16px)}
.sx-task.done .rt-name{color:var(--green)}
.sx-task.done::after{content:"✓";position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#04140b;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(0,230,118,.5)}
.sx-task.next{border-color:var(--amber);box-shadow:0 0 16px rgba(255,179,64,.75),5px 5px 0 rgba(0,0,0,.45);animation:stNext 1.6s ease-in-out infinite}
.sx-task.next::before{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,#141a30 8px 16px)}
.sx-task.next .rt-name{color:var(--amber);font-weight:bold}
.sx-task.todo{opacity:.82}
.sx-task.todo:hover{opacity:1}
.sx-task.near{border-color:var(--amber);transform:scale(1.1);z-index:8}
.sx-task.near::before{content:"点击进入";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--amber);background:rgba(13,16,34,.94);border:1px solid var(--amber);padding:2px 7px;border-radius:8px;white-space:nowrap;z-index:9}
/* 玩家：精细 8bit 像素小人（安全帽+工装+手臂，会走路） */
.sx-player{position:absolute;z-index:9;width:26px;height:40px}
.sx-player .pl{position:absolute;image-rendering:pixelated}
.sx-player .hair{left:4px;top:0;width:18px;height:8px;background:#3a2a20;box-shadow:inset 0 -2px 0 #241a12}
.sx-player .hair::after{content:"";position:absolute;left:4px;top:6px;width:10px;height:4px;background:#3a2a20;border-radius:50% 50% 0 0}
.sx-player .face{left:6px;top:7px;width:14px;height:12px;background:#f0c89a}
.sx-player .eye{left:9px;top:11px;width:3px;height:3px;background:#2a2130;box-shadow:5px 0 0 #2a2130}
.sx-player .body{left:3px;top:20px;width:20px;height:12px;background:#3d6df2;box-shadow:inset 0 -4px 0 #2748b0}
.sx-player .belt{left:3px;top:24px;width:20px;height:3px;background:#1d2f6e}
.sx-player .arm.l{left:-2px;top:20px;width:6px;height:10px;background:#3d6df2;box-shadow:inset -2px 0 0 #2748b0}
.sx-player .arm.r{right:-2px;top:20px;width:6px;height:10px;background:#2f57cf;box-shadow:inset 2px 0 0 #1d3a9a}
.sx-player .hand.l{left:0;top:28px;width:3px;height:4px;background:#f0c89a}
.sx-player .hand.r{right:0;top:28px;width:3px;height:4px;background:#f0c89a}
.sx-player .leg.l{left:4px;top:32px;width:8px;height:7px;background:#2a3852}
.sx-player .leg.r{left:14px;top:32px;width:8px;height:7px;background:#22304a}

async function doLogin(){
  const name=$('inpName').value.trim(), pw=$('inpPw').value;
  $('err').textContent='';
  if(!name){ $('err').textContent='请输入姓名'; return; }
  try{
    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,password:pw})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'登录失败');
    token=j.token;
    try{ sessionStorage.setItem('token',token); sessionStorage.setItem('role','student'); sessionStorage.setItem('name',name); }catch(e){}
    await loadAll();
    $('loginBox').classList.add('hide');
    $('mapApp').classList.add('show');
    try{ musStart(); }catch(e){}
  }catch(e){ $('err').textContent=e.message; }
}

async function loadAll(){
  const [cr, mr]=await Promise.all([
    fetch(API+'/api/game/content').then(r=>r.json()),
    fetch(API+'/api/student/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json())
  ]);
  content=cr.data||cr; me=mr.data;

function isTaskDone(tid){ return !!(me.check && me.check[''+tid]); }
function placeBoss(){
  let curLv=null;
  for(let i=0;i<content.levels.length;i++){ if(!levelProgress(content.levels[i]).completed){ curLv=content.levels[i]; break; } }
  if(curLv){ $('bossBubble').textContent='厂长：去 '+curLv.areaName+'！任务在等你。'; }
  else { $('bossBubble').textContent='厂长：全厂通关，你就是数字化大师！🎉'; }
}
function levelProgress(lv){
  let done=0,total=0;
  (lv.tasks||[]).forEach(t=>{ if(t.auto)return; total++; if(isTaskDone(t.id))done++; });
  return {done,total,pct:total?Math.round(done/total*100):0,completed:total>0&&done>=total};
}
function accessOf(lv,idx){
  if(idx===0) return 'open';
  const prev=content.levels[idx-1];
  return levelProgress(prev).completed ? 'open' : 'locked';
}
function areaStars(lv){
  const st=(me.stars&&me.stars[lv.id])||{};
  return {self:st.self||0, peer:st.peer||0, teacher:st.teacher||0};
}
function starStr(v){ let s=''; for(let i=0;i<5;i++) s+= i<v?'★':'☆'; return s; }

const ROOM_VIEW={workshop:'top',edge_cabinet:'top',control_room:'top',console:'top',
  data_pipe:'side',big_screen:'side',cloud_platform:'top',ai_lab:'top'};
const TASK_ICON={install_wizard:'🖥️',terminal:'⌨️',chain_quiz:'💬',quiz:'💬',fill_blank:'✍️',sort:'🔀',diagnosis_tree:'🩺',progress_bar:'📊',scenario_match:'🔗',code_review:'📝',ethics:'⚖️',drag_classify:'🗂️',boss_fight:'💥'};
function openRoom(id){
  if(currentRoomId!==id){ currentRoomId=id; try{ window._roomFlr=0; }catch(e){} }
  const lv=content.levels.find(l=>l.id==id); if(!lv) return;
  const color=AREA_COLOR[lv.factoryArea]||lv.color;
  const [r,g,b]=hex2rgb(color);
  const rc=color, rcg=`rgba(${r},${g},${b},.5)`, rcg2=`rgba(${r},${g},${b},.13)`;
  const prog=levelProgress(lv); const st=areaStars(lv);
  const idx=content.levels.indexOf(lv);
  const locked=idx>0&&!levelProgress(content.levels[idx-1]).completed;
  const layer=ISA_LAYERS.find(L=>L.areas.includes(lv.factoryArea));
  const tasks=(lv.tasks||[]).filter(t=>!t.auto);
  const totalXP=tasks.reduce((s,t)=>s+(t.xp||0),0);
  const earnedXP=tasks.filter(t=>isTaskDone(t.id)).reduce((s,t)=>s+(t.xp||0),0);
  let cur=null; tasks.forEach(t=>{ if(cur===null&&!isTaskDone(t.id)) cur=t; });
  // RPG 室内场景：任务=房间里的设备，按楼层摆放，楼梯上楼
  // 楼层切分：普通任务分到各层，隐藏挑战放最后一层
  const regs=tasks.filter(t=>!String(t.id).includes('hidden'));
  const hiddens=tasks.filter(t=>String(t.id).includes('hidden'));
  const nFlr = Math.min(3, Math.max(2, Math.ceil(regs.length/7)));
  const perFlr = Math.ceil(regs.length/nFlr);
  const flrTasks=[];
  for(let fi=0;fi<nFlr;fi++) flrTasks.push(regs.slice(fi*perFlr, (fi+1)*perFlr));
  if(hiddens.length) flrTasks[flrTasks.length-1] = flrTasks[flrTasks.length-1].concat(hiddens);
  window._roomFlr = Math.min(window._roomFlr||0, flrTasks.length-1);
  const fi = window._roomFlr;
  const ft = flrTasks[fi]||[];
  const flrDone = ft.length>0 && ft.every(t=>isTaskDone(t.id));
  const hasNext = fi < flrTasks.length-1;
  // 设备摆放（每行最多5个）
  const tpos=(i,n)=>{ const per=5, r=Math.floor(i/per), c=i%per; const rw=Math.floor(n/per)+1;
    const top = 14 + r*(64/rw) + (rw>1?6:0); const left = 8 + c*18; return {top:top+'%', left:left+'%'}; };
  const ftHTML = ft.map((t,i)=>{
    const done=isTaskDone(t.id), next=(!done&&t===cur);
    const cls=done?'done':(next?'next':'todo');
    const pos=tpos(i,ft.length);
    return `<div class="rs-task ${cls}" style="left:${pos.left};top:${pos.top}" onclick="roomGoTask('${lv.id}','${t.id}',this)" title="${t.title||t.name||t.label||''}">
      <span class="rt-icon">${TASK_ICON[t.type]||'📌'}</span><span class="rt-name">${(t.title||t.name||t.label||'').slice(0,6)}</span>
    </div>`;
  }).join('');
  const stairsCls = (flrDone&&hasNext)?'open':'locked';
  const stairsHTML = hasNext ? `<div class="rs-stairs ${stairsCls}" ${flrDone&&hasNext?'onclick="nextRoomFloor()"':''}>🪜</div>` : '';
  const doneCnt=ft.filter(t=>isTaskDone(t.id)).length;
  const viewType = ROOM_VIEW[lv.factoryArea]||'top';
  let sceneHTML;
  if(viewType==='side'){
    // 横版过关：室内房间剖面，任务设备分散在长廊各处，小人左右移动
    // 坐标在 sxStart 里根据场景实际高度动态计算（groundTop/平台/设备）
    const gap=250, baseX=140;
    const stageW=Math.max(900, ft.length*gap+260);
    let platHTML='', taskElsHTML='';
    ft.forEach((t,i)=>{
      const done=isTaskDone(t.id), next=(!done&&t===cur);

let sxGame=null, sxKeys=null, sxGo=null;
/* 横版：点击任务设备 → 小人自动走过去，到跟前进入任务 */
function sxGoTask(lvId, taskId, el){
  const tx=parseFloat(el.style.left)+33, ty=parseFloat(el.style.top)+28;
  const platY = el.getAttribute('data-plat')==='1' ? (parseFloat(el.dataset.platY)||0) : 0;
  sxGo={lvId, taskId, x:tx, y:ty, platY};
}
/* 俯视：小人走到设备跟前 → 进入任务 */
let rsWalkTimer=null;
function roomWalkTo(lx, ty, cb){
  const p=document.getElementById('rsPlayer');
  if(!p){ if(cb) cb(); return; }
  const cl=parseFloat(p.style.left)||48, ct=parseFloat(p.style.top)||60;
  p.style.left=lx+'%'; p.style.top=ty+'%';
  p.classList.toggle('flip', lx < cl);
  if(rsWalkTimer) clearTimeout(rsWalkTimer);
  rsWalkTimer=setTimeout(()=>{ if(cb) cb(); }, 480);
}
function roomGoTask(lvId, taskId, el){
  const sc=document.getElementById('rsScene'); if(!sc){ enterLevel(lvId,taskId); return; }
  const sr=sc.getBoundingClientRect(), er=el.getBoundingClientRect();
  const lx=(er.left-sr.left+er.width/2)/sr.width*100;
  const ty=(er.top-sr.top+er.height/2)/sr.height*100;
  roomWalkTo(lx, ty, ()=>enterLevel(lvId, taskId));
}
/* 俯视：点地板/家具 → 小人走过去 */
function roomGoPoint(ev){
  const sc=document.getElementById('rsScene'); if(!sc) return;
  const sr=sc.getBoundingClientRect();
  const lx=(ev.clientX-sr.left)/sr.width*100;
  const ty=(ev.clientY-sr.top)/sr.height*100;
  const f=ev.target.closest&&ev.target.closest('[data-name]');
  const name=f?f.getAttribute('data-name'):'';
  roomWalkTo(lx, ty, ()=>{ if(name&&typeof showToast==='function') showToast('走近'+name+' · 这里是'+name); });
}
function sxStart(){
  const scene=document.getElementById('sxScene'); if(!scene) return;
  const stage=document.getElementById('sxStage'); if(!stage) return;
  const player=document.getElementById('sxPlayer'); if(!player) return;
  // 动态坐标：HUD 52px + 地面 46px，跑动区居中
  const H=scene.clientHeight;
  const groundH=46, groundTop=H-52-groundH;
  const platTop=Math.max(110, groundTop-150);
  const g=0.42, jumpV=-12.5, speed=4.6, ph=38;
  const gap=250, baseX=140;
  let x=40, y=groundTop-ph, vy=0, onGround=true, moveTarget=null;
  const keys={left:false,right:false,jump:false};
  // 摆放任务设备 + 平台 + 楼梯
  const plats=[];
  const taskEls=[].slice.call(scene.querySelectorAll('.sx-task'));
  taskEls.forEach((el,i)=>{
    const onPlat=el.getAttribute('data-plat')==='1';
    const tx=baseX+i*gap;
    const tTop=onPlat?(platTop-56):(groundTop-56);
    el.style.left=tx+'px'; el.style.top=tTop+'px';
    el.dataset.platY=onPlat?platTop:0;
    if(onPlat){
      const pe=scene.querySelector('.sx-platform[data-idx="'+i+'"]');
      if(pe){ pe.style.left=(tx-16)+'px'; pe.style.top=platTop+'px'; pe.style.width='100px';
        plats.push({x:tx-16, y:platTop, w:100}); }
    }
    // 地面静态道具：放到地面上（与设备错开，x 避开设备位置）
    const props=scene.querySelectorAll('.sx-prop');
    for(let pi=0;pi<props.length;pi++){
      const px=Math.round(60+pi*130+40);
      props[pi].style.left=px+'px';
      props[pi].style.top=(groundTop-26)+'px';
    }
  });
  // 楼梯：放长廊末端
  const stairsEl=document.getElementById('sxStairs');
  if(stairsEl){
    const sx=window._sxRoom||{};
    const sCls=sx.flrDone&&sx.hasNext?'open':'locked';
    stairsEl.className='sx-stairs '+sCls;
    stairsEl.style.left=(baseX+taskEls.length*gap+70)+'px';
    stairsEl.style.top=(groundTop-64)+'px';
    if(sx.flrDone&&sx.hasNext){
      stairsEl.onclick=function(){ nextRoomFloor(); };
      const tip=document.createElement('div'); tip.className='sx-door-tip'; tip.textContent='出门 · 下一层';
      stairsEl.appendChild(tip);
    }
  }
  const rw=scene.clientWidth, stageW=stage.clientWidth;
  // 点哪儿走哪儿：点击场景（非设备/楼梯/按钮）→ 小人走到该水平位置
  scene.addEventListener('pointerdown', function(e){
    const t=e.target;
    if(t.closest&&(t.closest('.sx-task')||t.closest('.sx-stairs')||t.closest('.sx-btn'))) return;
    const rect=stage.getBoundingClientRect();
    moveTarget=Math.max(6, Math.min(e.clientX-rect.left, stageW-30));
    sxGo=null;
  }, true);
  function frame(){
    // 点击任务设备：自动走过去，到跟前进入任务
    if(sxGo){
      moveTarget=sxGo.x;
      const dx=Math.abs((x+12)-sxGo.x);
      if(dx<14){
        // 设备在平台上且玩家还在下面 → 自动跳上去
        if(sxGo.platY && onGround && y > sxGo.platY-46){ vy=jumpV; onGround=false; }
        const dy=Math.abs((y+17)-sxGo.y);
        if(dy<34){ enterLevel(sxGo.lvId,sxGo.taskId); sxGo=null; moveTarget=null; return; }
      }
    }
    // 键盘方向优先，按方向键清除点击目标
    if(keys.left){ x-=speed; moveTarget=null; sxGo=null; }
    if(keys.right){ x+=speed; moveTarget=null; sxGo=null; }
    // 点击移动：朝目标走，到达后停
    if(!keys.left&&!keys.right&&moveTarget!==null){
      const d=moveTarget-x;
      if(Math.abs(d)<=speed){ x=moveTarget; moveTarget=null; }
      else { x+=Math.sign(d)*speed; }
    }
    // 跳跃：可按住蓄力（在平台上也能再次跳——简化体验）
    if(keys.jump&&onGround){ vy=jumpV; onGround=false; }
    vy+=g; y+=vy;
    // 地面
    if(y+ph>=groundTop){ y=groundTop-ph; vy=0; onGround=true; }
    // 平台：宽松落点（玩家身体中段接触即可站上）
    for(const p of plats){
      if(vy>=0 && x+5<p.x+p.w && x+19>p.x && y+ph>=p.y-8 && y+ph<=p.y+20){ y=p.y-ph; vy=0; onGround=true; }
    }
    if(x<4) x=4; if(x>stageW-30) x=stageW-30;
    player.style.left=x+'px'; player.style.top=y+'px';
    if(keys.left){ player.classList.add('flip'); player.classList.add('walk'); }
    else if(keys.right){ player.classList.remove('flip'); player.classList.add('walk'); }
    else if(moveTarget!==null||sxGo){ player.classList.add('walk'); }
    else { player.classList.remove('walk'); }
    let cam=x-rw/2+13; cam=Math.max(0,Math.min(cam,stageW-rw));
    stage.style.transform='translateX('+(-cam)+'px)';
    taskEls.forEach(el=>{
      const tx=parseFloat(el.style.left)+33, ty=parseFloat(el.style.top)+28;
      const dx=Math.abs(tx-(x+12)), dy=Math.abs(ty-(y+17));
      const near=dx<64&&dy<74;
      el.classList.toggle('near',near);
    });
    sxGame=requestAnimationFrame(frame);
  }
  function kd(e){
    if(e.key==='ArrowLeft'||e.key==='a'){ keys.left=true; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='d'){ keys.right=true; e.preventDefault(); }
    if(e.key==='ArrowUp'||e.key===' '||e.key==='w'){ keys.jump=true; e.preventDefault(); }
  }
  function ku(e){
    if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
    if(e.key==='ArrowUp'||e.key===' '||e.key==='w') keys.jump=false;
  }
  scene.querySelectorAll('.sx-btn').forEach(b=>{
    const k=b.getAttribute('data-k');
    const dn=ev=>{ ev.preventDefault(); keys[k]=true; };
    const up=ev=>{ ev.preventDefault(); keys[k]=false; };
    b.addEventListener('pointerdown',dn);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('pointercancel',up);
  });
  sxKeys={kd,ku};
  window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
  // 手机竖屏提示横屏
  if(window.innerHeight>window.innerWidth && matchMedia('(hover:none),(pointer:coarse)').matches){
    const r=scene.querySelector('.sx-rotate'); if(r){ r.classList.add('show'); setTimeout(()=>r.classList.remove('show'),4500); }
  }
  sxGame=requestAnimationFrame(frame);
}
function sxStop(){
  if(sxGame){ cancelAnimationFrame(sxGame); sxGame=null; }
  if(sxKeys){ window.removeEventListener('keydown',sxKeys.kd); window.removeEventListener('keyup',sxKeys.ku); sxKeys=null; }
}

async function autoLogin(){
  const t=sessionStorage.getItem('token');
  if(!t) return false;
  // 有 token：立刻隐藏登录框，避免从任务/游戏专区跳回时闪一下登录页
  $('loginBox').classList.add('hide');
  try{
    const mr=await fetch(API+'/api/student/me',{headers:{Authorization:'Bearer '+t}});
    if(mr.status===401){ try{ sessionStorage.removeItem('token'); }catch(e){} $('loginBox').classList.remove('hide'); return false; }
    const j=await mr.json();
    if(!j.ok){ $('loginBox').classList.remove('hide'); return false; }
    token=t; me=j.data;
    const cr=await fetch(API+'/api/game/content').then(r=>r.json());
    content=cr.data||cr;
    if(!content||!content.levels){ $('loginBox').classList.remove('hide'); return false; }
    render();
    $('mapApp').classList.add('show');
    try{ musStart(); }catch(e){}
    // 从任务叉掉/完成跳回：自动重新打开对应房间（房间=该幕任务清单）
    try{
      const mr=sessionStorage.getItem('mapRoom');
      if(mr){ sessionStorage.removeItem('mapRoom'); const lv=content.levels.find(l=>String(l.id)===String(mr)); if(lv) setTimeout(()=>openRoom(lv.id), 450); }
    }catch(e){}
    return true;
  }catch(e){ $('loginBox').classList.remove('hide'); return false; }
}

const MUSIC_KEYS=['hub','control_room','console','workshop','edge_cabinet','cloud_platform','big_screen','data_pipe','ai_lab','tetris','mario','dkc','kirby','pokemon'];
let musCtx=null,musSrc=null,musGain=null,musOn=true,musIdx=0;
function musAudio(){ if(!musCtx){musCtx=new(window.AudioContext||window.webkitAudioContext)();} if(musCtx.state==='suspended')musCtx.resume(); return musCtx; }
function musPlay(k){
  if(!window.MUSIC_SONGS||!window.MUSIC_SONGS[k])return;
  try{
    const c=musAudio();
    if(musSrc){try{musSrc.stop();}catch(e){} musSrc=null;}
    const data=zzfxM.apply(null,window.MUSIC_SONGS[k]);
    const buf=c.createBuffer(data.length,data[0].length,zzfxR);
    for(let i=0;i<data.length;i++)buf.getChannelData(i).set(data[i]);
    if(!musGain){musGain=c.createGain();musGain.gain.value=.5;musGain.connect(c.destination);}
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.connect(musGain);src.start();musSrc=src;
  }catch(e){}
}
function musNext(){ musIdx=(musIdx+1)%MUSIC_KEYS.length; musPlay(MUSIC_KEYS[musIdx]); }
function musToggle(){
  musOn=!musOn;
  const btn=document.getElementById('musicBtn');
  if(musOn){ musPlay(MUSIC_KEYS[musIdx]); btn.textContent='♫ 开'; }
  else { if(musSrc){try{musSrc.stop();}catch(e){}} musSrc=null; btn.textContent='♪ 关'; }
}
function musStart(){ if(musOn){ try{musAudio(); musPlay(MUSIC_KEYS[musIdx]);}catch(e){} } }
document.getElementById('musicBtn').addEventListener('click',musToggle);
</script>
