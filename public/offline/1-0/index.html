<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<title>1-0 安装VMware + Ubuntu Server · 离线试玩</title>
<style>

:root{--bg:#0b0e1a;--panel:#12121a;--text:#e8eaf0;--dim:#9aa3bd;--amber:#ffb340;--green:#00e676;--red:#ff5252;--cyan:#00bcd4;--border:#2c3552;--fg:#e8eaf0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;min-height:100vh}
.topbar{position:sticky;top:0;background:#10162a;border-bottom:1px solid var(--border);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.topbar b{color:var(--amber)}
.topbar span{font-size:12px;color:var(--dim)}
#app{max-width:720px;margin:0 auto;padding:14px 16px}
.modal-foot{padding:10px 16px;border-top:1px solid var(--border);text-align:right;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#10162a;border-radius:0 0 4px 4px}
.modal-foot{background:transparent}
#modalFoot{margin:6px auto 30px;max-width:720px;padding:0 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#app input[type=number]{width:80px;background:#0a0a10;border:1px solid var(--border);color:var(--text);padding:8px;font-size:14px}

#app .term-body input[type=text]{width:94%;border:none;color:var(--green)}
.teach-toggle{cursor:pointer;color:var(--amber);font-size:12px;margin-top:4px;user-select:none}

/* ===== Director Dialogue ===== */
.director-box{
  display: flex; gap: 12px; padding: 12px; background: #0e0e16;
  border: 1px solid var(--border); margin-bottom: 14px;
  align-items: flex-start;
}
/* ===== Director Mood System ===== */
.director-box{ transition: transform .2s, box-shadow .2s; }
.director-portrait{
  font-size: 36px; line-height: 1; flex-shrink: 0;
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  background: #1a1a24; border-radius: 4px;
}
.director-mood-proud .director-portrait{ transform: scale(1.1); filter: drop-shadow(0 0 8px #0f0); }
.director-mood-stern .director-portrait{ transform: scale(1.05); filter: drop-shadow(0 0 8px #f40); animation: stern-shake 0.5s ease; }
.director-mood-awkward .director-portrait{ filter: grayscale(0.3) sepia(0.2); opacity: 0.9; }
.director-mood-thinking .director-portrait{ animation: thinking-bounce 1.5s infinite; }
.director-bubble{ flex: 1; min-width: 0; }
.director-name{ font-size: 16px; color: var(--amber); margin-bottom: 2px; }
.director-text{ font-size: 15px; line-height: 1.6; color: var(--text); }
.director-text .cursor-blink{
  display: inline-block; width: 4px; height: 14px;
  background: var(--amber); animation: blink 1s step-end infinite;
  vertical-align: text-bottom; margin-left: 1px;
}
.wizard-narrative{ background: rgba(255,176,0,.06); border-left: 3px solid var(--amber); padding: 10px 14px; margin-bottom: 12px; font-size: 15px; line-height: 1.6; color: var(--text); border-radius: 0 6px 6px 0; }
.wiz-narr-icon{ font-size: 16px; }
.wiz-narr-label{ color: var(--amber); font-weight: bold; margin-right: 4px; }
.wizard-question{ font-size: 16px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
/* ===== Interaction: Install Wizard ===== */
.wizard-steps{ display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.wiz-dot{ position: relative; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #1a1a24; border: 2px solid var(--border); font-size: 16px; color: var(--dim); transition: all .3s; }
.wiz-dot.done{ background: var(--green); border-color: var(--green); color: #000; }
.wiz-dot.active{ border-color: var(--amber); color: var(--amber); box-shadow: 0 0 8px rgba(255,176,0,.3); }
.wiz-dot.active::after{ content: ''; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; border: 2px solid var(--amber); animation: wiz-pulse 1.2s infinite; }
.prog-bar-bg{ height: 4px; background: #1a1a24; margin: 12px 0; overflow: hidden; }
.prog-bar-fill{ height: 100%; background: var(--green); width: 0; transition: width .3s; }
.quiz-opt{
  padding: 8px 12px; border: 1px solid var(--border); cursor: pointer;
  font-size: 15px; transition: all .2s; word-break: break-word; line-height: 1.5;
}
.quiz-opt:hover{ border-color: var(--cyan); }
.quiz-opt.selected{ border-color: var(--amber); background: rgba(255,176,0,.1); }
.quiz-opt.correct{ border-color: var(--green); background: rgba(0,230,118,.1); }
.quiz-opt.wrong{ border-color: var(--red); background: rgba(255,85,85,.1); }
/* ===== Enhanced Terminal ===== */
.term-root{ background: #050508; border: 1px solid #1a1a24; font-family: 'Courier New', monospace; }
.term-root .term-header{
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px; background: #0a0a10; border-bottom: 1px solid #1a1a24;
  font-size: 16px; color: #505060;
}
.term-root .term-dots{ display: flex; gap: 4px; }
.term-root .term-dot{ width: 8px; height: 8px; border-radius: 50%; }
.term-root .term-dot.red{ background: #ff5555; }
.term-root .term-dot.yellow{ background: #ffb000; }
.term-root .term-dot.green{ background: #00e676; }
.term-root .term-body{
  padding: 12px; min-height: 100px; max-height: 260px; overflow-y: auto;
  background: #050508;
}
.term-root .term-line{ white-space: pre-wrap; word-break: break-all; line-height: 1.5; font-size: 16px; }
.term-root .term-prompt{ color: var(--green); }
.term-root .term-cmd{ color: #d0d0d8; }
.term-root .term-out{ color: #808088; }
.term-root .term-success{ color: var(--green); }
.term-root .term-error{ color: var(--red); }
.term-root .term-info{ color: var(--cyan); }
.term-root .term-warn{ color: var(--amber); }
.term-root .term-cursor-blink{
  display: inline-block; width: 6px; height: 14px;
  background: var(--green); animation: blink 1s step-end infinite;

}
.term-root .term-input-row{
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;

}

  flex: 1; background: transparent; border: none; color: var(--text);
  font-family: inherit; font-size: 16px; padding: 4px 0; outline: none;

}

}

.term-prompt{ color: var(--green); }

.term-task-title{
  padding: 8px 12px; background: rgba(255,176,0,.08);

.btn-logout{ background: none; border: 1px solid var(--border); color: var(--dim); padding: 3px 8px; font-family: inherit; font-size: 16px; cursor: pointer; }
.btn-logout:hover{ border-color: var(--red); color: var(--red); }
.btn{ padding: 6px 16px; border: 1px solid var(--border); background: #1a1a24; color: var(--text); font-family: inherit; font-size: 16px; cursor: pointer; transition: all .2s; }
.btn:hover{ background: #2a2a3a; }
.btn-primary{ background: var(--amber); color: #000; border-color: var(--amber); font-weight: bold; }

/* ===== Leaderboard / Achievements ===== */
.btn-icon{ background: none; border: 1px solid var(--border); color: var(--dim); padding: 3px 8px; font-family: inherit; font-size: 16px; cursor: pointer; }

body.map-flow .header .xp-wrap,
body.map-flow .header .rank-badge,

<div class="topbar"><b>🔧 1-0 安装VMware + Ubuntu Server</b><span>离线试玩 · 进度存本机浏览器</span></div>
<div id="app"></div>
<div id="modalFoot"></div>
<script>
(() => {
  // public/js/core/interactions.js
  var interactions = {};
  function registerInteraction(type, handler) {
    interactions[type] = handler;
  }
  function getInteraction(type) {
    return interactions[type] || interactions["default"];
  }

  // public/js/core/sound.js
  var soundEnabled = true;
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }
  function playSound(type, opt) {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioCtx();
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      switch (type) {
        case "success": {
          [523, 659, 784].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "sine";
            o.frequency.setValueAtTime(freq, now + i * 0.08);
            g.gain.setValueAtTime(0.2, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
            o.start(now + i * 0.08);
            o.stop(now + i * 0.08 + 0.2);
          });
          break;
        }
        case "error": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "sawtooth";
          o.frequency.setValueAtTime(180, now);
          o.frequency.linearRampToValueAtTime(80, now + 0.25);
          g.gain.setValueAtTime(0.15, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          o.start(now);
          o.stop(now + 0.3);
          break;
        }
        case "click": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(900, now);
          g.gain.setValueAtTime(0.08, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
          o.start(now);
          o.stop(now + 0.04);
          break;
        }
        case "type": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(400 + Math.random() * 300, now);
          g.gain.setValueAtTime(0.03, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
          o.start(now);
          o.stop(now + 0.03);
          break;
        }
        case "levelup": {
          [523, 659, 784, 1047].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "sine";
            o.frequency.setValueAtTime(freq, now + i * 0.12);
            g.gain.setValueAtTime(0.25, now + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
            o.start(now + i * 0.12);
            o.stop(now + i * 0.12 + 0.4);
          });
          break;
        }
        case "boot": {
          for (let i = 0; i < 8; i++) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "square";
            o.frequency.setValueAtTime(100 + i * 30, now + i * 0.05);
            g.gain.setValueAtTime(0.02, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.04);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.04);
          }
          break;
        }
        case "fanfare": {
          [523, 659, 784, 1047, 1319].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "triangle";
            o.frequency.setValueAtTime(freq, now + i * 0.1);
            g.gain.setValueAtTime(0.22, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.35);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.35);
          });
          break;
        }
        case "fail": {
          [392, 330, 262, 196].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "sine";
            o.frequency.setValueAtTime(freq, now + i * 0.15);
            g.gain.setValueAtTime(0.18, now + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
            o.start(now + i * 0.15);
            o.stop(now + i * 0.15 + 0.3);
          });
          break;
        }
        case "alarm": {
          for (let i = 0; i < 6; i++) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "square";
            o.frequency.setValueAtTime(i % 2 === 0 ? 660 : 550, now + i * 0.12);
            g.gain.setValueAtTime(0.07, now + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.1);
            o.start(now + i * 0.12);
            o.stop(now + i * 0.12 + 0.11);
          }
          break;
        }
        case "tick": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "square";
          o.frequency.setValueAtTime(1200, now);
          g.gain.setValueAtTime(0.06, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          o.start(now);
          o.stop(now + 0.05);
          break;
        }
        case "combo": {
          const lv = Math.min(Math.max(parseInt(opt) || 1, 1), 20);
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "triangle";
          o.frequency.setValueAtTime(500 + lv * 40, now);
          g.gain.setValueAtTime(0.12, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          o.start(now);
          o.stop(now + 0.12);
          break;
        }
        case "shoot": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "square";
          o.frequency.setValueAtTime(340, now);
          o.frequency.linearRampToValueAtTime(220, now + 0.05);
          g.gain.setValueAtTime(0.04, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          o.start(now);
          o.stop(now + 0.07);
          break;
        }
        case "hit": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "triangle";
          o.frequency.setValueAtTime(260, now);
          o.frequency.linearRampToValueAtTime(180, now + 0.08);
          g.gain.setValueAtTime(0.08, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          o.start(now);
          o.stop(now + 0.1);
          break;
        }
        case "pickup": {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(880, now);
          o.frequency.linearRampToValueAtTime(1320, now + 0.1);
          g.gain.setValueAtTime(0.12, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          o.start(now);
          o.stop(now + 0.18);
          break;
        }
        case "toggle": {
          [440, 660].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "sine";
            o.frequency.setValueAtTime(freq, now + i * 0.05);
            g.gain.setValueAtTime(0.1, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.08);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.08);
          });
          break;
        }
      }
    } catch (e) {
    }
  }

  // public/js/core/utils.js
  function escHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[m]);
  }
  function taskXP(task) {
    if (task.hidden) return 300;
    if (task.type === "quiz" && task.xp <= 50) return 50;
    if (task.xp === 0) return 0;
    return task.xp || 100;
  }

  // public/js/core/fx.js
  function typewrite(el, text, speed, cb) {
    let idx = 0;
    el.textContent = "";
    let _done = false;
    function finish() {
      if (_done) return;
      _done = true;
      el.textContent = text;
      if (cb) cb();
    }
    function frame() {
      const end = Math.min(idx + 2, text.length);
      while (idx < end) {
        el.textContent += text[idx];
        if (text[idx] !== " ") {
          try {
            playSound("type");
          } catch (e) {
          }
        }
        idx++;
      }
      if (idx < text.length) {
        setTimeout(frame, speed || 30);
      } else {
        finish();
      }
    }
    frame();
    setTimeout(function() {
      if (!_done) finish();
    }, 6e3);
  }
  function generateTeach(task) {
    const cfg = task.config;

    const explains = {
      "1-0": "\u5148\u8BB2\u6E05\u695A\u88C5\u865A\u62DF\u673A\u8FD9\u6761\u8DEF\uFF1AVMware \u662F\u7ED9 Ubuntu \u5F00\u4E00\u4E2A\u72EC\u7ACB\u7684\u623F\u95F4\uFF08\u865A\u62DF\u673A\uFF09\uFF0C\u548C Windows \u9694\u79BB\u4F46\u5171\u4EAB\u786C\u4EF6\u3002\u4E0B\u8F7D\u4E00\u5F8B\u8D70\u5B98\u7F51\uFF08vmware.com / ubuntu.com/download/server\uFF09\uFF0C\u522B\u78B0\u7834\u89E3\u7248\u2014\u2014\u4EA7\u7EBF\u4E0D\u80FD\u5F15\u5165\u6765\u5386\u4E0D\u660E\u7684\u8F6F\u4EF6\u3002\u88C5\u7684\u65F6\u5019\uFF1A\u5185\u5B58\u5206 2~4GB\u3001\u7F51\u7EDC\u6A21\u5F0F\u9009\u6865\u63A5\uFF08\u8BA9 Ubuntu \u5728\u8F66\u95F4\u4EA4\u6362\u673A\u4E0A\u62E5\u6709\u72EC\u7ACB\u8EAB\u4EFD\uFF09\u3001\u7CFB\u7EDF\u53EA\u88C5 Server \u7248\u4E0D\u88C5\u56FE\u5F62\u754C\u9762\u3002\u6309\u6B65\u9AA4\u6765\uFF0C\u4E00\u6B65\u4E00\u6B65\u522B\u8DF3\u3002\n\u9644\u4E00\u5F20\u300C\u547D\u4EE4\u52A8\u8BCD\u4E2D\u82F1\u5BF9\u7167\u300D\uFF08Linux \u547D\u4EE4\u662F\u82F1\u6587\uFF0C\u8BB0\u4F4F\u8FD9\u51E0\u4E2A\u8BCD\u5C31\u80FD\u770B\u61C2\u5927\u90E8\u5206\u547D\u4EE4\uFF09\uFF1Aupdate=\u66F4\u65B0\uFF08\u62C9\u53D6\u5217\u8868\uFF09\u3001upgrade=\u5347\u7EA7\u3001install=\u5B89\u88C5\u3001remove=\u5378\u8F7D\u3001status=\u67E5\u770B\u72B6\u6001\u3001start=\u542F\u52A8\u3001stop=\u505C\u6B62\u3001enable=\u542F\u7528/\u4F7F\u80FD\uFF08systemctl enable \u573A\u666F\u624D=\u8BBE\u4E3A\u5F00\u673A\u81EA\u542F\uFF09\u3001list=\u5217\u51FA\u3001show=\u663E\u793A\u3001add=\u6DFB\u52A0\u3001ping=\u6D4B\u8FDE\u901A\u3001help=\u5E2E\u52A9\u3002\u540E\u9762\u6572\u547D\u4EE4\u5FD8\u4E86\u5C31\u7FFB\u8FD9\u6761\u3002",
      "1-1": "Ubuntu Server \u4E0D\u88C5\u56FE\u5F62\u754C\u9762\uFF0C\u8FD9\u4E0D\u4EE3\u8868\u64CD\u4F5C\u53D7\u9650\u2014\u2014\u4F60\u53EF\u4EE5\u5750\u5728\u670D\u52A1\u5668\u524D\u63A5\u663E\u793A\u5668\u952E\u76D8\u6572\u547D\u4EE4\uFF0C\u4E5F\u53EF\u4EE5\u5728\u53E6\u4E00\u53F0\u7535\u8111\u751A\u81F3\u624B\u673A\u4E0A\u7528 SSH \u8FDC\u7A0B\u767B\u5F55\u3002\u5DE5\u63A7\u5DE5\u7A0B\u5E08\u7ECF\u5E38\u665A\u4E0A\u8EBA\u5E8A\u4E0A\u62FF\u624B\u673A\u67E5\u670D\u52A1\u5668\u65E5\u5FD7\u2014\u2014\u8DDF\u4F60\u5728\u738B\u8005\u5CE1\u8C37\u64CD\u4F5C\u82F1\u96C4\u6CA1\u4EC0\u4E48\u533A\u522B\uFF0C\u53EA\u4E0D\u8FC7\u8FD9\u6B21\u4F60\u7684\u82F1\u96C4\u662F\u4E00\u53F0 Linux\u3002\u8BB0\u4F4F Shell \u662F bash\uFF0C\u88C5\u8F6F\u4EF6\u7528 apt install\uFF0C\u8FD9\u4E9B\u90FD\u662F\u4F60\u540E\u9762\u6BCF\u5929\u90FD\u8981\u7528\u7684\u57FA\u672C\u64CD\u4F5C\u3002",
      "1-2": "\u8F93\u5165 uname -a \u67E5\u770B\u7CFB\u7EDF\u5B8C\u6574\u4FE1\u606F\u3002\u5148\u8BB0\u4F4F Linux \u547D\u4EE4\u7684\u901A\u7528\u683C\u5F0F\uFF1A\u547D\u4EE4\u540D [\u9009\u9879] [\u53C2\u6570]\uFF0C\u5404\u90E8\u5206\u7528\u7A7A\u683C\u9694\u5F00\u3002\u6BD4\u5982 uname -a\uFF1Auname \u662F\u547D\u4EE4\u540D\uFF0C-a \u662F\u9009\u9879\uFF08\u663E\u793A\u5168\u90E8\u4FE1\u606F\uFF09\u3002\u9009\u9879\u4EE5 - \u5F00\u5934\uFF0C\u53EF\u4EE5\u6709\u597D\u51E0\u4E2A\u3001\u8FD8\u80FD\u5408\u5E76\u5199\uFF08-la = -l -a\uFF09\uFF1B\u957F\u9009\u9879\u7528\u4E24\u4E2A\u77ED\u6A2A\uFF08\u5982 --help\uFF09\u3002\u8BB0\u4F4F\u8FD9\u4E2A\u5957\u8DEF\uFF0C\u540E\u9762\u6240\u6709\u547D\u4EE4\u90FD\u662F\u5B83\u3002",
      "1-3": '\u60F3\u641E\u6E05\u695A"\u6211\u8FD9\u53F0\u7535\u8111\u5728\u7F51\u7EDC\u91CC\u662F\u4EC0\u4E48\u8EAB\u4EFD"\uFF0C\u5C31\u7528 ip addr\u3002\u5148\u8865\u4E2A\u57FA\u7840\uFF1A\u8BA1\u7B97\u673A\u91CC\u6700\u5C0F\u7684\u4FE1\u606F\u5355\u4F4D\u53EB"\u6BD4\u7279\uFF08bit\uFF09"\uFF0C\u4E00\u4E2A\u6BD4\u7279\u53EA\u80FD\u662F 0 \u6216 1\u3002ip addr \u7684\u8F93\u51FA\u91CC\u4F60\u4F1A\u770B\u5230\u4E09\u6837\u4E1C\u897F\uFF1A\u7F51\u5361\uFF08\u8BBE\u5907\u4E0A\u7F51\u7684\u63A5\u53E3\uFF0C\u6BD4\u5982 ens33\uFF09\u3001IP \u5730\u5740\uFF08\u8FD9\u53F0\u8BBE\u5907\u7684\u95E8\u724C\u53F7\uFF0C\u6BD4\u5982 192.168.1.100\uFF09\u3001MAC \u5730\u5740\uFF08\u51FA\u5382\u5C31\u70E7\u5F55\u597D\u7684"\u8EAB\u4EFD\u8BC1"\uFF0C\u4E00\u4E2A\u7F51\u5361\u4E00\u4E2A\u53F7\uFF09\u3002\u8BB0\u4F4F\u8FD9\u4E09\u4E2A\uFF0C\u540E\u9762\u7FFB\u724C\u3001\u6392\u969C\u90FD\u9760\u5B83\u4EEC\u3002',
      "1-3b": "\u5148\u628A IP \u8FD9\u4EF6\u4E8B\u8BF4\u900F\uFF1AIP \u5C31\u662F\u7F51\u7EDC\u4E16\u754C\u7684\u300C\u6536\u8D27\u5730\u5740\u300D\uFF0C\u6570\u636E\u5305\u9760\u5B83\u627E\u5230\u4F60\u7684\u8BBE\u5907\u3002\u8BB0\u4F4F\u4F60\u5176\u5B9E\u6709\u597D\u51E0\u4E2A IP\u2014\u2014\u624B\u673A\u8FDE\u5BB6\u91CC WiFi \u62FF\u5230\u7684 192.168.x.x \u662F\u300C\u5185\u7F51 IP\u300D\uFF0C\u7531\u8DEF\u7531\u5668\u81EA\u52A8\u5206\u914D\uFF0C\u53EA\u5728\u81EA\u5BB6\u7F51\u7EDC\u91CC\u6709\u6548\uFF0C\u50CF\u5C0F\u533A\u95E8\u536B\u53D1\u7684\u7F16\u53F7\uFF1B\u771F\u6B63\u4E0A\u7F51\u65F6\uFF0C\u8FD0\u8425\u5546\uFF08\u5BBD\u5E26\u6216\u624B\u673A\u6D41\u91CF\uFF09\u8FD8\u4F1A\u7ED9\u4F60\u4E00\u4E2A\u300C\u516C\u7F51 IP\u300D\uFF0C\u8FD9\u624D\u662F\u4E92\u8054\u7F51\u4E0A\u5168\u4E16\u754C\u552F\u4E00\u7684\u5BF9\u5916\u95E8\u724C\u53F7\u3002\u800C\u4E14\u8FD9\u4E24\u4E2A IP \u90FD\u662F\u52A8\u6001\u7684\uFF1A\u91CD\u542F\u5149\u732B/\u8DEF\u7531\u5668\u3001\u624B\u673A\u6362\u4E2A\u57FA\u7AD9\u6216\u8005\u5F00\u4E00\u4E0B\u98DE\u884C\u6A21\u5F0F\uFF0CIP \u5E38\u5E38\u5C31\u53D8\u4E86\u3002\u4E00\u53E5\u8BDD\u8BB0\u4F4F\uFF1A\u5185\u7F51 IP \u7BA1\u300C\u5C0F\u533A\u5185\u300D\uFF0C\u516C\u7F51 IP \u7BA1\u300C\u5168\u4E16\u754C\u300D\uFF0C\u800C\u4E14\u90FD\u4E0D\u662F\u56FA\u5B9A\u7684\u3002",

      "1-5": "OSI \u4E03\u5C42\u6A21\u578B\u4ECE\u4E0B\u5230\u4E0A\uFF1A\u7269\u7406\u5C42\uFF08\u7F51\u7EBF\uFF09\u3001\u6570\u636E\u94FE\u8DEF\u5C42\uFF08MAC/\u4EA4\u6362\u673A\uFF09\u3001\u7F51\u7EDC\u5C42\uFF08IP/\u8DEF\u7531\uFF09\u3001\u4F20\u8F93\u5C42\uFF08TCP \u53EF\u9760/UDP \u5FEB\u901F\uFF09\u3001\u4F1A\u8BDD\u5C42\u3001\u8868\u793A\u5C42\u3001\u5E94\u7528\u5C42\uFF08HTTP\uFF09\u3002\u4F20\u8F93\u5C42\u4E24\u4E2A\u534F\u8BAE\u8BB0\u6E05\u695A\uFF1ATCP \u5148\u63E1\u624B\u518D\u4F20\u3001\u4E0D\u4E22\u5305\uFF0C\u9002\u5408\u6587\u4EF6\u4F20\u8F93\uFF1BUDP \u53D1\u51FA\u53BB\u5C31\u4E0D\u7BA1\u3001\u5FEB\u4F46\u6709\u98CE\u9669\uFF0C\u89C6\u9891\u901A\u8BDD\u548C\u4F20\u611F\u5668\u9AD8\u9891\u6570\u636E\u5E38\u7528\u5B83\u3002\u7406\u89E3\u4E86\u4E03\u5C42\uFF0C\u4F60\u5C31\u80FD\u51C6\u786E\u5B9A\u4F4D\u7F51\u7EDC\u95EE\u9898\u51FA\u5728\u54EA\u4E00\u5C42\u3002",
      "1-5b": "\u5237\u89C6\u9891\u5361\u6210 PPT\u3001\u56E2\u6218\u7A81\u7136 460ms \u5EF6\u8FDF\u2014\u2014\u4F60\u558A\u7684\u300C\u7F51\u574F\u4E86\u300D\uFF0C\u5F80\u5F80\u662F TCP/IP \u67D0\u4E00\u5C42\u51FA\u4E86\u95EE\u9898\u3002\u8BB0\u5B9E\u9645\u5E72\u6D3B\u7528\u7684\u7CBE\u7B80\u7248\u2014\u2014TCP/IP \u56DB\u5C42\uFF1A\u5E94\u7528\u5C42(\u9762\u5BF9\u7528\u6237\uFF0CHTTP/DNS)\u3001\u4F20\u8F93\u5C42(\u53EF\u9760\u4F20\u8F93\uFF0CTCP/UDP)\u3001\u7F51\u7EDC\u5C42(\u627E\u8DEF\uFF0CIP/\u8DEF\u7531\u5668)\u3001\u7F51\u7EDC\u63A5\u53E3\u5C42(\u6536\u53D1\u5B57\u8282\uFF0C\u7F51\u5361/\u4EA4\u6362\u673A)\u3002\u8BB0\u6210\u5FEB\u9012\uFF1A\u4E1A\u52A1\u5458\u2192\u5E72\u7EBF\u2192\u5206\u62E3\u2192\u914D\u9001\u3002",
